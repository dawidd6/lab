{{- range .Values.httpRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name | default $.Release.Name }}
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      sectionName: {{ .sectionName | default "https" }}
  {{- with .hostname }}
  hostnames:
    - {{ . }}
  {{- end }}
  rules:
    {{- if .redirect }}
    - filters:
        - type: RequestRedirect
          requestRedirect:
            {{- toYaml .redirect | nindent 12 }}
    {{- else }}
    - backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
    {{- end }}
{{- end }}

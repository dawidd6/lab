apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envoy-https-redirect
  namespace: ingress-system
spec:
  parentRefs:
    - name: envoy
      namespace: ingress-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

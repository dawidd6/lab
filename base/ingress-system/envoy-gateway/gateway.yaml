apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  namespace: ingress-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: '*.${DOMAIN}'
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: dawidd6-duckdns-org-tls
      allowedRoutes:
        namespaces:
          from: All

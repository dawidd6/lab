apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clusterissuer.yaml
  - helmrelease.yaml
  - helmrepository.yaml
configMapGenerator:
  - name: cert-manager-values
    namespace: ingress-system
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled

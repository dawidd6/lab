apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
  namespace: ingress-system
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: tailscale
  valuesFrom:
    - kind: ConfigMap
      name: tailscale-values

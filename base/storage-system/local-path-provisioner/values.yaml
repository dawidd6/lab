nodePathMap: []
storageClassConfigs:
  internal:
    storageClass:
      create: true
      defaultVolumeType: hostPath
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
      pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /data/internal
  external:
    storageClass:
      create: true
      defaultVolumeType: hostPath
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer
      pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /data/external

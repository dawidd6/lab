apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
  namespace: gitops-system
spec:
  interval: 1h
  dependsOn:
    - name: flux-operator
  chart:
    spec:
      chart: flux-instance
      version: 0.61.0
      sourceRef:
        kind: HelmRepository
        name: flux-instance
  valuesFrom:
    - kind: ConfigMap
      name: flux-instance-values

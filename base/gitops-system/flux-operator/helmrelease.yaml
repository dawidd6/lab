apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: gitops-system
spec:
  interval: 1h
  chart:
    spec:
      chart: flux-operator
      version: 0.61.0
      sourceRef:
        kind: HelmRepository
        name: flux-operator
  valuesFrom:
    - kind: ConfigMap
      name: flux-operator-values
    - kind: Secret
      name: flux-web-oidc
      valuesKey: clientSecret
      targetPath: web.config.authentication.oauth2.clientSecret

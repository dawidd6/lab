apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux
  namespace: gitops-system
spec:
  parentRefs:
    - name: envoy
      namespace: ingress-system
      sectionName: https
  hostnames:
    - flux.${DOMAIN}
  rules:
    - backendRefs:
        - name: flux-operator
          port: 9080

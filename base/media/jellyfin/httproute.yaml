apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
    - name: envoy
      namespace: ingress-system
      sectionName: https
  hostnames:
    - jellyfin.${DOMAIN}
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096

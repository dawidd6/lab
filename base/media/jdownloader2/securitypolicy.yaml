apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: jdownloader2
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jdownloader2
  oidc:
    provider:
      issuer: https://tinyauth.${DOMAIN}
    clientID: jdownloader2
    clientSecret:
      name: jdownloader2-oidc

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jdownloader2
  namespace: media
spec:
  parentRefs:
    - name: envoy
      namespace: ingress-system
      sectionName: https
  hostnames:
    - jdownloader.${DOMAIN}
  rules:
    - backendRefs:
        - name: jdownloader2
          port: 10054

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - helmrepository.yaml
  - httproute.yaml
  - secret.yaml
  - securitypolicy.yaml
configMapGenerator:
  - name: jdownloader2-values
    namespace: media
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: secrets-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: 2.2.18
      sourceRef:
        kind: HelmRepository
        name: reloader
  valuesFrom:
    - kind: ConfigMap
      name: reloader-values

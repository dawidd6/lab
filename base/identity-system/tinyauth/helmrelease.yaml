apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinyauth
  namespace: identity-system
spec:
  interval: 1h
  chart:
    spec:
      chart: tinyauth
      version: 2.2.0
      sourceRef:
        kind: HelmRepository
        name: tinyauth
  valuesFrom:
    - kind: ConfigMap
      name: tinyauth-values

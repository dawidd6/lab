apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: dashboard
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: 5.6.0
      sourceRef:
        kind: HelmRepository
        name: homepage
  valuesFrom:
    - kind: ConfigMap
      name: homepage-values

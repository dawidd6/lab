apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: dashboard
spec:
  parentRefs:
    - name: envoy
      namespace: ingress-system
      sectionName: https
  hostnames:
    - homepage.${DOMAIN}
  rules:
    - backendRefs:
        - name: homepage
          port: 80

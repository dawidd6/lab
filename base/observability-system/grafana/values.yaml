testFramework:
  enabled: false
persistence:
  enabled: true
  storageClassName: internal
  size: 1Gi
deploymentStrategy:
  type: Recreate
env:
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oidc
      key: client_secret
grafana.ini:
  server:
    root_url: https://grafana.${DOMAIN}
  auth:
    disable_login_form: true
  auth.generic_oauth:
    enabled: true
    name: tinyauth
    client_id: grafana
    scopes: openid email profile
    auth_url: https://tinyauth.${DOMAIN}/authorize
    token_url: https://tinyauth.${DOMAIN}/api/oidc/token
    api_url: https://tinyauth.${DOMAIN}/api/oidc/userinfo
    use_pkce: true
    auto_login: true
    allow_sign_up: true
    role_attribute_path: preferred_username == 'dawid' && 'Admin' || 'Viewer'
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki:3100
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        options:
          path: /var/lib/grafana/dashboards/default
dashboards:
  default:
    envoy:
      gnetId: 24459
      revision: 3
    cert-manager:
      gnetId: 20842
      revision: 3
    kubernetes-coredns:
      gnetId: 15762
      revision: 22
    kubernetes-nodes:
      gnetId: 15759
      revision: 40
    node-exporter-full:
      gnetId: 1860
      revision: 45
    kubernetes-global:
      gnetId: 15757
      revision: 43
    kubernetes-namespaces:
      gnetId: 15758
      revision: 46
    blackbox-exporter:
      gnetId: 13659
      revision: 1
      datasource:
        - name: DS_PROMETHEUS
          value: Prometheus
    kubernetes-pods:
      gnetId: 15760
      revision: 41

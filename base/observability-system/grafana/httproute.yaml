apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability-system
spec:
  parentRefs:
    - name: envoy
      namespace: ingress-system
      sectionName: https
  hostnames:
    - grafana.${DOMAIN}
  rules:
    - backendRefs:
        - name: grafana
          port: 80

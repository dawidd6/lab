fullnameOverride: blackbox-exporter
config:
  modules:
    http_jellyfin_health:
      prober: http
      timeout: 5s
      http:
        preferred_ip_protocol: ip4
        fail_if_body_not_matches_regexp:
          - ^Healthy$
    http_grafana_health:
      prober: http
      timeout: 5s
      http:
        preferred_ip_protocol: ip4
        fail_if_body_not_matches_regexp:
          - '"database":\s*"ok"'
    dns_duckdns:
      prober: dns
      timeout: 5s
      dns:
        query_name: ${DOMAIN}
        query_type: A
        preferred_ip_protocol: ip4
        valid_rcodes:
          - NOERROR
        validate_answer_rrs:
          fail_if_not_matches_regexp:
            - ${SERVER_IP}
    dns_router_static:
      prober: dns
      timeout: 5s
      dns:
        query_name: ${DOMAIN}
        query_type: A
        preferred_ip_protocol: ip4
        valid_rcodes:
          - NOERROR
        validate_answer_rrs:
          fail_if_not_matches_regexp:
            - '\t0\tIN\tA\t${SERVER_IP}'
    tcp_ssh:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4
        query_response:
          - expect: ^SSH-2.0-

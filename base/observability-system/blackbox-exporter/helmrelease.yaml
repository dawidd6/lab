apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: observability-system
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.20.0
      sourceRef:
        kind: HelmRepository
        name: blackbox-exporter
  valuesFrom:
    - kind: ConfigMap
      name: blackbox-exporter-values

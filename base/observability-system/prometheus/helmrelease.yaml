apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: observability-system
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus
      version: 29.37.0
      sourceRef:
        kind: HelmRepository
        name: prometheus
  valuesFrom:
    - kind: ConfigMap
      name: prometheus-values

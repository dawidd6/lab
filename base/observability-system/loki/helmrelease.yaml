apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability-system
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: 18.17.1
      sourceRef:
        kind: HelmRepository
        name: loki
  valuesFrom:
    - kind: ConfigMap
      name: loki-values

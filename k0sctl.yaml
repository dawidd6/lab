apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: server
spec:
  hosts:
    - role: single
      openSSH:
        address: server
      installFlags:
        - --profile=parallel-pulls
      hooks:
        apply:
          before:
            - sudo timedatectl set-timezone Europe/Warsaw
            - sudo localectl set-locale C
            - grep -q ^LABEL=external /etc/fstab || echo 'LABEL=external /data/external ext4 defaults,noatime,nofail 0 2' | sudo tee -a /etc/fstab
            - findmnt /data/external || { sudo mkdir -p /data/external && sudo chattr +i /data/external && (sudo mount /data/external || true); }
  k0s:
    version: v1.37.1+k0s.0
    config:
      spec:
        workerProfiles:
          - name: parallel-pulls
            values:
              serializeImagePulls: false
              maxParallelImagePulls: 5

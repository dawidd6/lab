apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: server
spec:
  hosts:
    - role: single
      openSSH:
        address: server
      installFlags:
        - --profile=parallel-pulls
      hooks:
        apply:
          before:
            # otherwise Ubuntu kernels from 7.0.0-42 give containers a stacked AppArmor label that containerd's default profile
            # doesn't allow signals for, and .NET apps abort with exit 139 (containerd/containerd#14485)
            - echo kernel.apparmor_restrict_unprivileged_unconfined=0 | sudo tee /etc/sysctl.d/20-apparmor.conf >/dev/null && sudo sysctl -q --system
            # the default 128 inotify instances per user runs out with a few dozen pods (most run as root)
            - echo fs.inotify.max_user_instances=1024 | sudo tee /etc/sysctl.d/90-inotify.conf >/dev/null && sudo sysctl -q --system
            - sudo timedatectl set-timezone Europe/Warsaw
            - sudo localectl set-locale C
            - sudo mkdir -p /data
  k0s:
    version: v1.37.2+k0s.1
    config:
      spec:
        workerProfiles:
          - name: parallel-pulls
            values:
              serializeImagePulls: false
              maxParallelImagePulls: 5

apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: server
spec:
  hosts:
    - role: single
      openSSH:
        address: server
      hooks:
        apply:
          before:
            - sudo timedatectl set-timezone Europe/Warsaw
            - sudo localectl set-locale C
  k0s:
    version: v1.36.4+k0s.1

name: Diff

on:
  pull_request:
    paths:
      - apps/**

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # diff comment
    steps:
      - uses: sholdee/drydock/pr-action@41cd8f7c497d365da4db17fceefde8c2d42dd505 # v0.4.3
        with:
          # app.yaml files are the ApplicationSet's input, not Applications of their own
          discover-ignore: apps/*/*/app.yaml

name: Diff

on:
  pull_request:
    paths:
      - apps/**

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # diff comment
    steps:
      - id: drydock
        continue-on-error: true
        uses: sholdee/drydock/pr-action@b9ea057d0acea877ee93e3dcee6229618d3b83d7 # v0.3.8
        with:
          # app.yaml files are the ApplicationSet's input, not Applications of their own
          discover-ignore: apps/*/*/app.yaml

      # The action installs its binary from a GitHub release, which can return a transient 504.
      - if: steps.drydock.outcome == 'failure'
        run: sleep 30

      - if: steps.drydock.outcome == 'failure'
        uses: sholdee/drydock/pr-action@b9ea057d0acea877ee93e3dcee6229618d3b83d7 # v0.3.8
        with:
          discover-ignore: apps/*/*/app.yaml

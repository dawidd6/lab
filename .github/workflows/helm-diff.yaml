name: helm-diff

on:
  pull_request:
    paths:
      - apps/*/*/app.yaml
      - helmfile.yaml.gotmpl

permissions: {}

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # diff comment
    steps:
      # both sides are checked out to the same path, so helmfile names the output dirs the same
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - uses: helmfile/helmfile-action@614b4cd063ada10b87f668f6ffd35485bce0cac5 # v2.4.8
        with:
          helmfile-args: template -q --output-dir ${{ runner.temp }}/base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: helmfile/helmfile-action@614b4cd063ada10b87f668f6ffd35485bce0cac5 # v2.4.8
        with:
          helmfile-args: template -q --output-dir ${{ runner.temp }}/head
      - uses: int128/diff-action@5808e847fcbe8a6c943e20d5b372204e99eb2de5 # v2.42.0
        id: diff
        with:
          base: ${{ runner.temp }}/base
          head: ${{ runner.temp }}/head
      - uses: int128/comment-action@304df51b76a99f2ba948f8d780d789b5ecc22893 # v1.80.0
        with:
          update-if-exists: replace
          post: ${{ steps.diff.outputs.comment-body || 'No changes in rendered charts.' }}

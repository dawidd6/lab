name: Check

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit compared with too: the pull request base, or the one before the push
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: kubeconform

      - run: mise run check

      - id: deadvalues
        continue-on-error: true
        uses: guarnz/deadvalues@6ed0a88f1513ea7c3c93b3bb9a4b4fc71b951b25 # v0.1.9
        with:
          path: apps
          # the report goes to the job summary; a PR comment would come on every PR, apps changed or not
          comment: false

      # Chart downloads occasionally fail with transient GitHub release gateway errors.
      - if: steps.deadvalues.outcome == 'failure'
        run: sleep 30

      - if: steps.deadvalues.outcome == 'failure'
        uses: guarnz/deadvalues@6ed0a88f1513ea7c3c93b3bb9a4b4fc71b951b25 # v0.1.9
        with:
          path: apps
          comment: false

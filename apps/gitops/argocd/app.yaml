apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
spec:
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.10.5

values:
  configs:
    cm:
      url: https://argocd.dawidd6.duckdns.org
      oidc.config: |
        name: LLDAP
        issuer: https://dex.dawidd6.duckdns.org
        clientID: argocd
        clientSecret: $argocd-oidc:clientSecret
        requestedScopes: [openid, profile, email, groups]
    rbac:
      policy.csv: g, argocd-admins, role:admin
    params:
      server.insecure: true
      controller.diff.server.side: true
      applicationsetcontroller.enable.new.git.file.globbing: true
  dex:
    enabled: false
  notifications:
    enabled: false

valuesExtras:
  httpRoutes:
    - name: argocd
      hostname: argocd.dawidd6.duckdns.org
      service: argocd-server
      port: 80

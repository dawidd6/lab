apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
spec:
  project: default
  destination:
    namespace: argocd
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.10.5

values:
  configs:
    cm:
      url: https://argocd.dawidd6.duckdns.org
    params:
      server.insecure: true
      controller.diff.server.side: true
  dex:
    enabled: false
  notifications:
    enabled: false

valuesExtras:
  httpRoutes:
    - name: argocd
      hostname: argocd.dawidd6.duckdns.org
      service: argocd-server
      port: 80

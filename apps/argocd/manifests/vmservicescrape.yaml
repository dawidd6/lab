# VictoriaMetrics scrapes the application controller's metrics (apps' sync and health) for Grafana's alerts; Argo CD's
# chart only makes ServiceMonitors, whose CRD this cluster doesn't have
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: argocd-application-controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
      app.kubernetes.io/component: application-controller
  endpoints:
    - port: http-metrics

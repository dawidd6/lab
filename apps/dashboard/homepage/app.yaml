apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: oci.trueforge.org/truecharts
      chart: homepage
      targetRevision: 14.2.1
      helm:
        valuesObject:
          service:
            main:
              ports:
                main:
                  port: 3000
          workload:
            main:
              podSpec:
                # copies sample config files in when missing; the files come from git instead
                initContainers:
                  init-config:
                    enabled: false
                containers:
                  main:
                    env:
                      MY_POD_IP:
                        fieldRef:
                          fieldPath: status.podIP
                      # the pod IP for the kubelet probes, which use it as the Host header
                      HOMEPAGE_ALLOWED_HOSTS: $(MY_POD_IP):3000,homepage.dashboard:3000,homepage.dawid.indevs.in
                    envFrom:
                      # HOMEPAGE_VAR_* values referenced as {{HOMEPAGE_VAR_...}} in the config
                      - secretRef:
                          name: homepage-secrets
                          expandObjectName: false
          # Homepage's Kubernetes integration (cluster-wide read access) isn't used
          serviceAccount:
            main:
              enabled: false
          rbac:
            main:
              enabled: false
          forceConfigFromValues: true
          configmap:
            config:
              data:
                # the config itself is under homepage: below; tpl runs on these lines only, not on the YAML they insert,
                # so the {{HOMEPAGE_VAR_...}} placeholders reach Homepage as they are
                # empty rather than left out, since Homepage would create a sample one
                bookmarks.yaml: "[]"
                services.yaml: |
                  {{- toYaml .Values.homepage.services | nindent 2 }}
                settings.yaml: |
                  {{- toYaml .Values.homepage.settings | nindent 2 }}
                widgets.yaml: |
                  {{- toYaml .Values.homepage.widgets | nindent 2 }}
          persistence:
            # Homepage writes logs and default files here; the config files are mounted on top
            config:
              type: emptyDir
            kubernetes-config:
              enabled: false
          route:
            main:
              enabled: true
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - homepage.dawid.indevs.in
          homepage:
            services:
              - Services:
                  - GitHub:
                      href: https://github.com/notifications
                      icon: github.png
                      widget:
                        type: customapi
                        url: https://api.github.com/notifications
                        refreshInterval: 300000
                        headers:
                          Authorization: Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}
                          Accept: application/vnd.github+json
                          # GitHub's API rejects requests without one
                          User-Agent: homepage
                        display: dynamic-list
                        mappings:
                          name: subject.title
                          label: repository.full_name
                          limit: 5
                  - Tailscale:
                      href: https://login.tailscale.com/admin/machines
                      icon: tailscale.png
                      widget:
                        type: tailscale
                        deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
                        key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
                  - Cloudflare:
                      href: https://dash.cloudflare.com
                      icon: cloudflare.png
                      widget:
                        type: customapi
                        url: https://dns.google/resolve?name=dawid.indevs.in&type=A
                        refreshInterval: 300000
                        mappings:
                          - field: Answer.0.data
                            label: IP
                          - field: Answer.0.TTL
                            label: TTL
                            format: number
                            suffix: s
              - Vitals:
                  - CPU:
                      widget:
                        type: glances
                        url: http://glances.observability:61208
                        version: 4
                        metric: cpu
                  - Memory:
                      widget:
                        type: glances
                        url: http://glances.observability:61208
                        version: 4
                        metric: memory
                  - Internal disk:
                      widget:
                        type: glances
                        url: http://glances.observability:61208
                        version: 4
                        metric: fs:/rootfs
                  - External disk:
                      widget:
                        type: glances
                        url: http://glances.observability:61208
                        version: 4
                        metric: fs:/rootfs/data/external
                  - CPU temperature:
                      widget:
                        type: glances
                        url: http://glances.observability:61208
                        version: 4
                        metric: sensor:Package id 0
                  - Memory temperature:
                      widget:
                        type: glances
                        url: http://glances.observability:61208
                        version: 4
                        metric: sensor:Memory
                  - NVMe temperature:
                      widget:
                        type: glances
                        url: http://glances.observability:61208
                        version: 4
                        metric: sensor:Composite
                  - Ambient temperature:
                      widget:
                        type: glances
                        url: http://glances.observability:61208
                        version: 4
                        metric: sensor:Ambient

              - Apps:
                  - SABnzbd:
                      href: https://sabnzbd.dawid.indevs.in
                      icon: sabnzbd.png
                      siteMonitor: http://sabnzbd.media:8080
                      widget:
                        type: sabnzbd
                        url: http://sabnzbd.media:8080
                        # SABnzbd generates it on first start: Config > General > API Key
                        key: "{{HOMEPAGE_VAR_SABNZBD_KEY}}"
                        fields: ["rate", "queue", "timeleft"]
                  - Radarr:
                      href: https://radarr.dawid.indevs.in
                      icon: radarr.png
                      siteMonitor: http://radarr.media:7878
                      widget:
                        type: radarr
                        url: http://radarr.media:7878
                        key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
                  - Sonarr:
                      href: https://sonarr.dawid.indevs.in
                      icon: sonarr.png
                      siteMonitor: http://sonarr.media:8989
                      widget:
                        type: sonarr
                        url: http://sonarr.media:8989
                        key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
                  - Prowlarr:
                      href: https://prowlarr.dawid.indevs.in
                      icon: prowlarr.png
                      siteMonitor: http://prowlarr.media:9696
                      widget:
                        type: prowlarr
                        url: http://prowlarr.media:9696
                        key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
                  - Bazarr:
                      href: https://bazarr.dawid.indevs.in
                      icon: bazarr.png
                      siteMonitor: http://bazarr.media:6767
                      widget:
                        type: bazarr
                        url: http://bazarr.media:6767
                        # Bazarr generates it itself (Settings > General); copied into homepage-secrets
                        key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
                        fields: ["missingEpisodes", "missingMovies"]
                  - ntfy:
                      href: https://ntfy.dawid.indevs.in
                      icon: ntfy.png
                      siteMonitor: http://ntfy.observability/v1/health
                      widget:
                        type: ntfy
                        url: http://ntfy.observability
                        topic: lab
                  - Duplicati:
                      href: https://duplicati.dawid.indevs.in
                      icon: duplicati.png
                      siteMonitor: http://duplicati.backup:8200
                      widget:
                        type: duplicati
                        url: http://duplicati.backup:8200
                        password: "{{HOMEPAGE_VAR_DUPLICATI_PASSWORD}}"
                  - Argo CD:
                      href: https://argocd.dawid.indevs.in
                      icon: argo-cd.png
                      siteMonitor: http://argocd-server.delivery/healthz
                      widget:
                        type: argocd
                        url: http://argocd-server.delivery
                        key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
                        fields: ["apps", "synced", "outOfSync", "healthy"]
                  - Jellyfin:
                      href: https://jellyfin.dawid.indevs.in
                      icon: jellyfin.png
                      siteMonitor: http://jellyfin.media:8096/health
                  - JDownloader:
                      href: https://jdownloader2.dawid.indevs.in
                      icon: jdownloader.png
                      siteMonitor: http://jdownloader2.media:5800
                  - Grafana:
                      href: https://grafana.dawid.indevs.in
                      icon: grafana.png
                      siteMonitor: http://grafana.observability/api/health
                  - Tinyauth:
                      href: https://tinyauth.dawid.indevs.in
                      icon: tinyauth.png
                      siteMonitor: http://tinyauth.identity/api/healthz
                  - cert-manager:
                      href: https://crt.sh/?q=dawid.indevs.in
                      icon: cert-manager.png
                      widget:
                        type: prometheusmetric
                        url: http://prometheus-server.observability
                        refreshInterval: 3600000
                        metrics:
                          # the soonest-expiring Let's Encrypt certificate
                          - label: Expires in
                            query: min(certmanager_certificate_expiration_timestamp_seconds{issuer_name="letsencrypt"} - time()) / 86400
                            format:
                              type: number
                              suffix: " days"
                              options:
                                maximumFractionDigits: 0
                          - label: Ready
                            query: sum(certmanager_certificate_ready_status{condition="True"})
                          - label: Not ready
                            query: sum(certmanager_certificate_ready_status{condition!="True"})

              - Repositories:
                  - dawidd6/lab:
                      href: https://github.com/dawidd6/lab
                      icon: github.png
                      widget:
                        type: customapi
                        # GraphQL, because the REST API counts PRs as issues
                        url: https://api.github.com/graphql
                        method: POST
                        refreshInterval: 900000
                        headers:
                          Authorization: Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}
                          User-Agent: homepage
                        requestBody:
                          query: |
                            {
                              repository(owner: "dawidd6", name: "lab") {
                                pullRequests(states: OPEN) { totalCount }
                                issues(states: OPEN) { totalCount }
                                pushedAt
                              }
                            }
                        mappings:
                          - field: data.repository.pullRequests.totalCount
                            label: Open PRs
                            format: number
                          - field: data.repository.issues.totalCount
                            label: Open issues
                            format: number
                          - field: data.repository.pushedAt
                            label: Last push
                            format: relativeDate
              - Releases:
                  - Kubernetes:
                      href: https://github.com/kubernetes/kubernetes/releases
                      icon: kubernetes.png
                      widget:
                        type: feed
                        url: https://github.com/kubernetes/kubernetes/releases.atom
                        maxItems: 5
                        images: false
                  - k0s:
                      href: https://github.com/k0sproject/k0s/releases
                      icon: kubernetes.png
                      widget:
                        type: feed
                        url: https://github.com/k0sproject/k0s/releases.atom
                        maxItems: 5
                        images: false
                  - SABnzbd:
                      href: https://github.com/sabnzbd/sabnzbd/releases
                      icon: sabnzbd.png
                      widget:
                        type: feed
                        url: https://github.com/sabnzbd/sabnzbd/releases.atom
                        maxItems: 5
                        images: false
                  - Radarr:
                      href: https://github.com/Radarr/Radarr/releases
                      icon: radarr.png
                      widget:
                        type: feed
                        url: https://github.com/Radarr/Radarr/releases.atom
                        maxItems: 5
                        images: false
                  - Sonarr:
                      href: https://github.com/Sonarr/Sonarr/releases
                      icon: sonarr.png
                      widget:
                        type: feed
                        url: https://github.com/Sonarr/Sonarr/releases.atom
                        maxItems: 5
                        images: false
                  - Prowlarr:
                      href: https://github.com/Prowlarr/Prowlarr/releases
                      icon: prowlarr.png
                      widget:
                        type: feed
                        url: https://github.com/Prowlarr/Prowlarr/releases.atom
                        maxItems: 5
                        images: false
                  - Bazarr:
                      href: https://github.com/morpheus65535/bazarr/releases
                      icon: bazarr.png
                      widget:
                        type: feed
                        url: https://github.com/morpheus65535/bazarr/releases.atom
                        maxItems: 5
                        images: false
                  - ntfy:
                      href: https://github.com/binwiederhier/ntfy/releases
                      icon: ntfy.png
                      widget:
                        type: feed
                        url: https://github.com/binwiederhier/ntfy/releases.atom
                        maxItems: 5
                        images: false
                  - Duplicati:
                      href: https://github.com/duplicati/duplicati/releases
                      icon: duplicati.png
                      widget:
                        type: feed
                        url: https://github.com/duplicati/duplicati/releases.atom
                        maxItems: 5
                        images: false
                  - Argo CD:
                      href: https://github.com/argoproj/argo-cd/releases
                      icon: argo-cd.png
                      widget:
                        type: feed
                        url: https://github.com/argoproj/argo-cd/releases.atom
                        maxItems: 5
                        images: false
                  - Tailscale:
                      href: https://github.com/tailscale/tailscale/releases
                      icon: tailscale.png
                      widget:
                        type: feed
                        url: https://github.com/tailscale/tailscale/releases.atom
                        maxItems: 5
                        images: false
                  - Jellyfin:
                      href: https://github.com/jellyfin/jellyfin/releases
                      icon: jellyfin.png
                      widget:
                        type: feed
                        url: https://github.com/jellyfin/jellyfin/releases.atom
                        maxItems: 5
                        images: false
                  - JDownloader:
                      href: https://github.com/jlesage/docker-jdownloader-2/releases
                      icon: jdownloader.png
                      widget:
                        type: feed
                        url: https://github.com/jlesage/docker-jdownloader-2/releases.atom
                        maxItems: 5
                        images: false
                  - Grafana:
                      href: https://github.com/grafana/grafana/releases
                      icon: grafana.png
                      widget:
                        type: feed
                        url: https://github.com/grafana/grafana/releases.atom
                        maxItems: 5
                        images: false
                  - Tinyauth:
                      href: https://github.com/tinyauthapp/tinyauth/releases
                      icon: tinyauth.png
                      widget:
                        type: feed
                        url: https://github.com/tinyauthapp/tinyauth/releases.atom
                        maxItems: 5
                        images: false
                  - cert-manager:
                      href: https://github.com/cert-manager/cert-manager/releases
                      icon: cert-manager.png
                      widget:
                        type: feed
                        url: https://github.com/cert-manager/cert-manager/releases.atom
                        maxItems: 5
                        images: false
            settings:
              title: Server
              headerStyle: clean
              statusStyle: dot
              blockStyle: refined
              color: neutral
              background:
                image: https://raw.githubusercontent.com/tinyauthapp/tinyauth/c3b5c0443e9407d451f7d9473e1ab666220ff676/assets/background.jpg
                opacity: 50
                brightness: 50
                saturate: 50
              # a list, since Helm's toYaml would sort a map's keys and Homepage orders groups by this
              layout:
                - Services:
                    style: row
                    columns: 4
                - Repositories:
                    style: row
                    columns: 4
                - Vitals:
                    style: row
                    columns: 4
                - Apps:
                    style: row
                    columns: 4
                - Releases:
                    style: row
                    columns: 4
            widgets:
              - datetime:
                  text_size: xl
                  format:
                    dateStyle: long
                    timeStyle: short
                    hourCycle: h23
              # Intl.DateTimeFormat rejects timeStyle together with timeZoneName, so the time parts are listed instead
              - datetime:
                  format:
                    hour: 2-digit
                    minute: 2-digit
                    hourCycle: h23
                    timeZone: UTC
                    timeZoneName: short
              - openmeteo:
                  label: Wrocław
                  latitude: 51.1079
                  longitude: 17.0385
                  timezone: Europe/Warsaw
                  units: metric
                  cache: 5
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/dashboard/homepage/manifests

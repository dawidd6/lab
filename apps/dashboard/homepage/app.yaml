apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
spec:
  source:
    repoURL: ghcr.io/m0nsterrr/helm-charts
    chart: homepage
    targetRevision: 5.9.0

values:
  extraEnvFrom:
    - secretRef:
        name: homepage-secrets
  config:
    allowedHosts:
      - homepage.dawidd6.duckdns.org
  volumes:
    - name: homepage-config
      configMap:
        name: homepage-config
  volumeMounts:
    - name: homepage-config
      mountPath: /app/config/settings.yaml
      subPath: settings.yaml
    - name: homepage-config
      mountPath: /app/config/services.yaml
      subPath: services.yaml
    - name: homepage-config
      mountPath: /app/config/widgets.yaml
      subPath: widgets.yaml
    - name: homepage-config
      mountPath: /app/config/bookmarks.yaml
      subPath: bookmarks.yaml

valuesExtra:
  httpRoutes:
    - name: homepage
      hostname: homepage.dawidd6.duckdns.org
      service: homepage
      port: 80
  configMaps:
    - name: homepage-config
      data:
        settings.yaml:
          title: Server
          headerStyle: clean
          layout:
            Lab: {}
            Services: {}
            Server: {}
        widgets.yaml:
          - datetime:
              text_size: xl
              format:
                dateStyle: long
                timeStyle: short
                hourCycle: h23
          - datetime:
              format:
                hour: 2-digit
                minute: 2-digit
                hourCycle: h23
                timeZone: UTC
                timeZoneName: short
          - openmeteo:
              label: Wrocław
              latitude: 51.1079
              longitude: 17.0385
              timezone: Europe/Warsaw
              units: metric
              cache: 5
          - search:
              provider: google
              showSearchSuggestions: true
              target: _blank
        services.yaml:
          - Services:
              - Jellyfin:
                  href: https://jellyfin.dawidd6.duckdns.org
                  icon: jellyfin.png
                  siteMonitor: http://jellyfin.media:8096/health
              - JDownloader:
                  href: https://jdownloader.dawidd6.duckdns.org
                  icon: jdownloader.png
                  siteMonitor: http://jdownloader2.media:10054
              - Argo CD:
                  href: https://argocd.dawidd6.duckdns.org
                  icon: argo-cd.png
                  siteMonitor: http://argocd-server.delivery/healthz
              - Grafana:
                  href: https://grafana.dawidd6.duckdns.org
                  icon: grafana.png
                  siteMonitor: http://grafana.observability/api/health
              - Tinyauth:
                  href: https://tinyauth.dawidd6.duckdns.org
                  icon: tinyauth.png
                  siteMonitor: http://tinyauth.identity/api/healthz
          - Server:
              - Sensors:
                  icon: prometheus.png
                  widget:
                    type: prometheusmetric
                    url: http://prometheus-server.observability
                    metrics:
                      - label: CPU
                        query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Package id 0"})
                        format:
                          type: number
                          suffix: " °C"
                          options:
                            maximumFractionDigits: 0
                      - label: NVMe
                        query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Composite"})
                        format:
                          type: number
                          suffix: " °C"
                          options:
                            maximumFractionDigits: 0
                      - label: Memory
                        query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Memory"})
                        format:
                          type: number
                          suffix: " °C"
                          options:
                            maximumFractionDigits: 0
                      - label: Ambient
                        query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Ambient"})
                        format:
                          type: number
                          suffix: " °C"
                          options:
                            maximumFractionDigits: 0
              - Resources:
                  icon: prometheus.png
                  widget:
                    type: prometheusmetric
                    url: http://prometheus-server.observability
                    metrics:
                      - label: CPU
                        query: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100
                        format:
                          type: percent
                      - label: Memory
                        query: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
                        format:
                          type: percent
                      - label: External disk free
                        query: node_filesystem_avail_bytes{mountpoint="/data/external"}
                        format:
                          type: bytes
                      - label: Internal disk free
                        query: node_filesystem_avail_bytes{mountpoint="/"}
                        format:
                          type: bytes
              - Tailscale:
                  href: https://login.tailscale.com/admin/machines
                  icon: tailscale.png
                  widget:
                    type: tailscale
                    deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
                    key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
              - GitHub:
                  - Repository:
                      href: https://github.com/dawidd6/lab
                      icon: github.png
                      widget:
                        type: customapi
                        url: https://api.github.com/repos/dawidd6/lab
                        mappings:
                          - field: stargazers_count
                            label: Stars
                            format: number
                          - field: forks_count
                            label: Forks
                            format: number
                          - field: open_issues_count
                            label: Open issues
                            format: number
                          - field: pushed_at
                            label: Last push
                            format: relativeDate
                  - Kubernetes releases:
                      href: https://github.com/kubernetes/kubernetes/releases
                      icon: kubernetes.png
                      widget:
                        type: feed
                        url: https://github.com/kubernetes/kubernetes/releases.atom
                        maxItems: 5
                        images: false
        bookmarks.yaml:
          - Lab:
              - Repository:
                  - href: https://github.com/dawidd6/lab
                    icon: github.png
              - Tailscale:
                  - href: https://login.tailscale.com/admin/machines
                    icon: tailscale.png
              - DuckDNS:
                  - href: https://www.duckdns.org
                    icon: duckdns.png

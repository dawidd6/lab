apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
spec:
  source:
    repoURL: ghcr.io/m0nsterrr/helm-charts
    chart: homepage
    targetRevision: 5.6.0

values:
  image:
    registry: ghcr.io
    repository: gethomepage/homepage
    tag: v2.7.0
  extraEnvFrom:
    - secretRef:
        name: homepage-secrets
  config:
    allowedHosts:
      - homepage.dawidd6.duckdns.org
  volumes:
    - name: homepage-config
      configMap:
        name: homepage-config
  volumeMounts:
    - name: homepage-config
      mountPath: /app/config/settings.yaml
      subPath: settings.yaml
    - name: homepage-config
      mountPath: /app/config/services.yaml
      subPath: services.yaml
    - name: homepage-config
      mountPath: /app/config/widgets.yaml
      subPath: widgets.yaml
    - name: homepage-config
      mountPath: /app/config/kubernetes.yaml
      subPath: kubernetes.yaml
    - name: homepage-config
      mountPath: /app/config/bookmarks.yaml
      subPath: bookmarks.yaml

valuesExtras:
  httpRoutes:
    - name: homepage
      hostname: homepage.dawidd6.duckdns.org
      service: homepage
      port: 80
  configMaps:
    - name: homepage-config
      data:
        bookmarks.yaml:
          - Links:
              - Lab repository:
                  - href: https://github.com/dawidd6/lab
                    icon: github.png
              - Tailscale:
                  - href: https://login.tailscale.com/admin/machines
                    icon: tailscale.png
              - DuckDNS:
                  - href: https://www.duckdns.org
                    icon: duckdns.png
        settings.yaml:
          title: Server
          headerStyle: clean
        kubernetes.yaml:
          mode: cluster
        widgets.yaml:
          - kubernetes:
              cluster:
                show: true
                cpu: true
                memory: true
                showLabel: true
                label: server
              nodes:
                show: false
          - openmeteo:
              label: Warsaw
              latitude: 52.2297
              longitude: 21.0122
              timezone: Europe/Warsaw
              units: metric
              cache: 5
          - search:
              provider: duckduckgo
              target: _blank
          - datetime:
              format:
                dateStyle: long
                timeStyle: short
        services.yaml:
          - Media:
              - Jellyfin:
                  href: https://jellyfin.dawidd6.duckdns.org
                  icon: jellyfin.png
                  siteMonitor: http://jellyfin.media:8096/health
                  namespace: media
                  app: jellyfin
                  widget:
                    type: jellyfin
                    version: 2
                    url: http://jellyfin.media:8096
                    key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
                    enableBlocks: true
              - JDownloader:
                  href: https://jdownloader.dawidd6.duckdns.org
                  icon: jdownloader.png
                  siteMonitor: http://jdownloader2.media:10054
                  namespace: media
                  app: jdownloader2
          - GitOps:
              - Argo CD:
                  href: https://argocd.dawidd6.duckdns.org
                  icon: argo-cd.png
                  siteMonitor: http://argocd-server.gitops-system/healthz
                  namespace: gitops-system
                  app: argocd-server
                  widget:
                    type: argocd
                    url: http://argocd-server.gitops-system
                    key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
          - Observability:
              - Grafana:
                  href: https://grafana.dawidd6.duckdns.org
                  icon: grafana.png
                  siteMonitor: http://grafana.observability-system/api/health
                  namespace: observability-system
                  app: grafana
              - Prometheus:
                  icon: prometheus.png
                  namespace: observability-system
                  app: prometheus
                  widget:
                    type: prometheus
                    url: http://prometheus-server.observability-system
              - Temperatures:
                  icon: prometheus.png
                  widget:
                    type: prometheusmetric
                    url: http://prometheus-server.observability-system
                    metrics:
                      - label: CPU
                        query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Package id 0"})
                        format:
                          type: number
                          suffix: " °C"
                          options:
                            maximumFractionDigits: 0
                      - label: NVMe
                        query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Composite"})
                        format:
                          type: number
                          suffix: " °C"
                          options:
                            maximumFractionDigits: 0
                      - label: Memory
                        query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Memory"})
                        format:
                          type: number
                          suffix: " °C"
                          options:
                            maximumFractionDigits: 0
                      - label: Ambient
                        query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Ambient"})
                        format:
                          type: number
                          suffix: " °C"
                          options:
                            maximumFractionDigits: 0
              - Resources:
                  icon: prometheus.png
                  widget:
                    type: prometheusmetric
                    url: http://prometheus-server.observability-system
                    metrics:
                      - label: CPU
                        query: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100
                        format:
                          type: percent
                      - label: Memory
                        query: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
                        format:
                          type: percent
                      - label: USB drive free
                        query: node_filesystem_avail_bytes{mountpoint="/data/external"}
                        format:
                          type: bytes
                      - label: System disk free
                        query: node_filesystem_avail_bytes{mountpoint="/"}
                        format:
                          type: bytes
          - Identity:
              - tinyauth:
                  href: https://tinyauth.dawidd6.duckdns.org
                  icon: tinyauth.png
                  siteMonitor: http://tinyauth.identity-system/api/healthz
                  namespace: identity-system
                  app: tinyauth
          - Ingress:
              - Tailscale:
                  href: https://login.tailscale.com/admin/machines
                  icon: tailscale.png
                  widget:
                    type: tailscale
                    deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
                    key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"

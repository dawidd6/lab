apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: oci.trueforge.org/truecharts
      chart: homepage
      targetRevision: 14.3.0
      helm:
        valuesObject:
          service:
            main:
              ports:
                main:
                  port: 3000
          workload:
            main:
              podSpec:
                # copies sample config files in when missing; the files come from git instead
                initContainers:
                  init-config:
                    enabled: false
                containers:
                  main:
                    env:
                      MY_POD_IP:
                        fieldRef:
                          fieldPath: status.podIP
                      # the pod IP for the kubelet probes, which use it as the Host header
                      HOMEPAGE_ALLOWED_HOSTS: $(MY_POD_IP):3000,homepage.dawid.us.ci
                    envFrom:
                      # HOMEPAGE_VAR_* values referenced as {{HOMEPAGE_VAR_...}} in the config
                      - secretRef:
                          name: homepage-secrets
                          expandObjectName: false
          # Homepage's Kubernetes integration (cluster-wide read access) isn't used
          serviceAccount:
            main:
              enabled: false
          rbac:
            main:
              enabled: false
          forceConfigFromValues: true
          configmap:
            config:
              data:
                # the config itself is under homepage: below; tpl runs on these lines only, not on the YAML they insert,
                # so the {{HOMEPAGE_VAR_...}} placeholders reach Homepage as they are
                # empty rather than left out, since Homepage would create a sample one
                bookmarks.yaml: "[]"
                services.yaml: |
                  {{- toYaml .Values.homepage.services | nindent 2 }}
                settings.yaml: |
                  {{- toYaml .Values.homepage.settings | nindent 2 }}
                widgets.yaml: |
                  {{- toYaml .Values.homepage.widgets | nindent 2 }}
          persistence:
            # Homepage writes logs and default files here; the config files are mounted on top
            config:
              type: emptyDir
            kubernetes-config:
              enabled: false
          route:
            main:
              enabled: true
              # Authelia login (SecurityPolicy in apps/ingress/envoy-gateway/manifests)
              labels:
                auth: authelia
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - homepage.dawid.us.ci
          homepage:
            services:
              - Watch:
                  - Jellyfin:
                      href: https://jellyfin.dawid.us.ci
                      icon: jellyfin.png
                      siteMonitor: http://jellyfin.media:8096/health
                      widget:
                        type: jellyfin
                        url: http://jellyfin.media:8096
                        # created in Jellyfin (Dashboard > API Keys), not something Jellyfin can take from config
                        key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
                        # Jellyfin 10.12 and later
                        version: 2
                        enableBlocks: true
                        enableNowPlaying: false
                        fields: ["movies", "series", "episodes"]
                  - Seerr:
                      href: https://seerr.dawid.us.ci
                      icon: seerr.png
                      siteMonitor: http://seerr.media/api/v1/status
                      widget:
                        type: seerr
                        url: http://seerr.media
                        key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

              - Automation:
                  - Radarr:
                      href: https://radarr.dawid.us.ci
                      icon: radarr.png
                      siteMonitor: http://radarr.media:7878
                      widget:
                        type: radarr
                        url: http://radarr.media:7878
                        key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
                  - Sonarr:
                      href: https://sonarr.dawid.us.ci
                      icon: sonarr.png
                      siteMonitor: http://sonarr.media:8989
                      widget:
                        type: sonarr
                        url: http://sonarr.media:8989
                        key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
                  - Prowlarr:
                      href: https://prowlarr.dawid.us.ci
                      icon: prowlarr.png
                      siteMonitor: http://prowlarr.media:9696
                      widget:
                        type: prowlarr
                        url: http://prowlarr.media:9696
                        key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
                  - Bazarr:
                      href: https://bazarr.dawid.us.ci
                      icon: bazarr.png
                      siteMonitor: http://bazarr.media:6767
                      widget:
                        type: bazarr
                        url: http://bazarr.media:6767
                        # Bazarr generates it itself (Settings > General); copied into homepage-secrets
                        key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
                        fields: ["missingEpisodes", "missingMovies"]

              - Downloads:
                  - SABnzbd:
                      href: https://sabnzbd.dawid.us.ci
                      icon: sabnzbd.png
                      siteMonitor: http://sabnzbd.media:8080
                      widget:
                        type: sabnzbd
                        url: http://sabnzbd.media:8080
                        # SABnzbd generates it on first start: Config > General > API Key
                        key: "{{HOMEPAGE_VAR_SABNZBD_KEY}}"
                        fields: ["rate", "queue", "timeleft"]
                  - JDownloader:
                      href: https://jdownloader2.dawid.us.ci
                      icon: jdownloader.png
                      siteMonitor: http://jdownloader2.media:5800

              - Calendar:
                  - Upcoming:
                      icon: mdi-calendar
                      widget:
                        type: calendar
                        view: agenda
                        maxEvents: 10
                        showTime: true
                        # events come from the Sonarr and Radarr widgets above, found by group and service name
                        integrations:
                          - type: sonarr
                            service_group: Automation
                            service_name: Sonarr
                            baseUrl: https://sonarr.dawid.us.ci
                          - type: radarr
                            service_group: Automation
                            service_name: Radarr
                            baseUrl: https://radarr.dawid.us.ci

              - Resources:
                  - CPU:
                      widget:
                        # the Vitals widgets below merge these in too (<<: *glances); the anchor leaves metric out,
                        # since kubeconform -strict rejects a merged key set again
                        <<: &glances
                          type: glances
                          url: http://glances.observability:61208
                          version: 4
                        metric: cpu
                  - Memory:
                      widget:
                        <<: *glances
                        metric: memory
                  - Internal disk:
                      widget:
                        <<: *glances
                        metric: fs:/rootfs
                  - External disk:
                      widget:
                        <<: *glances
                        metric: fs:/rootfs/data/external

              - Sensors:
                  - CPU temperature:
                      widget:
                        <<: *glances
                        metric: sensor:Package id 0
                  - Memory temperature:
                      widget:
                        <<: *glances
                        metric: sensor:Memory
                  - NVMe temperature:
                      widget:
                        <<: *glances
                        metric: sensor:Composite
                  - Ambient temperature:
                      widget:
                        <<: *glances
                        metric: sensor:Ambient

              - Platform:
                  - ntfy:
                      href: https://ntfy.dawid.us.ci
                      icon: ntfy.png
                      siteMonitor: http://ntfy.observability/v1/health
                      widget:
                        type: ntfy
                        url: http://ntfy.observability
                        topic: server
                        key: "{{HOMEPAGE_VAR_NTFY_TOKEN}}"
                  - Duplicati:
                      href: https://duplicati.dawid.us.ci
                      icon: duplicati.png
                      siteMonitor: http://duplicati.backup:8200
                      widget:
                        type: duplicati
                        url: http://duplicati.backup:8200
                        password: "{{HOMEPAGE_VAR_DUPLICATI_PASSWORD}}"
                  - Argo CD:
                      href: https://argocd.dawid.us.ci
                      icon: argo-cd.png
                      siteMonitor: http://argocd-server.delivery/healthz
                      widget:
                        type: argocd
                        url: http://argocd-server.delivery
                        key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
                        fields: ["apps", "synced", "outOfSync", "healthy"]
                  - cert-manager:
                      href: https://crt.sh/?q=dawid.us.ci
                      icon: cert-manager.png
                      # the controller's metrics port; its /livez port has no Service
                      siteMonitor: http://cert-manager.ingress:9402/metrics
                      widget:
                        type: prometheusmetric
                        url: http://prometheus-server.observability
                        refreshInterval: 3600000
                        metrics:
                          # the soonest-expiring Let's Encrypt certificate
                          - label: Expires in
                            query: min(certmanager_certificate_expiration_timestamp_seconds{issuer_name="letsencrypt"} - time()) / 86400
                            format:
                              type: number
                              suffix: " days"
                              options:
                                maximumFractionDigits: 0
                          - label: Ready
                            query: sum(certmanager_certificate_ready_status{condition="True"})
                          - label: Not ready
                            query: sum(certmanager_certificate_ready_status{condition!="True"})
                  - Grafana:
                      href: https://grafana.dawid.us.ci
                      icon: grafana.png
                      siteMonitor: http://grafana.observability/api/health
                  - Authelia:
                      href: https://authelia.dawid.us.ci
                      icon: authelia.png
                      siteMonitor: http://authelia.identity/api/health

              - Services:
                  - GitHub:
                      href: https://github.com/dawidd6/lab
                      icon: github.png
                      widget:
                        type: customapi
                        # GraphQL, because the REST API counts PRs as issues
                        url: https://api.github.com/graphql
                        method: POST
                        refreshInterval: 900000
                        headers:
                          Authorization: Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}
                          User-Agent: homepage
                        requestBody:
                          query: |
                            {
                              repository(owner: "dawidd6", name: "lab") {
                                pullRequests(states: OPEN) { totalCount }
                                issues(states: OPEN) { totalCount }
                                pushedAt
                              }
                            }
                        mappings:
                          - field: data.repository.pullRequests.totalCount
                            label: Open PRs
                            format: number
                          - field: data.repository.issues.totalCount
                            label: Open issues
                            format: number
                          - field: data.repository.pushedAt
                            label: Last push
                            format: relativeDate
                  - Tailscale:
                      href: https://login.tailscale.com/admin/machines
                      icon: tailscale.png
                      widget:
                        type: tailscale
                        deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
                        key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
                  - Cloudflare:
                      href: https://dash.cloudflare.com
                      icon: cloudflare.png
                      widget:
                        type: customapi
                        url: https://dns.google/resolve?name=dawid.us.ci&type=A
                        refreshInterval: 300000
                        mappings:
                          - field: Answer.0.data
                            label: IP
                          - field: Answer.0.TTL
                            label: TTL
                            format: number
                            suffix: s
            settings:
              title: Server
              headerStyle: clean
              statusStyle: dot
              blockStyle: refined
              color: neutral
              # a list, since Helm's toYaml would sort a map's keys and Homepage orders tabs and groups by this
              layout:
                - Watch:
                    tab: Media
                    style: row
                    columns: 2
                - Automation:
                    tab: Media
                    style: row
                    columns: 4
                - Downloads:
                    tab: Media
                    style: row
                    columns: 2
                - Calendar:
                    tab: Media
                    style: row
                    columns: 1
                - Resources:
                    tab: Server
                    style: row
                    columns: 4
                - Sensors:
                    tab: Server
                    style: row
                    columns: 4
                - Platform:
                    tab: Server
                    style: row
                    columns: 4
                - Services:
                    tab: Server
                    style: row
                    columns: 4
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/dashboard/homepage/manifests

- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23
# Intl.DateTimeFormat rejects timeStyle together with timeZoneName, so the time parts are listed instead
- datetime:
    format:
      hour: 2-digit
      minute: 2-digit
      hourCycle: h23
      timeZone: UTC
      timeZoneName: short
- openmeteo:
    label: Wrocław
    latitude: 51.1079
    longitude: 17.0385
    timezone: Europe/Warsaw
    units: metric
    cache: 5

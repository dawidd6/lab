apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      containers:
        - name: app
          image: ghcr.io/gethomepage/homepage:v2.7.0
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # the pod IP is for the kubelet probes, which use it as the Host header
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: $(MY_POD_IP):3000,homepage.dawidd6.duckdns.org
          envFrom:
            # HOMEPAGE_VAR_* values referenced as {{HOMEPAGE_VAR_...}} in the config
            - secretRef:
                name: homepage-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
          # single files, so Homepage can still write its logs and defaults into /app/config
          volumeMounts:
            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
      volumes:
        - name: config
          configMap:
            name: homepage-config
      enableServiceLinks: false

# Homepage has no login of its own; envoy authenticates through tinyauth
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: homepage
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: homepage
  oidc:
    provider:
      issuer: https://tinyauth.dawidd6.duckdns.org
    clientID: homepage
    clientSecret:
      name: homepage-oidc

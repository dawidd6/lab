- System:
    - CPU:
        widget:
          type: glances
          url: http://glances.observability:61208
          version: 4
          metric: cpu
    - Memory:
        widget:
          type: glances
          url: http://glances.observability:61208
          version: 4
          metric: memory
    - Internal disk:
        widget:
          type: glances
          url: http://glances.observability:61208
          version: 4
          metric: fs:/rootfs
    - External disk:
        widget:
          type: glances
          url: http://glances.observability:61208
          version: 4
          metric: fs:/rootfs/data/external
    - CPU temperature:
        widget:
          type: glances
          url: http://glances.observability:61208
          version: 4
          metric: sensor:Package id 0
    - Memory temperature:
        widget:
          type: glances
          url: http://glances.observability:61208
          version: 4
          metric: sensor:Memory
    - NVMe temperature:
        widget:
          type: glances
          url: http://glances.observability:61208
          version: 4
          metric: sensor:Composite
    - Ambient temperature:
        widget:
          type: glances
          url: http://glances.observability:61208
          version: 4
          metric: sensor:Ambient


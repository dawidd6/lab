apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynacat
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dynacat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynacat
    spec:
      containers:
        - name: app
          image: docker.io/panonim/dynacat:3.0.2
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dynacat-secrets
                  key: client-secret
            - name: DYNACAT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dynacat-secrets
                  key: secret-key
            - name: TAILSCALE_KEY
              valueFrom:
                secretKeyRef:
                  name: dynacat-secrets
                  key: tailscale-key
            - name: TAILSCALE_DEVICE_ID
              valueFrom:
                secretKeyRef:
                  name: dynacat-secrets
                  key: tailscale-device-id
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dynacat-secrets
                  key: argocd-token
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dynacat-secrets
                  key: github-token
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          configMap:
            name: dynacat-config
      enableServiceLinks: false

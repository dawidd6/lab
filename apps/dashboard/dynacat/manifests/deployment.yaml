apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynacat
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dynacat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynacat
    spec:
      initContainers:
        # ConfigMap mounts are read-only; the UI editor needs a writable copy, refreshed from git on every start
        - name: config
          image: docker.io/panonim/dynacat:3.0.2
          command:
            - cp
            - /configmap/dynacat.yml
            - /app/config/dynacat.yml
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: configmap
              mountPath: /configmap
      containers:
        - name: app
          image: docker.io/panonim/dynacat:3.0.2
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dynacat-secrets
                  key: client-secret
            - name: DYNACAT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dynacat-secrets
                  key: secret-key
            - name: TAILSCALE_KEY
              valueFrom:
                secretKeyRef:
                  name: dynacat-secrets
                  key: tailscale-key
            - name: TAILSCALE_DEVICE_ID
              valueFrom:
                secretKeyRef:
                  name: dynacat-secrets
                  key: tailscale-device-id
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          emptyDir: {}
        - name: configmap
          configMap:
            name: dynacat-config
      enableServiceLinks: false

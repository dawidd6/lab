apiVersion: v1
kind: ConfigMap
metadata:
  name: dynacat-config
data:
  dynacat.yml: |
    theme:
      custom-css-file: /assets/user.css
    server:
      proxied: true
      editing-users:
        - dawid
    auth:
      secret-key: ${DYNACAT_SECRET_KEY}
      disable-password: true
      auto-redirect-oidc: true
      oidc:
        issuer-url: https://tinyauth.dawidd6.duckdns.org
        client-id: dynacat
        client-secret: ${OIDC_CLIENT_SECRET}
        redirect-url: https://dynacat.dawidd6.duckdns.org/api/oidc/callback
        allowed-users:
          - dawid
    pages:
      - name: Home
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 24h
                timezones:
                  - timezone: UTC
              - type: weather
                hour-format: 24h
                location: Wroclaw, Poland
                units: metric
              - type: group
                widgets:
                  - type: markets
                    title: Crypto
                    symbol-link-template: &yahoo https://finance.yahoo.com/quote/{SYMBOL}/
                    chart-link-template: *yahoo
                    markets:
                      - symbol: BTC-USD
                        name: Bitcoin
                      - symbol: ETH-USD
                        name: Ethereum
                      - symbol: SOL-USD
                        name: Solana
                  - type: markets
                    title: FX
                    symbol-link-template: *yahoo
                    chart-link-template: *yahoo
                    markets:
                      - symbol: EURPLN=X
                        name: EUR/PLN
                      - symbol: USDPLN=X
                        name: USD/PLN
                      - symbol: GBPPLN=X
                        name: GBP/PLN
                  - type: markets
                    title: Commodities
                    symbol-link-template: *yahoo
                    chart-link-template: *yahoo
                    markets:
                      - symbol: GC=F
                        name: Gold
                      - symbol: SI=F
                        name: Silver
                      - symbol: CL=F
                        name: Crude oil (WTI)
                      - symbol: BZ=F
                        name: Brent oil
                  - type: markets
                    title: ETFs
                    symbol-link-template: *yahoo
                    chart-link-template: *yahoo
                    markets:
                      - symbol: AVWS.DE
                        name: Avantis Global Small Cap Value
                      - symbol: ISAC.L
                        name: iShares MSCI ACWI
                      - symbol: ISLN.L
                        name: iShares Physical Silver
                      - symbol: JEDI.L
                        name: VanEck Space Innovators
              # HICP is Eurostat's harmonised measure (close to, not identical with, GUS CPI);
              # the policy rate is the NBP reference rate as published by BIS (weekly)
              - type: custom-api
                title: Poland
                cache: 6h
                url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_minr
                parameters:
                  geo: PL
                  unit: RCH_A
                  coicop18: TOTAL
                  lastTimePeriod: "1"
                  format: JSON
                subrequests:
                  rate:
                    url: https://stats.bis.org/api/v1/data/WS_CBPOL/D.PL/all
                    headers:
                      Accept: application/vnd.sdmx.data+json;version=1.0.0
                    parameters:
                      lastNObservations: "1"
                template: |
                  {{ $rate := .Subrequest "rate" }}
                  <div class="flex justify-between text-center">
                    <div>
                      <div class="color-highlight size-h3">{{ .JSON.Float "value.0" | printf "%.1f" }}%</div>
                      <div class="size-h6">INFLATION Y/Y</div>
                      <div class="size-h6 color-subdue">{{ .JSON.String "dimension.time.category.index|@keys|0" }}</div>
                    </div>
                    <div>
                      <div class="color-highlight size-h3">{{ $rate.JSON.String "data.dataSets.0.series.0:0.observations.0.0" }}%</div>
                      <div class="size-h6">NBP RATE</div>
                      <div class="size-h6 color-subdue">{{ $rate.JSON.String "data.structure.dimensions.observation.0.values.0.id" }}</div>
                    </div>
                  </div>
              - type: bookmarks
                groups:
                  - title: Lab
                    links:
                      - title: Repository
                        url: https://github.com/dawidd6/lab
                        icon: di:github
                      - title: Tailscale
                        url: https://login.tailscale.com/admin/machines
                        icon: di:tailscale
                      - title: DuckDNS
                        url: https://www.duckdns.org
                        icon: di:duckdns
          - size: full
            widgets:
              - type: search
                new-tab: true
                search-engine: google
                autocomplete: true
                autocomplete-provider: brave
              - type: monitor
                title: Services
                sites:
                  - title: Jellyfin
                    url: https://jellyfin.dawidd6.duckdns.org
                    check-url: http://jellyfin.media:8096/health
                    icon: di:jellyfin
                  - title: JDownloader
                    url: https://jdownloader.dawidd6.duckdns.org
                    check-url: http://jdownloader2.media:10054
                    icon: di:jdownloader
                  - title: Argo CD
                    url: https://argocd.dawidd6.duckdns.org
                    check-url: http://argocd-server.delivery/healthz
                    icon: di:argo-cd
                  - title: Grafana
                    url: https://grafana.dawidd6.duckdns.org
                    check-url: http://grafana.observability/api/health
                    icon: di:grafana
                  - title: Tinyauth
                    url: https://tinyauth.dawidd6.duckdns.org
                    check-url: http://tinyauth.identity/api/healthz
                    icon: di:tinyauth
              - type: reddit
                subreddit: Polska
          - size: small
            widgets:
              - type: custom-api
                title: Sensors
                title-icon: di:prometheus
                parameters:
                  query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Package id 0"})
                subrequests:
                  ambient:
                    parameters:
                      query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Ambient"})
                    url: http://prometheus-server.observability/api/v1/query
                  memory:
                    parameters:
                      query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Memory"})
                    url: http://prometheus-server.observability/api/v1/query
                  nvme:
                    parameters:
                      query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Composite"})
                    url: http://prometheus-server.observability/api/v1/query
                template: |-
                  <div class="flex justify-between text-center">
                    <div><div class="color-highlight size-h3">{{ .JSON.Float "data.result.0.value.1" | printf "%.0f" }}°C</div><div class="size-h6">CPU</div></div>
                    <div><div class="color-highlight size-h3">{{ (.Subrequest "memory").JSON.Float "data.result.0.value.1" | printf "%.0f" }}°C</div><div class="size-h6">MEMORY</div></div>
                    <div><div class="color-highlight size-h3">{{ (.Subrequest "nvme").JSON.Float "data.result.0.value.1" | printf "%.0f" }}°C</div><div class="size-h6">NVME</div></div>
                    <div><div class="color-highlight size-h3">{{ (.Subrequest "ambient").JSON.Float "data.result.0.value.1" | printf "%.0f" }}°C</div><div class="size-h6">AMBIENT</div></div>
                  </div>
                url: http://prometheus-server.observability/api/v1/query
              - type: custom-api
                title: Resources
                title-icon: di:prometheus
                parameters:
                  query: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100
                subrequests:
                  disk:
                    parameters:
                      query: node_filesystem_avail_bytes{mountpoint="/"}
                    url: http://prometheus-server.observability/api/v1/query
                  memory:
                    parameters:
                      query: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
                    url: http://prometheus-server.observability/api/v1/query
                  usb:
                    parameters:
                      query: node_filesystem_avail_bytes{mountpoint="/data/external"}
                    url: http://prometheus-server.observability/api/v1/query
                template: |-
                  <div class="flex justify-between text-center">
                    <div><div class="color-highlight size-h3">{{ .JSON.Float "data.result.0.value.1" | printf "%.0f" }}%</div><div class="size-h6">CPU</div></div>
                    <div><div class="color-highlight size-h3">{{ (.Subrequest "memory").JSON.Float "data.result.0.value.1" | printf "%.0f" }}%</div><div class="size-h6">MEMORY</div></div>
                  </div>
                  <div class="flex justify-between text-center margin-top-10">
                    <div><div class="color-highlight size-h3">{{ div ((.Subrequest "usb").JSON.Float "data.result.0.value.1") 1073741824 | printf "%.0f" }} GB</div><div class="size-h6">EXTERNAL DISK FREE</div></div>
                    <div><div class="color-highlight size-h3">{{ div ((.Subrequest "disk").JSON.Float "data.result.0.value.1") 1073741824 | printf "%.0f" }} GB</div><div class="size-h6">INTERNAL DISK FREE</div></div>
                  </div>
                url: http://prometheus-server.observability/api/v1/query
              - type: custom-api
                title: Tailscale
                title-icon: di:tailscale
                headers:
                  Authorization: Bearer ${TAILSCALE_KEY}
                template: |
                  <ul class="list list-gap-10">
                    <li class="color-highlight">{{ .JSON.String "hostname" }} · {{ .JSON.String "addresses.0" }}</li>
                    <li class="size-h6">last seen <span {{ .JSON.String "lastSeen" | parseRelativeTime "rfc3339" }}></span> ago</li>
                    {{ if not (.JSON.Bool "keyExpiryDisabled") }}
                    <li class="size-h6">key expires <span {{ .JSON.String "expires" | parseRelativeTime "rfc3339" }}></span></li>
                    {{ end }}
                  </ul>
                url: https://api.tailscale.com/api/v2/device/${TAILSCALE_DEVICE_ID}
              - type: repository
                repository: dawidd6/lab
              - type: releases
                repositories:
                  - repository: kubernetes/kubernetes
                  - repository: k0sproject/k0s
  user.css: |
    /* hide the 21-day sparkline in markets widgets */
    .market-chart {
      display: none;
    }
    /* the chart used to push the prices to the right edge */
    .market-values {
      margin-left: auto;
    }

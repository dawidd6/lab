server:
  proxied: true
  # config comes from git; UI edits would be lost on the next restart
  allow-editing: false
auth:
  secret-key: ${DYNACAT_SECRET_KEY}
  disable-password: true
  auto-redirect-oidc: true
  oidc:
    issuer-url: https://tinyauth.dawidd6.duckdns.org
    client-id: dynacat
    client-secret: ${OIDC_CLIENT_SECRET}
    redirect-url: https://dynacat.dawidd6.duckdns.org/api/oidc/callback
    allowed-users:
      - dawid
pages:
  - name: Home
    columns:
      - size: full
        widgets:
          - type: split-column
            widgets:
              - type: clock
                hour-format: 24h
                timezones:
                  - timezone: UTC
              - type: weather
                update-interval: 1h
                hour-format: 24h
                location: Wroclaw, Poland
                units: metric
          - type: split-column
            max-columns: 3
            widgets:
              - type: monitor
                title: Services
                update-interval: 1m
                sites:
                  - title: Jellyfin
                    url: https://jellyfin.dawidd6.duckdns.org
                    check-url: http://jellyfin.media:8096/health
                    icon: di:jellyfin
                  - title: JDownloader
                    url: https://jdownloader.dawidd6.duckdns.org
                    check-url: http://jdownloader2.media:10054
                    icon: di:jdownloader
                  - title: Argo CD
                    url: https://argocd.dawidd6.duckdns.org
                    check-url: http://argocd-server.delivery/healthz
                    icon: di:argo-cd
                  - title: Grafana
                    url: https://grafana.dawidd6.duckdns.org
                    check-url: http://grafana.observability/api/health
                    icon: di:grafana
                  - title: Tinyauth
                    url: https://tinyauth.dawidd6.duckdns.org
                    check-url: http://tinyauth.identity/api/healthz
                    icon: di:tinyauth
              - type: custom-api
                title: Tailscale
                update-interval: 15m
                headers:
                  Authorization: Bearer ${TAILSCALE_KEY}
                template: |
                  <ul class="list list-gap-10">
                    <li class="color-highlight">{{ .JSON.String "hostname" }} · {{ .JSON.String "addresses.0" }}</li>
                    <li class="size-h6">last seen <span {{ .JSON.String "lastSeen" | parseRelativeTime "rfc3339" }}></span> ago</li>
                    {{ if not (.JSON.Bool "keyExpiryDisabled") }}
                    <li class="size-h6">key expires <span {{ .JSON.String "expires" | parseRelativeTime "rfc3339" }}></span></li>
                    {{ end }}
                  </ul>
                url: https://api.tailscale.com/api/v2/device/${TAILSCALE_DEVICE_ID}
              - type: bookmarks
                groups:
                  - title: Lab
                    links:
                      - title: Repository
                        url: https://github.com/dawidd6/lab
                        icon: di:github
                      - title: Tailscale
                        url: https://login.tailscale.com/admin/machines
                        icon: di:tailscale
                      - title: DuckDNS
                        url: https://www.duckdns.org
                        icon: di:duckdns
          - type: split-column
            max-columns: 3
            widgets:
              - type: custom-api
                title: Argo CD
                update-interval: 15s
                title-url: https://argocd.dawidd6.duckdns.org
                url: http://argocd-server.delivery/api/v1/applications
                headers:
                  Authorization: Bearer ${ARGOCD_TOKEN}
                parameters:
                  fields: items.metadata.name,items.status.sync.status,items.status.health
                template: |
                  {{ $apps := .JSON.Array "items" }}
                  <div class="flex gap-45 text-center">
                    <div><div class="color-highlight size-h3">{{ len $apps }}</div><div class="size-h6">APPS</div></div>
                    <div><div class="color-highlight size-h3">{{ .JSON.Int `items.#(status.sync.status=="Synced")#|#` }}</div><div class="size-h6">SYNCED</div></div>
                    <div><div class="color-highlight size-h3">{{ .JSON.Int `items.#(status.health.status=="Healthy")#|#` }}</div><div class="size-h6">HEALTHY</div></div>
                  </div>
              - type: custom-api
                title: Sensors
                update-interval: 1m
                parameters:
                  query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Package id 0"})
                subrequests:
                  ambient:
                    parameters:
                      query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Ambient"})
                    url: http://prometheus-server.observability/api/v1/query
                  memory:
                    parameters:
                      query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Memory"})
                    url: http://prometheus-server.observability/api/v1/query
                  nvme:
                    parameters:
                      query: max(node_hwmon_temp_celsius * on(chip, sensor) group_left node_hwmon_sensor_label{label="Composite"})
                    url: http://prometheus-server.observability/api/v1/query
                template: |-
                  <div class="flex gap-45 text-center">
                    <div><div class="color-highlight size-h3">{{ .JSON.Float "data.result.0.value.1" | printf "%.0f" }}°C</div><div class="size-h6">CPU</div></div>
                    <div><div class="color-highlight size-h3">{{ (.Subrequest "memory").JSON.Float "data.result.0.value.1" | printf "%.0f" }}°C</div><div class="size-h6">MEMORY</div></div>
                    <div><div class="color-highlight size-h3">{{ (.Subrequest "nvme").JSON.Float "data.result.0.value.1" | printf "%.0f" }}°C</div><div class="size-h6">NVME</div></div>
                    <div><div class="color-highlight size-h3">{{ (.Subrequest "ambient").JSON.Float "data.result.0.value.1" | printf "%.0f" }}°C</div><div class="size-h6">AMBIENT</div></div>
                  </div>
                url: http://prometheus-server.observability/api/v1/query
              - type: server-stats
                # read live from node_exporter (the one Prometheus scrapes), not through Prometheus
                update-interval: 15s
                servers:
                  - type: node-exporter
                    name: server
                    url: http://prometheus-prometheus-node-exporter.observability:9100
                    hide-mountpoints-by-default: true
                    mountpoints:
                      "/":
                        name: Internal
                        hide: false
                      "/data/external":
                        name: External
                        hide: false
          - type: split-column
            max-columns: 3
            widgets:
              # needs a classic token with only the "notifications" scope; fine-grained tokens can't read notifications
              - type: custom-api
                title: Notifications
                title-url: https://github.com/notifications
                update-interval: 5m
                url: https://api.github.com/notifications
                headers:
                  Authorization: Bearer ${GITHUB_TOKEN}
                  Accept: application/vnd.github+json
                template: |
                  {{ $items := .JSON.Array "" }}
                  {{ if eq (len $items) 0 }}
                  <p class="color-subdue">No unread notifications</p>
                  {{ else }}
                  <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                    {{ range $items }}
                    {{ $repo := concat "https://github.com/" (.String "repository.full_name") }}
                    {{ $url := .String "subject.url" | replaceAll "api.github.com/repos/" "github.com/" | replaceAll "/pulls/" "/pull/" | replaceAll "/commits/" "/commit/" }}
                    {{ if or (eq $url "") (eq (.String "subject.type") "Release") }}{{ $url = $repo }}{{ end }}
                    <li>
                      <a class="size-title-dynamic color-primary-if-not-visited" href="{{ $url }}" target="_blank" rel="noreferrer">{{ .String "subject.title" }}</a>
                      <ul class="list-horizontal-text">
                        <li>{{ .String "repository.full_name" }}</li>
                        <li>{{ .String "reason" | replaceAll "_" " " }}</li>
                        <li {{ .String "updated_at" | parseRelativeTime "rfc3339" }}></li>
                      </ul>
                    </li>
                    {{ end }}
                  </ul>
                  {{ end }}
              - type: repository
                repository: dawidd6/lab
                update-interval: 15m
                token: ${GITHUB_TOKEN}
              - type: releases
                update-interval: 1h
                token: ${GITHUB_TOKEN}
                repositories:
                  - repository: kubernetes/kubernetes
                  - repository: k0sproject/k0s

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - dynacat-secrets.sops.yaml
  - httproute.yaml
  - service.yaml
# keeps dynacat.yml a plain file instead of a string inside a ConfigMap
configMapGenerator:
  - name: dynacat-config
    files:
      - dynacat.yml
    options:
      disableNameSuffixHash: true

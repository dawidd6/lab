apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: duplicati
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: duplicati
  oidc:
    provider:
      issuer: https://tinyauth.dawid.indevs.in
    clientID: envoy
    clientSecret:
      name: envoy-oidc
      namespace: ingress

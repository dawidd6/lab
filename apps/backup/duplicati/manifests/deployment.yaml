apiVersion: apps/v1
kind: Deployment
metadata:
  name: duplicati
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: duplicati
  template:
    metadata:
      labels:
        app.kubernetes.io/name: duplicati
    spec:
      containers:
        - name: app
          # runs as root (the image default) so it can read every app's files, whoever owns them
          image: docker.io/duplicati/duplicati:2.4.1.0
          env:
            # Duplicati refuses unknown hostnames (IPs are always allowed, so the kubelet probes work)
            - name: DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES
              value: duplicati.dawidd6.duckdns.org;duplicati.backup
          envFrom:
            # SETTINGS_ENCRYPTION_KEY (encrypts the settings database, which holds destination credentials)
            # DUPLICATI__WEBSERVICE_PASSWORD (UI login, also in homepage-secrets for the Homepage widget)
            - secretRef:
                name: duplicati-secrets
          livenessProbe:
            tcpSocket:
              port: 8200
          readinessProbe:
            tcpSocket:
              port: 8200
          volumeMounts:
            - name: data
              mountPath: /data
            # backup source, read-only: every app's config volume on the internal disk
            - name: internal
              mountPath: /source/internal
              readOnly: true
            # backup destination on the external disk
            - name: backups
              mountPath: /backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: duplicati-data
        - name: internal
          hostPath:
            path: /data/internal
            type: Directory
        - name: backups
          persistentVolumeClaim:
            claimName: duplicati-backups
      enableServiceLinks: false

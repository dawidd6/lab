# no SecurityPolicy: LAN only, and Duplicati has its own login that can't be turned off
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: duplicati
spec:
  parentRefs:
    - name: envoy
      namespace: ingress
      sectionName: https
  hostnames:
    - duplicati.dawidd6.duckdns.org
  rules:
    - backendRefs:
        - name: duplicati
          port: 8200

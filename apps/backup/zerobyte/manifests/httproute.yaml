# no SecurityPolicy: LAN only, and Zerobyte has its own accounts (and native OIDC, see tinyauth's zerobyte client)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zerobyte
spec:
  parentRefs:
    - name: envoy
      namespace: ingress
      sectionName: https
  hostnames:
    - zerobyte.dawidd6.duckdns.org
  rules:
    - backendRefs:
        - name: zerobyte
          port: 4096

apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerobyte
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zerobyte
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zerobyte
    spec:
      containers:
        - name: app
          # runs as root (the image default) so it can read every app's files, whoever owns them;
          # no SYS_ADMIN/FUSE: only local directories are backed up, no remote shares are mounted
          image: ghcr.io/nicotsx/zerobyte:v0.43.2
          env:
            - name: BASE_URL
              value: https://zerobyte.dawidd6.duckdns.org
            # behind envoy: trust its X-Forwarded-For
            - name: TRUST_PROXY
              value: "true"
            # backup schedules run in this time zone
            - name: TZ
              value: Europe/Warsaw
          envFrom:
            # APP_SECRET (encrypts sensitive data in its database)
            - secretRef:
                name: zerobyte-secrets
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: 4096
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: 4096
          volumeMounts:
            - name: data
              mountPath: /var/lib/zerobyte
            # backup source, read-only: every app's config volume on the internal disk
            - name: internal
              mountPath: /source/internal
              readOnly: true
            # backup destination on the external disk
            - name: backups
              mountPath: /backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zerobyte-data
        - name: internal
          hostPath:
            path: /data/internal
            type: Directory
        - name: backups
          persistentVolumeClaim:
            claimName: zerobyte-backups
      enableServiceLinks: false

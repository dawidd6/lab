# Backrest's own login is turned off (first-run setup); envoy authenticates through tinyauth instead
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: backrest
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: backrest
  oidc:
    provider:
      issuer: https://tinyauth.dawidd6.duckdns.org
    clientID: backrest
    clientSecret:
      name: backrest-oidc

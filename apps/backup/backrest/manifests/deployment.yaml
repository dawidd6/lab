apiVersion: apps/v1
kind: Deployment
metadata:
  name: backrest
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backrest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backrest
    spec:
      containers:
        - name: app
          # runs as root (the image default) so it can read every app's files, whoever owns them
          image: ghcr.io/garethgeorge/backrest:v1.14.1
          env:
            # config (repos, plans, schedules, hooks), operation history and restic's cache, all on one volume
            - name: BACKREST_CONFIG
              value: /var/lib/backrest/config/config.json
            - name: BACKREST_DATA
              value: /var/lib/backrest/data
            - name: XDG_CACHE_HOME
              value: /var/lib/backrest/cache
            # backup schedules run in this time zone
            - name: TZ
              value: Europe/Warsaw
          livenessProbe:
            tcpSocket:
              port: 9898
          readinessProbe:
            tcpSocket:
              port: 9898
          volumeMounts:
            - name: data
              mountPath: /var/lib/backrest
            # backup source, read-only: every app's config volume on the internal disk
            - name: internal
              mountPath: /source/internal
              readOnly: true
            # backup destination on the external disk
            - name: backups
              mountPath: /backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backrest-data
        - name: internal
          hostPath:
            path: /data/internal
            type: Directory
        - name: backups
          persistentVolumeClaim:
            claimName: backrest-backups
      enableServiceLinks: false

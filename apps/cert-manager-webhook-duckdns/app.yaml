apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-duckdns
spec:
  project: default
  destination:
    namespace: cert-manager
  source:
    repoURL: ghcr.io/cobexer/charts
    chart: cert-manager-webhook-duckdns
    targetRevision: 2.0.0

values:
  certManager:
    namespace: cert-manager
  secret:
    existingSecret: true
    existingSecretName: duckdns

valuesExtras: {}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: oci.trueforge.org/truecharts
      chart: gatus
      targetRevision: 5.2.0
      helm:
        valuesObject:
          # history in SQLite on the volume below instead of the chart's CloudNativePG cluster
          cnpg:
            main:
              enabled: false
          persistence:
            data:
              enabled: true
              mountPath: /data
              storageClass: internal
              size: 1Gi
          configmap:
            config:
              data:
                # the config itself is under gatus: below
                config.yaml: |
                  {{- toYaml .Values.gatus | nindent 2 }}
          route:
            main:
              enabled: true
              # tinyauth login (SecurityPolicy in apps/ingress/envoy-gateway/manifests)
              labels:
                auth: tinyauth
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - gatus.dawid.indevs.in
          gatus:
            storage:
              type: sqlite
              path: /data/data.db
            alerting:
              ntfy:
                url: http://ntfy.observability
                topic: lab
                default-alert:
                  send-on-resolved: true
            # every endpoint alerts through ntfy (alerts: *ntfy) and most only need a 200 (conditions: *ok)
            endpoints:
              - name: SABnzbd
                group: Apps
                url: http://sabnzbd.media:8080
                conditions: &ok
                  - "[STATUS] == 200"
                alerts: &ntfy
                  - type: ntfy
              - name: Radarr
                group: Apps
                url: http://radarr.media:7878/ping
                conditions: *ok
                alerts: *ntfy
              - name: Sonarr
                group: Apps
                url: http://sonarr.media:8989/ping
                conditions: *ok
                alerts: *ntfy
              - name: Prowlarr
                group: Apps
                url: http://prowlarr.media:9696/ping
                conditions: *ok
                alerts: *ntfy
              - name: Bazarr
                group: Apps
                url: http://bazarr.media:6767
                conditions: *ok
                alerts: *ntfy
              - name: JDownloader
                group: Apps
                url: http://jdownloader2.media:5800
                conditions: *ok
                alerts: *ntfy
              - name: Jellyfin
                group: Apps
                url: http://jellyfin.media:8096/health
                conditions:
                  - "[STATUS] == 200"
                  - "[BODY] == Healthy"
                alerts: *ntfy
              - name: Duplicati
                group: Apps
                url: http://duplicati.backup:8200
                conditions: *ok
                alerts: *ntfy
              - name: Homepage
                group: Apps
                url: http://homepage.dashboard:3000
                conditions: *ok
                alerts: *ntfy
              - name: Argo CD
                group: Platform
                url: http://argocd-server.delivery/healthz
                conditions: *ok
                alerts: *ntfy
              - name: Tinyauth
                group: Platform
                url: http://tinyauth.identity/api/healthz
                conditions: *ok
                alerts: *ntfy
              - name: Grafana
                group: Observability
                url: http://grafana.observability/api/health
                conditions:
                  - "[STATUS] == 200"
                  - "[BODY].database == ok"
                alerts: *ntfy
              - name: Prometheus
                group: Observability
                url: http://prometheus-server.observability/-/healthy
                conditions: *ok
                alerts: *ntfy
              - name: Loki
                group: Observability
                url: http://loki.observability:3100/ready
                conditions: *ok
                alerts: *ntfy
              - name: Glances
                group: Observability
                url: http://glances.observability:61208/api/4/status
                conditions: *ok
                alerts: *ntfy
              # no alert: it would go through ntfy itself
              - name: ntfy
                group: Observability
                url: http://ntfy.observability/v1/health
                conditions:
                  - "[STATUS] == 200"
                  - "[BODY].healthy == true"
              # the way in from outside: DNS, envoy and the certificate (renewed 30 days ahead, so under 14 means renewal is failing)
              - name: Gateway
                group: Network
                url: https://tinyauth.dawid.indevs.in/api/healthz
                conditions:
                  - "[STATUS] == 200"
                  - "[CERTIFICATE_EXPIRATION] > 336h"
                alerts: *ntfy
              - name: DNS (Cloudflare)
                group: Network
                url: anastasia.ns.cloudflare.com
                dns:
                  query-name: dawid.indevs.in
                  query-type: A
                conditions:
                  - "[DNS_RCODE] == NOERROR"
                  - "[BODY] == 192.168.1.109"
                alerts: *ntfy
              # the router's static dnsmasq entry; without it, its rebind protection returns nothing for the LAN address
              - name: DNS (router)
                group: Network
                url: 192.168.1.1
                dns:
                  query-name: dawid.indevs.in
                  query-type: A
                conditions:
                  - "[DNS_RCODE] == NOERROR"
                  - "[BODY] == 192.168.1.109"
                alerts: *ntfy
              - name: SSH
                group: Network
                url: tcp://192.168.1.109:22
                conditions:
                  - "[CONNECTED] == true"
                alerts: *ntfy

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glances
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: oci.trueforge.org/truecharts
      chart: glances
      targetRevision: 4.1.2
      helm:
        valuesObject:
          podOptions:
            # the web UI's process list shows the host's processes, not only Glances itself
            hostPID: true
          persistence:
            rootfs:
              enabled: true
              type: hostPath
              hostPath: /
              mountPath: /rootfs
              readOnly: true
              mountPropagation: HostToContainer
            os-release:
              enabled: true
              type: hostPath
              hostPath: /etc/os-release
              hostPathType: File
              mountPath: /etc/os-release
              readOnly: true

          route:
            main:
              enabled: true
              # Authelia login (SecurityPolicy in apps/ingress/envoy-gateway/manifests)
              labels:
                auth: authelia
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - glances.dawid.us.ci

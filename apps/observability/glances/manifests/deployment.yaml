apiVersion: apps/v1
kind: Deployment
metadata:
  name: glances
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: glances
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glances
    spec:
      containers:
        - name: app
          image: docker.io/nicolargo/glances:4.5.8
          env:
            # web UI and the REST API that Homepage uses
            - name: GLANCES_OPT
              value: -w
          livenessProbe:
            httpGet:
              path: /api/4/status
              port: 61208
          readinessProbe:
            httpGet:
              path: /api/4/status
              port: 61208
          volumeMounts:
            # CPU, memory and sensors come from the host's /proc and /sys as seen in any container;
            # disk usage needs the host filesystems, sub-mounts (/data/external) included
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
              mountPropagation: HostToContainer
            - name: os-release
              mountPath: /etc/os-release
              readOnly: true
      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: os-release
          hostPath:
            path: /etc/os-release
            type: File
      # the web UI's process list shows the host's processes, not only Glances itself
      hostPID: true
      enableServiceLinks: false

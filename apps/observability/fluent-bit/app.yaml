apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
spec:
  sources:
    - repoURL: https://fluent.github.io/helm-charts
      chart: fluent-bit
      targetRevision: 0.58.3
      helm:
        valuesObject:
          testFramework:
            enabled: false
          config:
            inputs: |
              [INPUT]
                  Name tail
                  Path /var/log/containers/*.log
                  multiline.parser cri
                  Tag kube.*
                  Mem_Buf_Limit 5MB
                  Skip_Long_Lines On

              [INPUT]
                  Name systemd
                  Tag host.*
                  Read_From_Tail On
            filters: |
              [FILTER]
                  Name kubernetes
                  Match kube.*
                  Merge_Log Off
                  Labels Off
                  Annotations Off

              [FILTER]
                  Name record_modifier
                  Match host.*
                  Allowlist_key MESSAGE
                  Allowlist_key PRIORITY
                  Allowlist_key SYSLOG_IDENTIFIER
                  Allowlist_key _SYSTEMD_UNIT
            outputs: |
              [OUTPUT]
                  Name loki
                  Match kube.*
                  Host loki
                  Port 3100
                  Labels job=pods, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name']
                  Remove_Keys kubernetes, stream, _p
                  Drop_Single_Key raw
                  Line_Format json

              [OUTPUT]
                  Name loki
                  Match host.*
                  Host loki
                  Port 3100
                  Labels job=journal, unit=$_SYSTEMD_UNIT, identifier=$SYSLOG_IDENTIFIER, priority=$PRIORITY
                  Remove_Keys _SYSTEMD_UNIT, SYSLOG_IDENTIFIER, PRIORITY
                  Drop_Single_Key raw
                  Line_Format json

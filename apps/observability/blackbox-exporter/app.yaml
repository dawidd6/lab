apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter
      targetRevision: 11.20.2
      helm:
        valuesObject:
          fullnameOverride: blackbox-exporter
          config:
            modules:
              dns_cloudflare:
                prober: dns
                timeout: 5s
                dns:
                  query_name: dawid.indevs.in
                  query_type: A
                  preferred_ip_protocol: ip4
                  valid_rcodes:
                    - NOERROR
                  validate_answer_rrs:
                    fail_if_not_matches_regexp:
                      - 192.168.1.109
              dns_router_static:
                prober: dns
                timeout: 5s
                dns:
                  query_name: dawid.indevs.in
                  query_type: A
                  preferred_ip_protocol: ip4
                  valid_rcodes:
                    - NOERROR
                  validate_answer_rrs:
                    fail_if_not_matches_regexp:
                      - '\t0\tIN\tA\t192.168.1.109'
              tcp_ssh:
                prober: tcp
                timeout: 5s
                tcp:
                  preferred_ip_protocol: ip4
                  query_response:
                    - expect: ^SSH-2.0-
              # the whole way in: DNS, envoy, a valid certificate and a backend answering
              http_ok:
                prober: http
                timeout: 5s
                http:
                  preferred_ip_protocol: ip4
                  valid_status_codes:
                    - 200
              # an app behind the tinyauth SecurityPolicy still sends the login redirect
              http_tinyauth_redirect:
                prober: http
                timeout: 5s
                http:
                  preferred_ip_protocol: ip4
                  follow_redirects: false
                  valid_status_codes:
                    - 302
                  fail_if_header_not_matches:
                    - header: Location
                      regexp: ^https://tinyauth\.dawid\.indevs\.in/

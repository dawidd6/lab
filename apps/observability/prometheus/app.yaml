apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.39.0
      helm:
        valuesObject:
          server:
            persistentVolume:
              storageClass: internal
              size: 1Gi
          scrapeConfigs:
            blackbox:
              enabled: true
              job_name: blackbox
              metrics_path: /probe
              static_configs:
                - labels:
                    module: dns_duckdns
                  targets:
                    - ns1.duckdns.org:53
                - labels:
                    module: dns_router_static
                  targets:
                    - 192.168.1.1:53
                - labels:
                    module: tcp_ssh
                  targets:
                    - 192.168.1.109:22
              relabel_configs:
                - source_labels:
                    - module
                  target_label: __param_module
                - source_labels:
                    - __address__
                  target_label: __param_target
                - source_labels:
                    - __param_target
                  target_label: instance
                - target_label: __address__
                  replacement: blackbox-exporter:9115
          serverFiles:
            alerting_rules.yml:
              groups:
                - name: blackbox
                  rules:
                    - alert: ProbeFailing
                      expr: probe_success == 0
                      for: 5m
                      labels:
                        severity: warning
                      annotations:
                        summary: "{{ $labels.instance }} ({{ $labels.module }}) has been failing for 5 minutes"
                    - alert: CertificateExpiringSoon
                      expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
                      for: 1h
                      labels:
                        severity: warning
                      annotations:
                        summary: "Certificate served at {{ $labels.instance }} expires in {{ $value | humanize }} days"
                - name: host
                  rules:
                    - alert: DiskAlmostFull
                      expr: node_filesystem_avail_bytes{mountpoint=~"/|/data/external"} / node_filesystem_size_bytes < 0.1
                      for: 15m
                      labels:
                        severity: warning
                      annotations:
                        summary: "{{ $labels.mountpoint }} has only {{ $value | humanizePercentage }} free"
                    # nofail in fstab: without the disk the server boots anyway, and /data/external is then just a folder on /
                    - alert: ExternalDiskMissing
                      expr: absent(node_filesystem_size_bytes{mountpoint="/data/external"})
                      for: 5m
                      labels:
                        severity: warning
                      annotations:
                        summary: "The external disk isn't mounted at /data/external"
                    # fixed limits: the sensors' own max values are 0 or nonsense on this board
                    - alert: HostTooHot
                      expr: node_hwmon_temp_celsius{chip="platform_coretemp_0"} > 90 or node_hwmon_temp_celsius{chip="nvme_nvme0", sensor="temp1"} > 70
                      for: 10m
                      labels:
                        severity: warning
                      annotations:
                        summary: "{{ $labels.chip }} {{ $labels.sensor }} has been at {{ $value }}°C for 10 minutes"
                - name: kubernetes
                  rules:
                    - alert: PodCrashLooping
                      expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) == 1
                      for: 10m
                      labels:
                        severity: warning
                      annotations:
                        summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) has been crash-looping for 10 minutes"
          alertmanager:
            persistence:
              storageClass: internal
            config:
              receivers:
                - name: ntfy
                  webhook_configs:
                    # ntfy's built-in template turns Alertmanager's JSON into a readable notification
                    - url: http://ntfy.observability/lab?template=alertmanager
              route:
                receiver: ntfy
          prometheus-pushgateway:
            enabled: false

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
spec:
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.38.2

values:
  server:
    persistentVolume:
      storageClass: internal
      size: 1Gi
  scrapeConfigs:
    blackbox:
      enabled: true
      job_name: blackbox
      metrics_path: /probe
      static_configs:
        - labels:
            module: http_2xx
          targets:
            - https://argocd.dawidd6.duckdns.org
            - https://dynacat.dawidd6.duckdns.org
            - https://grafana.dawidd6.duckdns.org
            - https://homepage.dawidd6.duckdns.org
            - https://jdownloader.dawidd6.duckdns.org
            - https://jellyfin.dawidd6.duckdns.org
            - https://tinyauth.dawidd6.duckdns.org
        - labels:
            module: http_jellyfin_health
          targets:
            - https://jellyfin.dawidd6.duckdns.org/health
        - labels:
            module: http_grafana_health
          targets:
            - https://grafana.dawidd6.duckdns.org/api/health
        - labels:
            module: dns_duckdns
          targets:
            - ns1.duckdns.org:53
        - labels:
            module: dns_router_static
          targets:
            - 192.168.1.1:53
        - labels:
            module: tcp_ssh
          targets:
            - 192.168.1.109:22
      relabel_configs:
        - source_labels:
            - module
          target_label: __param_module
        - source_labels:
            - __address__
          target_label: __param_target
        - source_labels:
            - __param_target
          target_label: instance
        - target_label: __address__
          replacement: blackbox-exporter:9115
    kubernetes-services:
      relabel_configs:
        - source_labels:
            - __meta_kubernetes_service_annotation_prometheus_io_probe
          action: keep
          regex: true
        - source_labels:
            - __address__
          target_label: __param_target
        - target_label: __address__
          replacement: blackbox-exporter:9115
        - source_labels:
            - __param_target
          target_label: instance
        - action: labelmap
          regex: __meta_kubernetes_service_label_(.+)
        - source_labels:
            - __meta_kubernetes_namespace
          target_label: namespace
        - source_labels:
            - __meta_kubernetes_service_name
          target_label: service
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: blackbox
          rules:
            - alert: ProbeFailing
              expr: probe_success == 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} ({{ $labels.module }}) has been failing for 5 minutes"
            - alert: CertificateExpiringSoon
              expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Certificate served at {{ $labels.instance }} expires in {{ $value | humanize }} days"
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false

valuesExtra: {}

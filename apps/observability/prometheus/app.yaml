apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.40.3
      helm:
        valuesObject:
          server:
            persistentVolume:
              storageClass: internal
              size: 1Gi
          # alerting is Grafana's (rules in the grafana app)
          alertmanager:
            enabled: false
          prometheus-pushgateway:
            enabled: false

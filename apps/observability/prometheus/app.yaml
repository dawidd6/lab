apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.45.1
      helm:
        valuesObject:
          server:
            persistentVolume:
              storageClass: data
              size: 1Gi
          scrapeConfigs:
            blackbox:
              metrics_path: /probe
              static_configs:
                - labels:
                    module: dns_cloudflare
                  targets:
                    - https://1.1.1.1/dns-query?name=dawid.us.ci&type=A
                - labels:
                    module: dns_router_static
                  targets:
                    - 192.168.1.1:53
                - labels:
                    module: tcp_ssh
                  targets:
                    - 192.168.1.109:22
                - labels:
                    module: http_ok
                  targets:
                    - https://authelia.dawid.us.ci/api/health
                - labels:
                    module: http_authelia_login
                  targets:
                    - https://homepage.dawid.us.ci
              relabel_configs:
                - source_labels:
                    - module
                  target_label: __param_module
                - source_labels:
                    - __address__
                  target_label: __param_target
                - source_labels:
                    - __param_target
                  target_label: instance
                - target_label: __address__
                  replacement: blackbox-exporter:9115
          # alerting is Grafana's (rules in the grafana app)
          alertmanager:
            enabled: false
          prometheus-pushgateway:
            enabled: false

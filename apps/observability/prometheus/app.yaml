apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
spec:
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.40.0
      helm:
        valuesObject:
          server:
            persistentVolume:
              storageClass: internal
              size: 1Gi
          scrapeConfigs:
            blackbox:
              enabled: true
              job_name: blackbox
              metrics_path: /probe
              static_configs:
                - labels:
                    module: dns_duckdns
                  targets:
                    - ns1.duckdns.org:53
                - labels:
                    module: dns_router_static
                  targets:
                    - 192.168.1.1:53
                - labels:
                    module: tcp_ssh
                  targets:
                    - 192.168.1.109:22
              relabel_configs:
                - source_labels:
                    - module
                  target_label: __param_module
                - source_labels:
                    - __address__
                  target_label: __param_target
                - source_labels:
                    - __param_target
                  target_label: instance
                - target_label: __address__
                  replacement: blackbox-exporter:9115
          serverFiles:
            alerting_rules.yml:
              groups:
                - name: blackbox
                  rules:
                    - alert: ProbeFailing
                      expr: probe_success == 0
                      for: 5m
                      labels:
                        severity: warning
                      annotations:
                        summary: "{{ $labels.instance }} ({{ $labels.module }}) has been failing for 5 minutes"
                    - alert: CertificateExpiringSoon
                      expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
                      for: 1h
                      labels:
                        severity: warning
                      annotations:
                        summary: "Certificate served at {{ $labels.instance }} expires in {{ $value | humanize }} days"
          alertmanager:
            persistence:
              storageClass: internal
            config:
              receivers:
                - name: ntfy
                  webhook_configs:
                    # ntfy's built-in template turns Alertmanager's JSON into a readable notification
                    - url: http://ntfy.observability/lab?template=alertmanager
              route:
                receiver: ntfy
          prometheus-pushgateway:
            enabled: false

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 14.2.0
      helm:
        valuesObject:
          persistence:
            enabled: true
            storageClassName: internal
            size: 1Gi
          deploymentStrategy:
            type: Recreate
          env:
            GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: client_secret
          grafana.ini:
            server:
              root_url: https://grafana.dawid.indevs.in
            auth:
              disable_login_form: true
            auth.generic_oauth:
              enabled: true
              name: tinyauth
              client_id: grafana
              scopes: openid email profile
              auth_url: https://tinyauth.dawid.indevs.in/authorize
              token_url: https://tinyauth.dawid.indevs.in/api/oidc/token
              api_url: https://tinyauth.dawid.indevs.in/api/oidc/userinfo
              use_pkce: true
              auto_login: true
              allow_sign_up: true
              role_attribute_path: preferred_username == 'dawid' && 'Admin' || 'Viewer'
          route:
            main:
              enabled: true
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - grafana.dawid.indevs.in
          datasources:
            datasources.yaml:
              apiVersion: 1
              # deletes datasources no longer listed here
              prune: true
              datasources:
                - name: Prometheus
                  uid: prometheus
                  type: prometheus
                  url: http://prometheus-server
                  isDefault: true
                - name: Loki
                  uid: loki
                  type: loki
                  url: http://loki:3100
          # values here go through Helm's tpl, so no {{ }} in them
          alerting:
            contactpoints.yaml:
              apiVersion: 1
              contactPoints:
                - orgId: 1
                  name: ntfy
                  receivers:
                    - uid: ntfy
                      type: webhook
                      settings:
                        # ntfy's built-in template turns Grafana's JSON into a readable notification
                        url: http://ntfy.observability/lab?template=grafana
            policies.yaml:
              apiVersion: 1
              policies:
                - orgId: 1
                  receiver: ntfy
            rules.yaml:
              apiVersion: 1
              # Grafana keeps a provisioned rule that's gone from the file; this removes the one for blackbox-exporter's probes
              deleteRules:
                - orgId: 1
                  uid: probe-failing
              groups:
                - orgId: 1
                  name: lab
                  folder: Alerts
                  interval: 1m
                  # A is the query, B the threshold on it; noDataState OK where no series means nothing is wrong
                  # (the notification lists each alert's labels: which disk, pod or app)
                  rules:
                    - uid: certificate-expiring
                      title: Certificate expiring
                      condition: B
                      data:
                        - refId: A
                          datasourceUid: prometheus
                          relativeTimeRange: {from: 600, to: 0}
                          model:
                            instant: true
                            # cert-manager renews 30 days ahead, so under 14 means renewal is failing
                            expr: (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400
                        - {refId: B, datasourceUid: __expr__, model: {type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [14]}}]}}
                      for: 1h
                      annotations:
                        summary: A certificate expires in less than 14 days (value = days left)
                    - uid: disk-almost-full
                      title: Disk almost full
                      condition: B
                      data:
                        - refId: A
                          datasourceUid: prometheus
                          relativeTimeRange: {from: 600, to: 0}
                          model:
                            instant: true
                            expr: node_filesystem_avail_bytes{mountpoint=~"/|/data/external"} / node_filesystem_size_bytes
                        - {refId: B, datasourceUid: __expr__, model: {type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [0.1]}}]}}
                      for: 15m
                      annotations:
                        summary: A disk has less than 10% free (value = fraction free)
                    # nofail in fstab: without the disk the server boots anyway, and /data/external is then just a folder on /
                    - uid: external-disk-missing
                      title: External disk missing
                      condition: B
                      data:
                        - refId: A
                          datasourceUid: prometheus
                          relativeTimeRange: {from: 600, to: 0}
                          model:
                            instant: true
                            expr: count(node_filesystem_size_bytes{mountpoint="/data/external"}) or vector(0)
                        - {refId: B, datasourceUid: __expr__, model: {type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [1]}}]}}
                      for: 5m
                      annotations:
                        summary: The external disk isn't mounted at /data/external
                    # fixed limits: the sensors' own max values are 0 or nonsense on this board
                    - uid: cpu-too-hot
                      title: CPU too hot
                      condition: B
                      data:
                        - refId: A
                          datasourceUid: prometheus
                          relativeTimeRange: {from: 600, to: 0}
                          model:
                            instant: true
                            expr: node_hwmon_temp_celsius{chip="platform_coretemp_0"}
                        - {refId: B, datasourceUid: __expr__, model: {type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [90]}}]}}
                      for: 10m
                      annotations:
                        summary: The CPU has been above 90°C for 10 minutes
                    - uid: nvme-too-hot
                      title: NVMe too hot
                      condition: B
                      data:
                        - refId: A
                          datasourceUid: prometheus
                          relativeTimeRange: {from: 600, to: 0}
                          model:
                            instant: true
                            expr: node_hwmon_temp_celsius{chip="nvme_nvme0", sensor="temp1"}
                        - {refId: B, datasourceUid: __expr__, model: {type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [70]}}]}}
                      for: 10m
                      annotations:
                        summary: The NVMe disk has been above 70°C for 10 minutes
                    - uid: pod-crash-looping
                      title: Pod crash-looping
                      condition: B
                      data:
                        - refId: A
                          datasourceUid: prometheus
                          relativeTimeRange: {from: 600, to: 0}
                          model:
                            instant: true
                            expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"})
                        - {refId: B, datasourceUid: __expr__, model: {type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                      noDataState: OK
                      for: 10m
                      annotations:
                        summary: A container has been crash-looping for 10 minutes
                    - uid: app-degraded
                      title: App degraded
                      condition: B
                      data:
                        - refId: A
                          datasourceUid: prometheus
                          relativeTimeRange: {from: 600, to: 0}
                          model:
                            instant: true
                            expr: max by (name) (argocd_app_info{health_status="Degraded"})
                        - {refId: B, datasourceUid: __expr__, model: {type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                      noDataState: OK
                      for: 5m
                      annotations:
                        summary: Argo CD reports an app's health as Degraded
                    - uid: app-out-of-sync
                      title: App out of sync
                      condition: B
                      data:
                        - refId: A
                          datasourceUid: prometheus
                          relativeTimeRange: {from: 600, to: 0}
                          model:
                            instant: true
                            expr: max by (name) (argocd_app_info{sync_status="OutOfSync"})
                        - {refId: B, datasourceUid: __expr__, model: {type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                      noDataState: OK
                      for: 15m
                      annotations:
                        summary: An app has been OutOfSync for 15 minutes; with auto-sync and self-heal, that means its syncs keep failing
                    # error or worse in the server's journal (kernel I/O errors, failed units, k0s), minus known noise:
                    # networkd-dispatcher looking up pods' veths after they're gone, and sshd sessions killed on disconnect
                    - uid: host-errors
                      title: Host errors
                      condition: B
                      data:
                        - refId: A
                          datasourceUid: loki
                          relativeTimeRange: {from: 600, to: 0}
                          model:
                            queryType: instant
                            expr: sum by (identifier) (count_over_time({job="journal", priority=~"[0-3]", identifier!~"networkctl|sshd-session"}[10m]))
                        - {refId: B, datasourceUid: __expr__, model: {type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                      noDataState: OK
                      for: 0s
                      annotations:
                        summary: The server logged error-level journal lines in the last 10 minutes (Explore > Loki, job="journal")
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: default
                  options:
                    path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              envoy:
                gnetId: 24459
                revision: 3
              argocd:
                gnetId: 14584
              cert-manager:
                gnetId: 20842
                revision: 3
              kubernetes-coredns:
                gnetId: 15762
                revision: 22
              kubernetes-nodes:
                gnetId: 15759
                revision: 40
              node-exporter-full:
                gnetId: 1860
                revision: 45
              kubernetes-global:
                gnetId: 15757
                revision: 43
              kubernetes-namespaces:
                gnetId: 15758
                revision: 46
              kubernetes-pods:
                gnetId: 15760
                revision: 41
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/observability/grafana/manifests

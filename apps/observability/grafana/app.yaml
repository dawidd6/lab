apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 14.2.0
      helm:
        valuesObject:
          testFramework:
            enabled: false
          persistence:
            enabled: true
            storageClassName: internal
            size: 1Gi
          deploymentStrategy:
            type: Recreate
          env:
            GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: client_secret
          grafana.ini:
            server:
              root_url: https://grafana.dawidd6.duckdns.org
            auth:
              disable_login_form: true
            auth.generic_oauth:
              enabled: true
              name: tinyauth
              client_id: grafana
              scopes: openid email profile
              auth_url: https://tinyauth.dawidd6.duckdns.org/authorize
              token_url: https://tinyauth.dawidd6.duckdns.org/api/oidc/token
              api_url: https://tinyauth.dawidd6.duckdns.org/api/oidc/userinfo
              use_pkce: true
              auto_login: true
              allow_sign_up: true
              role_attribute_path: preferred_username == 'dawid' && 'Admin' || 'Viewer'
          datasources:
            datasources.yaml:
              apiVersion: 1
              # deletes datasources no longer listed here
              prune: true
              datasources:
                - name: Prometheus
                  type: prometheus
                  url: http://prometheus-server
                  isDefault: true
                - name: Loki
                  uid: loki
                  type: loki
                  url: http://loki:3100
          # values here go through Helm's tpl, so no {{ }} in them
          alerting:
            contactpoints.yaml:
              apiVersion: 1
              contactPoints:
                - orgId: 1
                  name: ntfy
                  receivers:
                    - uid: ntfy
                      type: webhook
                      settings:
                        # ntfy's built-in template turns Grafana's JSON into a readable notification
                        url: http://ntfy.observability/lab?template=grafana
            policies.yaml:
              apiVersion: 1
              policies:
                - orgId: 1
                  receiver: ntfy
            rules.yaml:
              apiVersion: 1
              groups:
                - orgId: 1
                  name: logs
                  folder: Alerts
                  interval: 1m
                  rules:
                    - uid: host-errors
                      title: Host errors
                      condition: B
                      data:
                        - refId: A
                          datasourceUid: loki
                          relativeTimeRange:
                            from: 600
                            to: 0
                          model:
                            queryType: instant
                            # error or worse in the server's journal (kernel I/O errors, failed units, k0s), minus known noise:
                            # networkd-dispatcher looking up pods' veths after they're gone, and sshd sessions killed on disconnect
                            expr: sum by (identifier) (count_over_time({job="journal", priority=~"[0-3]", identifier!~"networkctl|sshd-session"}[10m]))
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: A
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                      # no matching lines means no series, which is the good case
                      noDataState: OK
                      execErrState: Error
                      for: 0s
                      annotations:
                        summary: The server logged error-level journal lines in the last 10 minutes (Explore > Loki, job="journal")
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: default
                  options:
                    path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              envoy:
                gnetId: 24459
                revision: 3
              argocd:
                gnetId: 14584
                revision: 1
              cert-manager:
                gnetId: 20842
                revision: 3
              kubernetes-coredns:
                gnetId: 15762
                revision: 22
              kubernetes-nodes:
                gnetId: 15759
                revision: 40
              node-exporter-full:
                gnetId: 1860
                revision: 45
              kubernetes-global:
                gnetId: 15757
                revision: 43
              kubernetes-namespaces:
                gnetId: 15758
                revision: 46
              blackbox-exporter:
                gnetId: 13659
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              kubernetes-pods:
                gnetId: 15760
                revision: 41
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/observability/grafana/manifests

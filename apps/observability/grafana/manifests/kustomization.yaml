apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana-oidc.sops.yaml
  - httproute.yaml
# dashboards stay plain JSON files; the Grafana sidecar loads ConfigMaps labelled grafana_dashboard
configMapGenerator:
  - name: grafana-dashboards
    files:
      - markets.json
      - poland.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

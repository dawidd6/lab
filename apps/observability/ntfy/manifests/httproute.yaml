# no SecurityPolicy: LAN only, ntfy needs no login here
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
spec:
  parentRefs:
    - name: envoy
      namespace: ingress
      sectionName: https
  hostnames:
    - ntfy.dawidd6.duckdns.org
  rules:
    - backendRefs:
        - name: ntfy
          port: 80

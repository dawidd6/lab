apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: oci.trueforge.org/truecharts
      chart: ntfy
      targetRevision: 14.8.0
      helm:
        valuesObject:
          securityContext:
            container:
              # the user that owns the existing cache volume
              runAsUser: 1000
              runAsGroup: 1000
          service:
            main:
              ports:
                main:
                  port: 80
                  targetPort: 8080
          workload:
            main:
              podSpec:
                containers:
                  main:
                    env:
                      # the chart listens on the Service port, which non-root can't for 80
                      NTFY_LISTEN_HTTP: ":8080"
                      NTFY_BASE_URL: https://ntfy.dawid.us.ci
                      # rate limits per client need the real IP from envoy's X-Forwarded-For
                      NTFY_BEHIND_PROXY: true
                      ENABLE_CACHE_FILE: true
                      ENABLE_ATTACHMENT_CACHE_DIR: true
                      # private: users (dawid, admin; services) and the services token are in ntfy-secrets
                      NTFY_AUTH_FILE: /var/cache/ntfy/auth.db
                      NTFY_AUTH_DEFAULT_ACCESS: deny-all
                      NTFY_AUTH_ACCESS: services:server:rw
                      # shows the web app's login
                      NTFY_ENABLE_LOGIN: true
                    envFrom:
                      - secretRef:
                          name: ntfy-secrets
                          expandObjectName: false
          persistence:
            # configured through env, no server.yml
            config:
              enabled: false
            cache:
              storageClass: internal
              size: 1Gi

          route:
            main:
              enabled: true
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - ntfy.dawid.us.ci
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/observability/ntfy/manifests

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
spec:
  # filled in by the ApplicationSet
  project: ""
  destination: {}
  sources:
    - repoURL: https://stakater.github.io/stakater-charts
      chart: reloader
      targetRevision: 2.2.19
      helm:
        valuesObject:
          reloader:
            autoReloadAll: true
            reloadStrategy: annotations

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps
spec:
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-apps
    targetRevision: 2.0.7

values:
  applicationsets:
    apps:
      namespace: delivery
      additionalAnnotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=false
      goTemplate: true
      goTemplateOptions:
        - missingkey=error
      # lets `argocd app set <app> --sync-policy none` stick instead of being reverted
      ignoreApplicationDifferences:
        - jsonPointers:
            - /spec/syncPolicy
      generators:
        - git:
            repoURL: https://github.com/dawidd6/lab
            revision: master
            files:
              - path: apps/*/*/app.yaml
      template:
        metadata:
          name: '{{ index .path.segments 2 }}'
        spec:
          project: default
          destination:
            server: https://kubernetes.default.svc
            namespace: '{{ index .path.segments 1 }}'
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            retry:
              limit: -1
            syncOptions:
              - CreateNamespace=true
              - ServerSideApply=true
              - SkipDryRunOnMissingResource=true
          sources:
            - repoURL: '{{ .spec.source.repoURL }}'
              chart: '{{ .spec.source.chart }}'
              targetRevision: '{{ .spec.source.targetRevision }}'
              helm:
                values: '{{ toYaml .values }}'
            - repoURL: https://github.com/dawidd6/lab
              targetRevision: master
              path: apps/_common
              helm:
                values: '{{ toYaml .valuesExtras }}'
            - repoURL: https://github.com/dawidd6/lab
              targetRevision: master
              path: apps
              directory:
                recurse: true
                include: '{{ index .path.segments 1 }}/{{ index .path.segments 2 }}/*.sops.yaml'

valuesExtras: {}

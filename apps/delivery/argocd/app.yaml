apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.11.7
      helm:
        valuesObject:
          configs:
            cm:
              url: https://argocd.dawid.us.ci
              # logins go through Authelia only
              admin.enabled: false
              # read-only API token for the Homepage widget
              accounts.homepage: apiKey
              # Authelia's ID tokens carry no groups, so they're read from the userinfo endpoint
              oidc.config: |
                name: Authelia
                issuer: https://authelia.dawid.us.ci
                clientID: argocd
                clientSecret: $argocd-oidc:clientSecret
                cliClientID: argocd-cli
                requestedScopes: [openid, email, groups]
                enableUserInfoGroups: true
                userInfoPath: /api/oidc/userinfo
            rbac:
              policy.csv: |
                g, admins, role:admin
                g, homepage, role:readonly
            params:
              server.insecure: true
              controller.diff.server.side: true
              applicationsetcontroller.enable.new.git.file.globbing: true
          dex:
            enabled: false
          notifications:
            enabled: false
          controller:
            metrics:
              enabled: true
              service:
                annotations:
                  prometheus.io/scrape: "true"
          server:
            metrics:
              enabled: true
              service:
                annotations:
                  prometheus.io/scrape: "true"
                  # without it Prometheus also scrapes the pod's other ports, which serve no metrics
                  prometheus.io/port: "8083"
            httproute:
              enabled: true
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - argocd.dawid.us.ci
          repoServer:
            metrics:
              enabled: true
              service:
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "8084"
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/delivery/argocd/manifests

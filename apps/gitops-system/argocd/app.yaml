apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
spec:
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.10.5

values:
  configs:
    cm:
      url: https://argocd.dawidd6.duckdns.org
      oidc.config: |
        name: Pocket ID
        issuer: https://pocket-id.dawidd6.duckdns.org
        clientID: argocd
        clientSecret: $argocd-oidc:clientSecret
        logoutURL: https://pocket-id.dawidd6.duckdns.org/api/oidc/end-session?id_token_hint={{token}}&post_logout_redirect_uri={{logoutRedirectURL}}
        requestedScopes: [openid, profile, email, groups]
    rbac:
      policy.csv: g, argocd-admins, role:admin
    params:
      server.insecure: true
      controller.diff.server.side: true
      applicationsetcontroller.enable.new.git.file.globbing: true
  dex:
    enabled: false
  notifications:
    enabled: false

valuesExtras:
  httpRoutes:
    - name: argocd
      hostname: argocd.dawidd6.duckdns.org
      service: argocd-server
      port: 80
  oidcClients:
    - name: argocd
      spec:
        clientID: argocd
        callbackUrls:
          - https://argocd.dawidd6.duckdns.org/auth/callback
          - http://localhost:8085/auth/callback
        logoutCallbackUrls:
          - https://argocd.dawidd6.duckdns.org
        allowedUserGroups:
          - name: argocd-admins
            namespace: identity-system
        secret:
          name: argocd-oidc
          keys:
            clientSecret: clientSecret
          additionalLabels:
            app.kubernetes.io/part-of: argocd

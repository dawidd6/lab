apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps
spec:
  project: default
  destination:
    namespace: argocd
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-apps
    targetRevision: 2.0.6

values:
  applicationsets:
    apps:
      namespace: argocd
      additionalAnnotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=false
      goTemplate: true
      goTemplateOptions:
        - missingkey=error
      generators:
        - git:
            repoURL: https://github.com/dawidd6/lab
            revision: master
            files:
              - path: apps/*/app.yaml
      template:
        metadata:
          name: '{{ .path.basename }}'
        spec:
          project: default
          destination:
            server: https://kubernetes.default.svc
            namespace: '{{ .spec.destination.namespace }}'
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            retry:
              limit: -1
            syncOptions:
              - CreateNamespace=true
              - ServerSideApply=true
              - SkipDryRunOnMissingResource=true
          sources:
            - repoURL: '{{ .spec.source.repoURL }}'
              chart: '{{ .spec.source.chart }}'
              targetRevision: '{{ .spec.source.targetRevision }}'
              helm:
                values: '{{ toYaml .values }}'
            - repoURL: https://github.com/dawidd6/lab
              targetRevision: master
              path: extras
              helm:
                values: '{{ toYaml .valuesExtras }}'
            - repoURL: https://github.com/dawidd6/lab
              targetRevision: master
              path: apps
              directory:
                recurse: true
                include: '{{ .path.basename }}/*.sops.yaml'

valuesExtras: {}

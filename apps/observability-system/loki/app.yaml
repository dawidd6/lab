apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
spec:
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.17.1

values:
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 15d
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
  singleBinary:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3100"
      prometheus.io/path: /metrics
    replicas: 1
    persistence:
      storageClass: internal
      size: 1Gi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  gateway:
    enabled: false
  test:
    enabled: false

valuesExtras: {}

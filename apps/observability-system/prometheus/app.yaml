apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
spec:
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.37.0

values:
  server:
    persistentVolume:
      storageClass: internal
      size: 1Gi
  scrapeConfigs:
    blackbox:
      enabled: true
      job_name: blackbox
      metrics_path: /probe
      params:
        module:
          - http_2xx
      static_configs:
        - targets:
            - https://argocd.dawidd6.duckdns.org
            - https://grafana.dawidd6.duckdns.org
            - https://homepage.dawidd6.duckdns.org
            - https://jdownloader.dawidd6.duckdns.org
            - https://jellyfin.dawidd6.duckdns.org
            - https://tinyauth.dawidd6.duckdns.org
      relabel_configs:
        - source_labels:
            - __address__
          target_label: __param_target
        - source_labels:
            - __param_target
          target_label: instance
        - target_label: __address__
          replacement: blackbox-exporter:9115
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false

valuesExtras: {}

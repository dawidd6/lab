apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
spec:
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 14.0.1

values:
  testFramework:
    enabled: false
  persistence:
    enabled: true
    storageClassName: internal
    size: 1Gi
  deploymentStrategy:
    type: Recreate
  env:
    GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client_secret
  grafana.ini:
    server:
      root_url: https://grafana.dawidd6.duckdns.org
    auth:
      disable_login_form: true
    auth.generic_oauth:
      enabled: true
      name: Pocket ID
      client_id: grafana
      scopes: openid email profile groups
      auth_url: https://pocket-id.dawidd6.duckdns.org/authorize
      token_url: https://pocket-id.dawidd6.duckdns.org/api/oidc/token
      api_url: https://pocket-id.dawidd6.duckdns.org/api/oidc/userinfo
      use_pkce: true
      auto_login: true
      allow_sign_up: true
      role_attribute_path: contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki:3100
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 45
      kubernetes-global:
        gnetId: 15757
        revision: 43
      kubernetes-namespaces:
        gnetId: 15758
        revision: 46
      kubernetes-pods:
        gnetId: 15760
        revision: 41

valuesExtras:
  httpRoutes:
    - name: grafana
      hostname: grafana.dawidd6.duckdns.org
      service: grafana
      port: 80
  oidcClients:
    - name: grafana
      spec:
        clientID: grafana
        callbackUrls:
          - https://grafana.dawidd6.duckdns.org/login/generic_oauth
        allowedUserGroups:
          - name: grafana-admins
            namespace: identity-system
        secret:
          name: grafana-oidc

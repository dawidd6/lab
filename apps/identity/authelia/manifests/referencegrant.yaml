# lets the SecurityPolicies in apps/ingress/envoy-gateway/manifests send envoy's ext-authz checks to the authelia Service
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: authelia
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: backup
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: dashboard
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: media
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: observability
  to:
    - group: ""
      kind: Service
      name: authelia

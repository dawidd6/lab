apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tinyauth
spec:
  sources:
    - repoURL: https://tinyauthapp.github.io/helm
      chart: tinyauth
      targetRevision: 2.2.0
      helm:
        valuesObject:
          deploymentStrategy:
            type: Recreate
          persistence:
            enabled: true
            storageClass: internal
            size: 1Gi
          env:
            - name: TINYAUTH_AUTH_USERS
              valueFrom:
                secretKeyRef:
                  name: tinyauth-secrets
                  key: USERS
          tinyauth:
            appUrl: https://tinyauth.dawidd6.duckdns.org
            analytics:
              enabled: false
            auth:
              secureCookie: true
              trustedProxies: 10.244.0.0/16
            oidc:
              clients:
                - id: argocd
                  name: Argo CD
                  clientId: argocd
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: ARGOCD_CLIENT_SECRET
                  trustedRedirectUris: https://argocd.dawidd6.duckdns.org/auth/callback,http://localhost:8085/auth/callback
                # one client for every app envoy logs in for (SecurityPolicies with clientID envoy, secret envoy-oidc in ingress)
                - id: envoy
                  name: Envoy
                  clientId: envoy
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: ENVOY_CLIENT_SECRET
                  trustedRedirectUris: "https://bazarr.dawidd6.duckdns.org/oauth2/callback,\
                    https://glances.dawidd6.duckdns.org/oauth2/callback,\
                    https://homepage.dawidd6.duckdns.org/oauth2/callback,\
                    https://jdownloader2.dawidd6.duckdns.org/oauth2/callback,\
                    https://prowlarr.dawidd6.duckdns.org/oauth2/callback,\
                    https://radarr.dawidd6.duckdns.org/oauth2/callback,\
                    https://sabnzbd.dawidd6.duckdns.org/oauth2/callback,\
                    https://sonarr.dawidd6.duckdns.org/oauth2/callback"
                - id: grafana
                  name: Grafana
                  clientId: grafana
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: GRAFANA_CLIENT_SECRET
                  trustedRedirectUris: https://grafana.dawidd6.duckdns.org/login/generic_oauth
                - id: jellyfin
                  name: Jellyfin
                  clientId: jellyfin
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: JELLYFIN_CLIENT_SECRET
                  trustedRedirectUris: https://jellyfin.dawidd6.duckdns.org/sso/OID/redirect/tinyauth
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/identity/tinyauth/manifests

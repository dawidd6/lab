apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tinyauth
spec:
  sources:
    - repoURL: https://tinyauthapp.github.io/helm
      chart: tinyauth
      targetRevision: 2.2.0
      helm:
        valuesObject:
          deploymentStrategy:
            type: Recreate
          persistence:
            enabled: true
            storageClass: internal
            size: 1Gi
          env:
            - name: TINYAUTH_AUTH_USERS
              valueFrom:
                secretKeyRef:
                  name: tinyauth-secrets
                  key: USERS
          tinyauth:
            appUrl: https://tinyauth.dawidd6.duckdns.org
            analytics:
              enabled: false
            auth:
              secureCookie: true
              trustedProxies: 10.244.0.0/16
            oidc:
              clients:
                - id: argocd
                  name: Argo CD
                  clientId: argocd
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: ARGOCD_CLIENT_SECRET
                  trustedRedirectUris: https://argocd.dawidd6.duckdns.org/auth/callback,http://localhost:8085/auth/callback
                - id: homepage
                  name: Homepage
                  clientId: homepage
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: HOMEPAGE_CLIENT_SECRET
                  trustedRedirectUris: https://homepage.dawidd6.duckdns.org/oauth2/callback
                - id: glances
                  name: Glances
                  clientId: glances
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: GLANCES_CLIENT_SECRET
                  trustedRedirectUris: https://glances.dawidd6.duckdns.org/oauth2/callback
                - id: grafana
                  name: Grafana
                  clientId: grafana
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: GRAFANA_CLIENT_SECRET
                  trustedRedirectUris: https://grafana.dawidd6.duckdns.org/login/generic_oauth
                - id: jdownloader2
                  name: JDownloader
                  clientId: jdownloader2
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: JDOWNLOADER2_CLIENT_SECRET
                  trustedRedirectUris: https://jdownloader.dawidd6.duckdns.org/oauth2/callback
                - id: jellyfin
                  name: Jellyfin
                  clientId: jellyfin
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: JELLYFIN_CLIENT_SECRET
                  trustedRedirectUris: https://jellyfin.dawidd6.duckdns.org/sso/OID/redirect/tinyauth
                - id: nzbget
                  name: NZBGet
                  clientId: nzbget
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: NZBGET_CLIENT_SECRET
                  trustedRedirectUris: https://nzbget.dawidd6.duckdns.org/oauth2/callback
                - id: bazarr
                  name: Bazarr
                  clientId: bazarr
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: BAZARR_CLIENT_SECRET
                  trustedRedirectUris: https://bazarr.dawidd6.duckdns.org/oauth2/callback
                - id: sabnzbd
                  name: SABnzbd
                  clientId: sabnzbd
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: SABNZBD_CLIENT_SECRET
                  trustedRedirectUris: https://sabnzbd.dawidd6.duckdns.org/oauth2/callback
                - id: prowlarr
                  name: Prowlarr
                  clientId: prowlarr
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: PROWLARR_CLIENT_SECRET
                  trustedRedirectUris: https://prowlarr.dawidd6.duckdns.org/oauth2/callback
                - id: radarr
                  name: Radarr
                  clientId: radarr
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: RADARR_CLIENT_SECRET
                  trustedRedirectUris: https://radarr.dawidd6.duckdns.org/oauth2/callback
                - id: sonarr
                  name: Sonarr
                  clientId: sonarr
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: SONARR_CLIENT_SECRET
                  trustedRedirectUris: https://sonarr.dawidd6.duckdns.org/oauth2/callback
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/identity/tinyauth/manifests

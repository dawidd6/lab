apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tinyauth
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: https://tinyauthapp.github.io/helm
      chart: tinyauth
      targetRevision: 2.2.0
      helm:
        valuesObject:
          deploymentStrategy:
            type: Recreate
          persistence:
            enabled: true
            storageClass: internal
            size: 1Gi
          env:
            - name: TINYAUTH_AUTH_USERS
              valueFrom:
                secretKeyRef:
                  name: tinyauth-secrets
                  key: USERS
          httpRoute:
            enabled: true
            parentRefs:
              - name: envoy
                namespace: ingress
                sectionName: https
            hostnames:
              - tinyauth.dawid.us.ci
          tinyauth:
            appUrl: https://tinyauth.dawid.us.ci
            analytics:
              enabled: false
            auth:
              secureCookie: true
              trustedProxies: 10.244.0.0/16
            oidc:
              clients:
                - id: argocd
                  name: Argo CD
                  clientId: argocd
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: ARGOCD_CLIENT_SECRET
                  trustedRedirectUris: https://argocd.dawid.us.ci/auth/callback,http://localhost:8085/auth/callback
                # one client for every app envoy logs in for (SecurityPolicies with clientID envoy, secret envoy-oidc in ingress)
                - id: envoy
                  name: Envoy
                  clientId: envoy
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: ENVOY_CLIENT_SECRET
                  trustedRedirectUris: "https://bazarr.dawid.us.ci/oauth2/callback,\
                    https://duplicati.dawid.us.ci/oauth2/callback,\
                    https://glances.dawid.us.ci/oauth2/callback,\
                    https://homepage.dawid.us.ci/oauth2/callback,\
                    https://jdownloader2.dawid.us.ci/oauth2/callback,\
                    https://prowlarr.dawid.us.ci/oauth2/callback,\
                    https://radarr.dawid.us.ci/oauth2/callback,\
                    https://sabnzbd.dawid.us.ci/oauth2/callback,\
                    https://sonarr.dawid.us.ci/oauth2/callback"
                - id: grafana
                  name: Grafana
                  clientId: grafana
                  clientSecretSecretRef:
                    name: tinyauth-secrets
                    key: GRAFANA_CLIENT_SECRET
                  trustedRedirectUris: https://grafana.dawid.us.ci/login/generic_oauth
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/identity/tinyauth/manifests

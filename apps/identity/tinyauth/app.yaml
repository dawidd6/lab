apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tinyauth
spec:
  source:
    repoURL: https://tinyauthapp.github.io/helm
    chart: tinyauth
    targetRevision: 2.2.0

values:
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClass: internal
    size: 1Gi
  env:
    - name: TINYAUTH_AUTH_USERS
      valueFrom:
        secretKeyRef:
          name: tinyauth-secrets
          key: USERS
  tinyauth:
    appUrl: https://tinyauth.dawidd6.duckdns.org
    analytics:
      enabled: false
    auth:
      secureCookie: true
      trustedProxies: 10.244.0.0/16
    oidc:
      clients:
        - id: argocd
          name: Argo CD
          clientId: argocd
          clientSecretSecretRef:
            name: tinyauth-secrets
            key: ARGOCD_CLIENT_SECRET
          trustedRedirectUris: https://argocd.dawidd6.duckdns.org/auth/callback,http://localhost:8085/auth/callback
        - id: dynacat
          name: Dynacat
          clientId: dynacat
          clientSecretSecretRef:
            name: tinyauth-secrets
            key: DYNACAT_CLIENT_SECRET
          trustedRedirectUris: https://dynacat.dawidd6.duckdns.org/api/oidc/callback
        - id: grafana
          name: Grafana
          clientId: grafana
          clientSecretSecretRef:
            name: tinyauth-secrets
            key: GRAFANA_CLIENT_SECRET
          trustedRedirectUris: https://grafana.dawidd6.duckdns.org/login/generic_oauth
        - id: jdownloader2
          name: JDownloader
          clientId: jdownloader2
          clientSecretSecretRef:
            name: tinyauth-secrets
            key: JDOWNLOADER2_CLIENT_SECRET
          trustedRedirectUris: https://jdownloader.dawidd6.duckdns.org/oauth2/callback
        - id: jellyfin
          name: Jellyfin
          clientId: jellyfin
          clientSecretSecretRef:
            name: tinyauth-secrets
            key: JELLYFIN_CLIENT_SECRET
          trustedRedirectUris: https://jellyfin.dawidd6.duckdns.org/sso/OID/redirect/tinyauth

valuesExtra:
  httpRoutes:
    - name: tinyauth
      hostname: tinyauth.dawidd6.duckdns.org
      service: tinyauth
      port: 80

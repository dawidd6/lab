# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
spec:
  project: default
  destination:
    namespace: media
  source:
    repoURL: https://jellyfin.github.io/jellyfin-helm
    chart: jellyfin
    targetRevision: 3.2.0
    helm:
      valuesObject:
        persistence:
          media:
            existingClaim: jdownloader2-output # JDownloader's downloads volume (jdownloader2/app.yaml)
          config:
            storageClass: internal
            size: 10Gi # metadata and images grow; enforced, and can grow

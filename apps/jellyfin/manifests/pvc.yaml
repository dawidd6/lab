apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm # holds data: Argo CD asks before pruning or deleting it
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: external
  resources:
    requests:
      storage: 400Gi # of the external volume group's 465Gi; enforced, and can grow

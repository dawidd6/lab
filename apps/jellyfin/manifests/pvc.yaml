apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm # holds data: Argo CD asks before pruning or deleting it
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: external
  resources:
    requests:
      storage: 1Gi

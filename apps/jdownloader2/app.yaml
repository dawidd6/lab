# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jdownloader2
spec:
  project: default
  destination:
    namespace: media
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: jdownloader2
    targetRevision: 23.0.0
    helm:
      valuesObject:
        service:
          myjd: # My.JDownloader's direct connection, not used
            enabled: false
          vnc:
            enabled: false
        persistence:
          config: # JDownloader's settings
            storageClass: internal
            size: 1Gi
          output: # the downloads, also Jellyfin's library (jellyfin/app.yaml mounts it by its name, jdownloader2-output)
            storageClass: external
            size: 1Gi
            annotations:
              argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm # holds data: Argo CD asks before pruning or deleting it
        route:
          main:
            enabled: true
            kind: HTTPRoute
            parentRefs:
              - name: envoy
                namespace: envoy-gateway
                sectionName: https # the gateway's https listener (envoy-gateway/manifests/gateway.yaml)
            hostnames:
              - jdownloader.dawidd6.duckdns.org
        workload:
          main:
            podSpec:
              containers:
                main:
                  env:
                    WEB_FILE_MANAGER: "1" # the image's file manager in the web UI, for the folders mapped into it

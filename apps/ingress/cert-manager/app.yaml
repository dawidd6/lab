apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: quay.io/jetstack/charts
      chart: cert-manager
      targetRevision: 1.21.3
      helm:
        valuesObject:
          crds:
            enabled: true
          config:
            enableGatewayAPI: true
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/ingress/cert-manager/manifests

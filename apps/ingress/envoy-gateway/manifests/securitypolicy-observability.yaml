# Authelia login for the observability routes labelled auth: authelia (a policy only selects routes in its own namespace)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia
  namespace: observability
spec:
  targetSelectors:
    - kind: HTTPRoute
      matchLabels:
        auth: authelia
  extAuth:
    # what Authelia reads: its session cookie, and whether to redirect a browser to the login page or answer 401
    headersToExtAuth:
      - accept
      - sec-fetch-mode
      - sec-fetch-dest
      - x-requested-with
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    http:
      backendRefs:
        - name: authelia
          namespace: identity
          port: 80
      path: /api/authz/ext-authz/

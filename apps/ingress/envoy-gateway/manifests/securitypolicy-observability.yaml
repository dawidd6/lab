# tinyauth login for the observability routes labelled auth: tinyauth (a policy only selects routes in its own namespace)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tinyauth
  namespace: observability
spec:
  targetSelectors:
    - kind: HTTPRoute
      matchLabels:
        auth: tinyauth
  oidc:
    provider:
      issuer: https://tinyauth.dawid.us.ci
    clientID: envoy
    clientSecret:
      name: envoy-oidc
      namespace: ingress

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-duckdns
spec:
  sources:
    - repoURL: ghcr.io/cobexer/charts
      chart: cert-manager-webhook-duckdns
      targetRevision: 2.0.0
      helm:
        valuesObject:
          certManager:
            namespace: ingress
          secret:
            existingSecret: true
            existingSecretName: duckdns
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/ingress/cert-manager-webhook-duckdns/manifests

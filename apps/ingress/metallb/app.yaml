apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
spec:
  # filled in by the ApplicationSet
  project: ""
  destination: {}
  sources:
    - repoURL: quay.io/metallb/chart
      chart: metallb
      targetRevision: 0.16.1
      helm:
        valuesObject:
          frrk8s:
            enabled: false
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/ingress/metallb/manifests

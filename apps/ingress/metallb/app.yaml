apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
spec:
  source:
    repoURL: quay.io/metallb/chart
    chart: metallb
    targetRevision: 0.16.1

values:
  frrk8s:
    enabled: false

valuesExtra:
  ipAddressPools:
    - name: default
      addresses:
        - 192.168.1.109/32
  l2Advertisements:
    - name: default

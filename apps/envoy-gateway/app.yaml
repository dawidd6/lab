apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
spec:
  project: default
  destination:
    namespace: envoy-gateway
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: 1.9.2

values: {}

valuesExtras:
  gatewayClasses:
    - name: envoy
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
  gateways:
    - name: envoy
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      gatewayClassName: envoy
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: Same
        - name: https
          protocol: HTTPS
          port: 443
          hostname: "*.dawidd6.duckdns.org"
          tls:
            mode: Terminate
            certificateRefs:
              - group: ""
                kind: Secret
                name: dawidd6-duckdns-org-tls
          allowedRoutes:
            namespaces:
              from: All
  httpRoutes:
    - name: envoy-https-redirect
      sectionName: http
      redirect:
        scheme: https
        statusCode: 301

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: 3.7.0
      helm:
        valuesObject:
          httpRoute:
            enabled: true
            parentRefs:
              - name: envoy
                namespace: ingress
                sectionName: https
            hostnames:
              - jellyfin.dawid.indevs.in
          persistence:
            media:
              existingClaim: media
            config:
              storageClass: internal
              size: 1Gi
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/media/jellyfin/manifests

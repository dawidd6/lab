apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
spec:
  source:
    repoURL: https://jellyfin.github.io/jellyfin-helm
    chart: jellyfin
    targetRevision: 3.6.0

values:
  image:
    repository: docker.io/jellyfin/jellyfin
    tag: "12.3"
  persistence:
    media:
      existingClaim: jdownloader2-output
    config:
      storageClass: internal
      size: 1Gi

valuesExtra:
  httpRoutes:
    - name: jellyfin
      hostname: jellyfin.dawidd6.duckdns.org
      service: jellyfin
      port: 8096

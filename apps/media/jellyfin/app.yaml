apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
spec:
  source:
    repoURL: https://jellyfin.github.io/jellyfin-helm
    chart: jellyfin
    targetRevision: 3.2.0

values:
  persistence:
    media:
      existingClaim: jdownloader2-output
    config:
      storageClass: internal
      size: 1Gi

valuesExtras:
  httpRoutes:
    - name: jellyfin
      hostname: jellyfin.dawidd6.duckdns.org
      service: jellyfin
      port: 8096

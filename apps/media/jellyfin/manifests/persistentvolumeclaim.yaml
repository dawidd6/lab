# shared by every media app (mounted at /media); one volume, so imports by Radarr/Sonarr are renames, not copies
#   downloads (JDownloader, SABnzbd; SABnzbd's temporary folder is downloads/.incomplete), movies (Radarr), series (Sonarr)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  annotations:
    # shared data: removing it from git needs confirmation, and deleting the app never deletes it
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: external
  resources:
    requests:
      storage: 1Gi

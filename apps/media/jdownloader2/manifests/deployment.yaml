apiVersion: apps/v1
kind: Deployment
metadata:
  name: jdownloader2
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jdownloader2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jdownloader2
    spec:
      containers:
        - name: app
          image: ghcr.io/jlesage/jdownloader-2:v26.09.1
          env:
            - name: USER_ID
              value: "568"
            - name: GROUP_ID
              value: "568"
            - name: WEB_FILE_MANAGER
              value: "1"
          livenessProbe:
            tcpSocket:
              port: 5800
          readinessProbe:
            tcpSocket:
              port: 5800
          volumeMounts:
            - name: config
              mountPath: /config
            - name: output
              mountPath: /output
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jdownloader2-config
        - name: output
          persistentVolumeClaim:
            claimName: jdownloader2-output
      enableServiceLinks: false

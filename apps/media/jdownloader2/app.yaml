apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jdownloader2
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: oci.trueforge.org/truecharts
      chart: jdownloader2
      targetRevision: 23.0.4
      helm:
        valuesObject:
          service:
            main:
              ports:
                main:
                  port: 5800
            # direct My.JDownloader connections and raw VNC; the web UI is enough
            myjd:
              enabled: false
            vnc:
              enabled: false
          workload:
            main:
              podSpec:
                containers:
                  main:
                    env:
                      WEB_FILE_MANAGER: "1"
          persistence:
            config:
              storageClass: internal
              size: 1Gi
            # downloads go to /media/downloads instead
            output:
              enabled: false
            media:
              enabled: true
              existingClaim: media
              mountPath: /media

          route:
            main:
              enabled: true
              # tinyauth login (SecurityPolicy in apps/ingress/envoy-gateway/manifests)
              labels:
                auth: tinyauth
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - jdownloader2.dawid.us.ci

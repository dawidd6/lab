apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jdownloader2
spec:
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: jdownloader2
    targetRevision: 23.0.0

values:
  service:
    myjd:
      enabled: false
    vnc:
      enabled: false
  persistence:
    config:
      storageClass: internal
      size: 1Gi
    output:
      storageClass: external
      size: 1Gi
      annotations:
        argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
  workload:
    main:
      podSpec:
        containers:
          main:
            env:
              WEB_FILE_MANAGER: "1"

valuesExtras:
  httpRoutes:
    - name: jdownloader2
      hostname: jdownloader.dawidd6.duckdns.org
      service: jdownloader2
      port: 10054
  securityPolicies:
    - name: jdownloader2
      route: jdownloader2
      oidc:
        provider:
          issuer: https://pocket-id.dawidd6.duckdns.org
        clientID: jdownloader2
        clientSecret:
          name: jdownloader2-oidc
  oidcClients:
    - name: jdownloader2
      spec:
        clientID: jdownloader2
        callbackUrls:
          - https://jdownloader.dawidd6.duckdns.org/oauth2/callback
        allowedUserGroups:
          - name: jdownloader2-users
            namespace: auth
        secret:
          name: jdownloader2-oidc
          keys:
            clientSecret: client-secret

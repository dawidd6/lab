apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      containers:
        - name: app
          image: lscr.io/linuxserver/radarr:6.4.4
          env:
            # same user as JDownloader, which writes to the shared media volume
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            # login happens at envoy (tinyauth); the app trusts it instead of asking again
            - name: RADARR__AUTH__METHOD
              value: External
          envFrom:
            # RADARR__AUTH__APIKEY, also in homepage-secrets for the Homepage widget
            - secretRef:
                name: radarr-secrets
          livenessProbe:
            tcpSocket:
              port: 7878
          readinessProbe:
            tcpSocket:
              port: 7878
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: media
          persistentVolumeClaim:
            claimName: media
      enableServiceLinks: false

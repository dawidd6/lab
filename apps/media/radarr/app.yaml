apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radarr
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: oci.trueforge.org/truecharts
      chart: radarr
      targetRevision: 29.0.1
      helm:
        valuesObject:
          workload:
            main:
              podSpec:
                containers:
                  main:
                    env:
                      RADARR__AUTH__METHOD: External
                    envFrom:
                      - secretRef:
                          name: radarr-secrets
                          expandObjectName: false
          persistence:
            config:
              storageClass: internal
              size: 1Gi

            media:
              enabled: true
              existingClaim: media
              mountPath: /media

          metrics:
            main:
              enabled: false
          service:
            metrics:
              enabled: false

          route:
            main:
              enabled: true
              # tinyauth login (SecurityPolicy in apps/ingress/envoy-gateway/manifests)
              labels:
                auth: tinyauth
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - radarr.dawid.indevs.in
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/media/radarr/manifests

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      containers:
        - name: app
          image: lscr.io/linuxserver/prowlarr:2.7.0
          env:
            # same user as the other media apps
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            # login happens at envoy (tinyauth); the app trusts it instead of asking again
            - name: PROWLARR__AUTH__METHOD
              value: External
          envFrom:
            # PROWLARR__AUTH__APIKEY, also in homepage-secrets for the Homepage widget
            - secretRef:
                name: prowlarr-secrets
          livenessProbe:
            httpGet:
              path: /ping
              port: 9696
          readinessProbe:
            httpGet:
              path: /ping
              port: 9696
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
      enableServiceLinks: false

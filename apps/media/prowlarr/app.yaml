apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prowlarr
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: oci.trueforge.org/truecharts
      chart: prowlarr
      targetRevision: 23.1.2
      helm:
        valuesObject:
          workload:
            main:
              podSpec:
                containers:
                  main:
                    env:
                      PROWLARR__AUTH__METHOD: External
                    envFrom:
                      - secretRef:
                          name: prowlarr-secrets
                          expandObjectName: false
          persistence:
            config:
              storageClass: internal
              size: 1Gi

          configmap:
            # a Grafana dashboard for the metrics turned off below
            dashboard:
              enabled: false

          metrics:
            main:
              enabled: false
          service:
            metrics:
              enabled: false

          route:
            main:
              enabled: true
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - prowlarr.dawid.indevs.in
    - repoURL: https://github.com/dawidd6/lab
      targetRevision: master
      path: apps/media/prowlarr/manifests

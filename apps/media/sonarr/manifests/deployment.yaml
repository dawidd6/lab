apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
    spec:
      containers:
        - name: app
          image: lscr.io/linuxserver/sonarr:4.0.20
          env:
            # same user as JDownloader, which writes to the shared media volume
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            # login happens at envoy (tinyauth); the app trusts it instead of asking again
            - name: SONARR__AUTH__METHOD
              value: External
          envFrom:
            # SONARR__AUTH__APIKEY, also in homepage-secrets for the Homepage widget
            - secretRef:
                name: sonarr-secrets
          livenessProbe:
            tcpSocket:
              port: 8989
          readinessProbe:
            tcpSocket:
              port: 8989
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: media
          persistentVolumeClaim:
            claimName: media
      enableServiceLinks: false

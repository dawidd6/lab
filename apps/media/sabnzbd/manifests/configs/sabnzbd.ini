# copied into the config volume only when it has no sabnzbd.ini yet; SABnzbd owns the file afterwards
[misc]
# SABnzbd refuses requests for hostnames it doesn't know
host_whitelist = sabnzbd.dawidd6.duckdns.org, sabnzbd.media
# below /media/<folder>, not /media itself: SABnzbd treats /media/<first folder> as an external drive
# and waits for it to exist, which a job's own (not yet created) folder never does
# the temporary folder can't be the completed one (nor contain it); a hidden subfolder keeps downloads/ flat
download_dir = /media/downloads/.incomplete
complete_dir = /media/downloads

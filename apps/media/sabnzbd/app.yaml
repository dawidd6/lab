apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sabnzbd
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: oci.trueforge.org/truecharts
      chart: sabnzbd
      targetRevision: 27.1.4
      helm:
        valuesObject:
          service:
            main:
              ports:
                main:
                  # the port Radarr and Sonarr have it configured at (the chart's default is 10097)
                  port: 8080
            metrics:
              enabled: false
          workload:
            main:
              podSpec:
                containers:
                  main:
                    env:
                      # SABnzbd refuses requests for hostnames it doesn't know
                      SABNZBD__HOST_WHITELIST_ENTRIES: sabnzbd.dawid.us.ci, sabnzbd.media
          persistence:
            config:
              storageClass: data
              size: 1Gi
            media:
              enabled: true
              existingClaim: media
              mountPath: /media

          route:
            main:
              enabled: true
              # Authelia login (SecurityPolicy in apps/ingress/envoy-gateway/manifests)
              labels:
                auth: authelia
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - sabnzbd.dawid.us.ci

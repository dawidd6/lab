apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: nzbget
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nzbget
  oidc:
    provider:
      issuer: https://tinyauth.dawidd6.duckdns.org
    clientID: nzbget
    clientSecret:
      name: nzbget-oidc

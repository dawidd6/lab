apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nzbget
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nzbget
    spec:
      containers:
        - name: app
          image: lscr.io/linuxserver/nzbget:26.3.20261023
          env:
            # same user as JDownloader, which writes to the shared media volume
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            # NZBGet's HTTP Basic Auth can't be disabled through the environment (only an empty ControlPassword in
            # nzbget.conf does that), so it gets a generated password; Homepage's widget uses the same credentials
            - name: NZBGET_USER
              value: nzbget
          envFrom:
            # NZBGET_PASS
            - secretRef:
                name: nzbget-secrets
          livenessProbe:
            tcpSocket:
              port: 6789
          readinessProbe:
            tcpSocket:
              port: 6789
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nzbget-config
        - name: media
          persistentVolumeClaim:
            claimName: jdownloader2-output
      enableServiceLinks: false

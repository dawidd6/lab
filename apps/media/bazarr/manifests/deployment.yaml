apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr
    spec:
      containers:
        - name: app
          image: lscr.io/linuxserver/bazarr:1.6.2
          env:
            # same user as the other media apps
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
          livenessProbe:
            tcpSocket:
              port: 6767
          readinessProbe:
            tcpSocket:
              port: 6767
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: media
          persistentVolumeClaim:
            claimName: media
      enableServiceLinks: false

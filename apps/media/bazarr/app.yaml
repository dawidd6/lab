apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bazarr
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: oci.trueforge.org/truecharts
      chart: bazarr
      targetRevision: 25.0.7
      helm:
        valuesObject:
          persistence:
            config:
              storageClass: internal
              size: 1Gi
            media:
              enabled: true
              existingClaim: media
              mountPath: /media

          service:
            metrics:
              enabled: false

          route:
            main:
              enabled: true
              # tinyauth login (SecurityPolicy in apps/ingress/envoy-gateway/manifests)
              labels:
                auth: tinyauth
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - bazarr.dawid.indevs.in

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bazarr
spec:
  project: ""
  destination: {}
  sources:
    - repoURL: oci.trueforge.org/truecharts
      chart: bazarr
      targetRevision: 26.1.4
      helm:
        valuesObject:
          persistence:
            config:
              storageClass: data
              size: 1Gi
            media:
              enabled: true
              existingClaim: media
              mountPath: /media

          service:
            metrics:
              enabled: false

          route:
            main:
              enabled: true
              # Authelia login (SecurityPolicy in apps/ingress/envoy-gateway/manifests)
              labels:
                auth: authelia
              parentRefs:
                - name: envoy
                  namespace: ingress
                  sectionName: https
              hostnames:
                - bazarr.dawid.us.ci

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lldap
spec:
  source:
    repoURL: https://djjudas21.github.io/charts
    chart: lldap
    targetRevision: 0.6.4

values:
  lldap:
    baseDN: dc=dawidd6,dc=duckdns,dc=org
    secretName: lldap-credentials
  persistence:
    enabled: true
    storageClass: internal
    size: 1Gi
  bootstrap:
    enabled: true
    groups:
      - argocd-admins
    users:
      - id: dex
        email: dex@dawidd6.duckdns.org
        displayName: Dex
        passwordSecret:
          name: lldap-credentials
          key: dexPassword
        groups:
          - lldap_strict_readonly

valuesExtras:
  httpRoutes:
    - name: lldap
      hostname: lldap.dawidd6.duckdns.org
      service: lldap-http
      port: 17170

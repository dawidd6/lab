apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
spec:
  source:
    repoURL: https://charts.dexidp.io
    chart: dex
    targetRevision: 0.26.0

values:
  envFrom:
    - secretRef:
        name: dex-clients
  envVars:
    - name: LDAP_BIND_PASSWORD
      valueFrom:
        secretKeyRef:
          name: glauth-credentials
          key: dexPassword
  config:
    issuer: https://dex.dawidd6.duckdns.org
    storage:
      type: kubernetes
      config:
        inCluster: true
    oauth2:
      skipApprovalScreen: true
    connectors:
      - type: ldap
        id: glauth
        name: GLAuth
        config:
          host: glauth:3893
          insecureNoSSL: true
          bindDN: cn=dex,ou=svcaccts,dc=server
          bindPW: $LDAP_BIND_PASSWORD
          usernamePrompt: Username
          userSearch:
            baseDN: ou=users,dc=server
            filter: (objectClass=posixAccount)
            username: cn
            idAttr: uidNumber
            emailAttr: mail
            nameAttr: cn
            preferredUsernameAttr: cn
          groupSearch:
            baseDN: ou=groups,dc=server
            filter: (objectClass=groupOfUniqueNames)
            userMatchers:
              - userAttr: DN
                groupAttr: uniqueMember
            nameAttr: ou
    staticClients:
      - id: argocd
        name: Argo CD
        secretEnv: ARGOCD_CLIENT_SECRET
        redirectURIs:
          - https://argocd.dawidd6.duckdns.org/auth/callback
          - http://localhost:8085/auth/callback
      - id: jdownloader2
        name: JDownloader
        secretEnv: JDOWNLOADER_CLIENT_SECRET
        redirectURIs:
          - https://jdownloader.dawidd6.duckdns.org/oauth2/callback

valuesExtras:
  httpRoutes:
    - name: dex
      hostname: dex.dawidd6.duckdns.org
      service: dex
      port: 5556

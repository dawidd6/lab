apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
spec:
  source:
    repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: 1.21.3

values:
  crds:
    enabled: true
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true

valuesExtras:
  clusterIssuers:
    - name: letsencrypt
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-account-key
        solvers:
          - dns01:
              webhook:
                config:
                  apiTokenSecretRef:
                    key: token
                    name: duckdns
                groupName: acme.duckdns.org
                solverName: duckdns

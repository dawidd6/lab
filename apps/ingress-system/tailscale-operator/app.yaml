apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
spec:
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.104.1

values:
  ingressClass:
    enabled: false

valuesExtras:
  connectors:
    - name: server-pod
      advertiseRoutes:
        - 192.168.1.109/32

# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
spec:
  project: default
  destination:
    namespace: openebs
  source:
    repoURL: https://openebs.github.io/lvm-localpv
    chart: lvm-localpv # OpenEBS LVM LocalPV alone, without the rest of OpenEBS
    targetRevision: 1.10.1
    helm:
      valuesObject:
        # every volume is a logical volume in one of the host's LVM volume groups, its size enforced: internal on the
        # NVMe, external on the USB drive (the StorageClasses in manifests/)
        lvmNode:
          kubeletDir: /var/lib/k0s/kubelet/ # k0s's, not the usual /var/lib/kubelet/
        analytics:
          enabled: false # no usage reports to OpenEBS

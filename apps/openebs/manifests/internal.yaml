# volumes as logical volumes in the host's LVM volume group internal, on the NVMe (made outside the cluster, e.g. by the OS
# installer or vgcreate internal <disk>)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: internal
provisioner: local.csi.openebs.io
parameters:
  storage: lvm
  vgpattern: ^internal$ # exactly internal; replaces volgroup, which the driver plans to deprecate
  fsType: xfs # no reserved space (ext4 keeps 5% for root), good with large media files
  shared: "yes" # mountable by several pods on the node at once (the old and new pod during an update)
reclaimPolicy: Delete # a deleted PVC takes its logical volume, and the app settings on it, along
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true # grow a volume by raising its PVC's size

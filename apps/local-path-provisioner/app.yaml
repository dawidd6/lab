# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
spec:
  project: default
  destination:
    namespace: local-path-provisioner
  source:
    repoURL: https://charts.containeroo.ch
    chart: local-path-provisioner # Rancher's chart, republished in a Helm repository
    targetRevision: 0.0.38
    helm:
      valuesObject:
        nodePathMap: [] # replaced by storageClassConfigs
        # volumes are directories <namespace>/<pvc>/ under the class's path, the same again after a cluster rebuild;
        # sizes aren't enforced
        storageClassConfigs:
          internal:
            storageClass:
              create: true
              defaultVolumeType: hostPath
              reclaimPolicy: Delete # a deleted PVC takes its directory, and the app settings in it, along
              volumeBindingMode: WaitForFirstConsumer
              pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
            nodePathMap:
              - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
                paths:
                  - /data/internal # on the system disk (the root filesystem)
          external:
            storageClass:
              create: true
              defaultVolumeType: hostPath
              reclaimPolicy: Retain # a deleted PVC keeps its directory
              volumeBindingMode: WaitForFirstConsumer
              pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
            nodePathMap:
              - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
                paths:
                  - /data/external # the USB drive's filesystem, mounted there on the host

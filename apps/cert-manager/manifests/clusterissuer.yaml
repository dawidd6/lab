apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          webhook:
            config:
              apiTokenSecretRef:
                key: token
                name: duckdns
            groupName: acme.duckdns.org
            solverName: duckdns

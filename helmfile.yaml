# Bootstrap only: Argo CD with the chart's defaults; it then manages itself (apps/delivery/argocd) with the real values
repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  - name: argocd
    namespace: delivery
    chart: argo/argo-cd
    version: 10.18.0
    set:
      # the chart renders dex by default; nothing uses SSO here, and the managed app disables it, which would leave
      # these objects running untracked (the bootstrap's kubectl-applied resources carry no Argo tracking annotation)
      - name: dex.enabled
        value: false

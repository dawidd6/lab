apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: server
spec:
  hosts:
    - role: single
      openSSH:
        address: server.lan
  k0s:
    version: v1.36.4+k0s.1
    config:
      spec:
        storage:
          type: kine # SQLite; etcd's constant fsyncs are too much for the server's eMMC

# Glances in web server mode: its REST API serves Homepage's glances widget (CPU, memory, temperature, disk)
# at http://glances.glances.svc:61208; /proc and /sys aren't namespaced, so a plain pod sees the host's values
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glances
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: glances
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glances
    spec:
      automountServiceAccountToken: false
      containers:
        - name: glances
          image: docker.io/nicolargo/glances:4.5.7
          env:
            - name: GLANCES_OPT
              value: -w # the image runs `python -m glances ${GLANCES_OPT}`; -w: web server (UI and API)
          resources:
            limits:
              memory: 128Mi
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
      volumes:
        - name: rootfs # the host's disks, read-only, so Glances can report their usage
          hostPath:
            path: /

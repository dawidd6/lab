# Glances has no login of its own: the gateway asks Authelia first (Homarr uses the in-cluster Service, not this route)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: glances
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: glances
  oidc:
    provider:
      issuer: https://auth.dawidd6.duckdns.org
      # stated explicitly so Envoy Gateway never fetches (and caches a failure of) Authelia's discovery document,
      # e.g. when it processes this policy while Authelia restarts
      authorizationEndpoint: https://auth.dawidd6.duckdns.org/api/oidc/authorization
      tokenEndpoint: https://auth.dawidd6.duckdns.org/api/oidc/token
    clientID: glances
    clientSecret:
      group: ""
      kind: Secret
      name: glances-oidc # oidc.yaml (Infisical), key client-secret
    redirectURL: https://glances.dawidd6.duckdns.org/oauth2/callback
    logoutPath: /logout

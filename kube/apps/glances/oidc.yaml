# the gateway's Authelia client for Glances (securitypolicy.yaml)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: glances-oidc
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials # kube/infisical.sops.yaml
        secretNamespace: infisical
      secretsScope:
        projectSlug: lab
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: glances-oidc
      secretNamespace: glances
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          client-secret: '{{ .GLANCES_CLIENT_SECRET.Value }}'

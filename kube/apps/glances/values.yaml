# Glances in web server mode: its REST API serves Homepage's glances widget (CPU, memory, temperature, disk)
# at http://glances.glances.svc:61208; /proc and /sys aren't namespaced, so a plain pod sees the host's values
controllers:
  glances:
    containers:
      glances:
        image:
          repository: docker.io/nicolargo/glances
          tag: 4.5.7
        env:
          GLANCES_OPT: -w # the image runs `python -m glances ${GLANCES_OPT}`; -w: web server (UI and API)
        resources:
          limits:
            memory: 128Mi
service:
  glances:
    controller: glances
    ports:
      http:
        port: 61208
persistence:
  rootfs: # the host's disks, read-only, so Glances can report their usage
    type: hostPath
    hostPath: /
    globalMounts:
      - path: /rootfs
        readOnly: true
route:
  glances:
    parentRefs:
      - name: envoy
        namespace: envoy-gateway
        sectionName: https
    hostnames:
      - glances.dawidd6.duckdns.org
    rules:
      - matches: # the API server's default, spelled out so Argo CD's diff matches the live route
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: glances
            port: 61208

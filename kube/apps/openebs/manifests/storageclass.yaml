# volumes as logical volumes in the host's LVM volume group kubevg (create it first: vgcreate kubevg <disk>);
# internal (values/openebs.yaml) stays the hostpath class on the system disk
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: external
provisioner: local.csi.openebs.io # OpenEBS LVM LocalPV
parameters:
  vgpattern: ^kubevg$ # exactly kubevg; vgpattern replaces volgroup, which the driver plans to deprecate
  fsType: ext4
reclaimPolicy: Retain # like internal: a deleted PVC keeps its data
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer # the volume is created on the node the pod lands on

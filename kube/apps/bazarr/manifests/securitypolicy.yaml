# for apps without a login of their own: the gateway asks the OIDC provider first
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: bazarr
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bazarr
  oidc:
    provider:
      # stated explicitly so Envoy Gateway never fetches (and caches a failure of) Authelia's discovery document,
      # e.g. when it processes this policy while Authelia restarts
      authorizationEndpoint: https://authelia.dawidd6.duckdns.org/api/oidc/authorization
      issuer: https://authelia.dawidd6.duckdns.org
      tokenEndpoint: https://authelia.dawidd6.duckdns.org/api/oidc/token
    clientID: bazarr
    clientSecret:
      group: ""
      kind: Secret
      name: bazarr-oidc
    redirectURL: https://bazarr.dawidd6.duckdns.org/oauth2/callback
    logoutPath: /logout

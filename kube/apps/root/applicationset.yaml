# every apps/<name>/kustomization.yaml becomes an Application named <name> in the namespace it sets: its charts/
# (helmCharts, rendered with --enable-helm, argocd/charts/values.yaml) and manifests/, plus everything every app shares (below);
# removing the directory deletes what it deployed
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/dawidd6/lab
        revision: master
        files:
          - path: kube/apps/*/kustomization.yaml
          - path: kube/apps/*/charts/kustomization.yaml # the generator's * also matches across /, so exclude charts/ explicitly
            exclude: true
  template:
    metadata:
      name: '{{ .path.basename }}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: . # re-render only when a commit touches this app's directory
    spec:
      project: default
      source:
        repoURL: https://github.com/dawidd6/lab
        targetRevision: master
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true # CRs whose CRDs another app or this app's chart installs

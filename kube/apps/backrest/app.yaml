# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backrest
spec:
  project: default
  destination:
    namespace: backrest
  source:
    repoURL: ghcr.io/bjw-s-labs/helm
    chart: app-template # a generic chart for any container image (Backrest has no chart of its own)
    targetRevision: 5.3.0
    helm:
      valuesObject:
        # backups with restic and a web UI to browse and restore them: every PVC on the internal disk (/data/internal,
        # one directory per PVC, local-path-provisioner/app.yaml) into a restic repository on the USB drive (the
        # repository volume). All its settings (repository, plan with schedule and retention, no login of its own) are
        # its config.json in manifests/backrest.sops.yaml, read-only, so they change only here, not in the UI. The
        # repository is created once, after the first deploy: kubectl -n backrest exec deploy/backrest -- restic init
        controllers:
          backrest:
            containers:
              backrest:
                image:
                  repository: ghcr.io/garethgeorge/backrest
                  tag: v1.14.1-alpine # with timezone data, for the schedule in local time
                env:
                  TZ: Europe/Warsaw
                  BACKREST_PORT: 0.0.0.0:9898
                  BACKREST_CONFIG: /config/config.json
                  BACKREST_DATA: /var/lib/backrest
                  XDG_CACHE_HOME: /var/lib/backrest/cache # restic's cache
                  RESTIC_REPOSITORY: /repository # for restic run by hand (restic init); Backrest has it in config.json
                  RESTIC_PASSWORD: # the repository's password, for Backrest's restic and by hand alike
                    valueFrom:
                      secretKeyRef:
                        name: backrest # manifests/backrest.sops.yaml
                        key: RESTIC_PASSWORD
        service:
          backrest:
            controller: backrest
            ports:
              http:
                port: 9898
        persistence:
          config:
            type: secret
            name: backrest # manifests/backrest.sops.yaml
            items:
              - key: config.json
                path: config.json
            globalMounts:
              - path: /config
                readOnly: true
          data: # its operation history, logs and restic's cache
            type: persistentVolumeClaim
            storageClass: internal
            accessMode: ReadWriteOnce
            size: 1Gi
            globalMounts:
              - path: /var/lib/backrest
          repository: # the restic repository, on the USB drive
            type: persistentVolumeClaim
            storageClass: external
            accessMode: ReadWriteOnce
            size: 100Gi # not enforced by local-path
            globalMounts:
              - path: /repository
          internal: # what gets backed up; writable, so restores can go back in place
            type: hostPath
            hostPath: /data/internal
            hostPathType: Directory
            globalMounts:
              - path: /data/internal

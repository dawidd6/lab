mode:
  standalone:
    enabled: true # one pod with one data volume; distributed mode spreads data over several nodes
  distributed:
    enabled: false
secret:
  existingSecret: rustfs-admin # secrets/admin.sops.yaml: the admin's access key and secret key, also the console login
config:
  rustfs:
    obs_log_directory: "" # logs only to stdout, so no logs volume
# console login through Authelia (its rustfs client, authelia/values/authelia.yaml), which sends the RustFS policy as
# the roles claim; the client secret, RUSTFS_IDENTITY_OPENID_CLIENT_SECRET, is in secrets/admin.sops.yaml
extraEnv:
  - name: RUSTFS_IDENTITY_OPENID_ENABLE
    value: "on"
  - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
    value: Authelia
  - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
    value: https://authelia.dawidd6.duckdns.org
  - name: RUSTFS_OUTBOUND_ALLOW_ORIGINS # Authelia's host resolves to a private address, which RustFS refuses otherwise
    value: https://authelia.dawidd6.duckdns.org:443
  - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
    value: rustfs
  - name: RUSTFS_IDENTITY_OPENID_SCOPES
    value: openid,profile,email,rustfs
  - name: RUSTFS_IDENTITY_OPENID_ROLES_CLAIM
    value: roles
  - name: RUSTFS_IDENTITY_OPENID_EMAIL_CLAIM
    value: email
  - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM
    value: preferred_username
  - name: RUSTFS_BROWSER_REDIRECT_URL # the console's public origin
    value: https://rustfs.dawidd6.duckdns.org
  - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI
    value: https://rustfs.dawidd6.duckdns.org/rustfs/admin/v3/oidc/callback/default
  - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
    value: "off"
ingress:
  enabled: false # the console route is in values/extra.yaml
storageclass:
  name: internal
  dataStorageSize: 1Gi

# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
spec:
  project: default
  destination:
    namespace: rustfs
  sources:
    - repoURL: https://charts.rustfs.com
      chart: rustfs # S3-compatible object storage with a web console
      targetRevision: 1.0.1

# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
spec:
  project: default
  destination:
    namespace: fluent-bit
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.58.3
    helm:
      valuesObject:
        # the host's systemd journal (k0s, containerd, the kernel, SSH, mounts...) into VictoriaLogs
        # (victoria-metrics/app.yaml); the pods' logs get there through vlagent instead. The chart only takes Fluent
        # Bit's config as text
        testFramework:
          enabled: false # no Helm test pod
        rbac:
          create: false # only the Kubernetes filter needs it, and the pods' logs come through vlagent
        config:
          inputs: |
            [INPUT]
                Name systemd
                Tag host.*
                Path /var/log/journal
                DB /var/lib/fluent-bit/journal.db
                Read_From_Tail On
          filters: ""
          outputs: |
            [OUTPUT]
                Name http
                Match host.*
                Host vlsingle-victoria-metrics.victoria-metrics.svc
                Port 9428
                URI /insert/jsonline?_stream_fields=_HOSTNAME,_SYSTEMD_UNIT&_msg_field=MESSAGE&_time_field=date
                Format json_lines
                Json_Date_Format iso8601
                Retry_Limit False
        # the journal and the machine ID its directory is named after, read-only; the position file (so a restart
        # continues where it stopped) in a directory of its own, the only writable one
        daemonSetVolumes:
          - name: journal
            hostPath:
              path: /var/log/journal
              type: Directory
          - name: etcmachineid
            hostPath:
              path: /etc/machine-id
              type: File
          - name: state
            hostPath:
              path: /var/lib/fluent-bit
              type: DirectoryOrCreate
        daemonSetVolumeMounts:
          - name: journal
            mountPath: /var/log/journal
            readOnly: true
          - name: etcmachineid
            mountPath: /etc/machine-id
            readOnly: true
          - name: state
            mountPath: /var/lib/fluent-bit

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.5
      helm:
        releaseName: argocd
        valuesObject:
          configs:
            params:
              server.insecure: true # TLS ends at the gateway
          dex:
            enabled: false
          notifications:
            enabled: false
    - repoURL: https://github.com/dawidd6/lab # this directory's other manifests
      targetRevision: master
      path: kube/apps/argocd
      directory:
        exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # CRs whose CRDs another app or this app's chart installs

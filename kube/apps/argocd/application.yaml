apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # removing the app deletes what it deployed
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.6
      helm:
        releaseName: argocd
        valuesObject:
          configs:
            cm:
              url: https://argocd.dawidd6.duckdns.org
              # Argo CD only takes this as a string; the client secret comes from oidc.yaml (Infisical)
              oidc.config: |
                name: Authelia
                issuer: https://auth.dawidd6.duckdns.org
                clientID: argocd
                clientSecret: $argocd-oidc:clientSecret
                requestedScopes: [openid, profile, email, groups]
            rbac:
              policy.csv: g, admins, role:admin # the admins group in Authelia's users file
            params:
              server.insecure: true # TLS ends at the gateway
          dex:
            enabled: false
          notifications:
            enabled: false
    - repoURL: https://github.com/dawidd6/lab # this directory's other manifests
      targetRevision: master
      path: kube/apps/argocd
      directory:
        exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # CRs whose CRDs another app or this app's chart installs

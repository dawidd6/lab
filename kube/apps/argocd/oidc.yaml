# Argo CD's Dex client secret ($argocd-oidc:clientSecret in its oidc.config)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: argocd-oidc
  labels:
    app.kubernetes.io/part-of: argocd # copied onto the secret; Argo CD only reads labelled secrets
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials # kube/infisical.sops.yaml
        secretNamespace: infisical
      secretsScope:
        projectSlug: lab
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: argocd-oidc
      secretNamespace: argocd
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          clientSecret: '{{ .ARGOCD_CLIENT_SECRET.Value }}'

# one Helm chart, rendered as a release named after this directory, into `namespace`; every other *.yaml here
# is applied as is (repo: an OCI registry without oci://, or an https:// Helm repository)
namespace: argocd
repo: https://argoproj.github.io/argo-helm
chart: argo-cd
version: 10.9.6
values:
  configs:
    params:
      server.insecure: true # TLS ends at the gateway
  dex:
    enabled: false
  notifications:
    enabled: false

configs:
  cm:
    url: https://argocd.dawidd6.duckdns.org
    # Argo CD only takes this as a string; the client secret comes from secrets/oidc.sops.yaml
    oidc.config: |
      name: Authelia
      issuer: https://authelia.dawidd6.duckdns.org
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes: [openid, profile, email, groups]
      enableUserInfoGroups: true # Authelia sends groups in userinfo, not in the ID token
      userInfoPath: /api/oidc/userinfo
  rbac:
    policy.csv: g, admins, role:admin # the admins group in Authelia's users file
  params:
    server.insecure: true # TLS ends at the gateway
    # compare with what the API server would make of each object (defaults included), not with Argo CD's own rendering:
    # otherwise fields the API server fills in, like a StatefulSet's volumeClaimTemplates[].status, look like drift
    controller.diff.server.side: true
dex:
  enabled: false
notifications:
  enabled: false

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd # also what the chart sees as its release namespace
helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.9.6
    releaseName: argocd
    valuesFile: values.yaml
    includeCRDs: true

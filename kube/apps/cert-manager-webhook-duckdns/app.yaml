# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-duckdns
spec:
  project: default
  destination:
    namespace: cert-manager
  source:
    repoURL: ghcr.io/cobexer/charts
    chart: cert-manager-webhook-duckdns
    targetRevision: 2.0.0
    helm:
      valuesObject:
        certManager:
          namespace: cert-manager # grants cert-manager's service account access to the solver
        secret:
          existingSecret: true
          existingSecretName: duckdns # manifests/duckdns.sops.yaml

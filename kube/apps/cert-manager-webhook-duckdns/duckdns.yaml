# DuckDNS API token, for the wildcard certificate's DNS-01 challenges
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: duckdns
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials # kube/infisical.sops.yaml
        secretNamespace: infisical
      secretsScope:
        projectSlug: lab
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: duckdns
      secretNamespace: cert-manager
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          token: '{{ .DUCKDNS_TOKEN.Value }}'

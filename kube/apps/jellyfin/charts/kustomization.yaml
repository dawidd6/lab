apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media # also what the chart sees as its release namespace
helmCharts:
  - name: jellyfin
    repo: https://jellyfin.github.io/jellyfin-helm
    version: 3.2.0
    releaseName: jellyfin
    valuesFile: values.yaml
    includeCRDs: true

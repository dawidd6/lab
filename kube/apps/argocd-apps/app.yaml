# read by the ApplicationSet in argocd-apps/values/argocd-apps.yaml: its charts (with values/<chart>.yaml), secrets/
# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps
spec:
  project: default
  destination:
    namespace: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-apps # Argo's chart for declaring ApplicationSets in values (values/argocd-apps.yaml)
      targetRevision: 2.0.6

# read by the ApplicationSet in argocd-apps/values/argocd-apps.yaml: its charts (with values/<chart>.yaml), secrets/
# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jdownloader2
spec:
  project: default
  destination:
    namespace: media
  sources:
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template # a generic chart for any container image (JDownloader has no chart of its own)
      targetRevision: 5.2.1

# nightly restic backup of JDownloader's config volume to Backblaze B2, by the k8up operator
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: jdownloader2
spec:
  backend:
    s3:
      bucket: dawidd6-lab/jdownloader # endpoint, key and restic password: k8up's defaults (k8up/values.yaml)
  backup:
    schedule: "30 3 * * *"
    labelSelectors: # only this app's PVC (the namespace is shared)
      - matchLabels:
          app.kubernetes.io/instance: jdownloader2
  prune:
    schedule: "0 4 * * 0"

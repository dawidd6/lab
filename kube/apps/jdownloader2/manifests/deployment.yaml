apiVersion: apps/v1
kind: Deployment
metadata:
  name: jdownloader2
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: jdownloader2
  strategy:
    type: Recreate # never two JDownloaders on one config
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jdownloader2
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jdownloader2
          image: docker.io/jlesage/jdownloader-2:v26.09.1
          env:
            # the image starts as root and runs JDownloader as this user; 568 owns the existing files in /config and /output
            - name: USER_ID
              value: "568"
            - name: GROUP_ID
              value: "568"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: output
              mountPath: /output
      volumes:
        - name: config # JDownloader's settings
          persistentVolumeClaim:
            claimName: jdownloader2-config # pvc.yaml
        - name: output # downloads, shared with Jellyfin
          persistentVolumeClaim:
            claimName: media # jellyfin/manifests/pvc.yaml

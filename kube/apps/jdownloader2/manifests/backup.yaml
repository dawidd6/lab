# nightly restic backup of the jdownloader2-config volume to Backblaze B2 (backup.sops.yaml); restore with a ReplicationDestination
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: jdownloader2
spec:
  sourcePVC: jdownloader2-config
  trigger:
    schedule: "40 3 * * *"
  restic:
    repository: jdownloader2-backup # backup.sops.yaml
    copyMethod: Direct # openebs hostpath has no snapshots, so the mover reads the live volume
    cacheStorageClassName: internal # no default StorageClass in this cluster
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    moverSecurityContext: # the user that owns the volume's files
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568

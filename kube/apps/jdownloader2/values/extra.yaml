routes:
  jdownloader2:
    hostname: jdownloader.dawidd6.duckdns.org
    port: 5800 # the web UI (noVNC)
securityPolicies:
  jdownloader: # JDownloader has no login of its own
    route: jdownloader2
    provider:
      issuer: https://authelia.dawidd6.duckdns.org
      # stated explicitly so Envoy Gateway never fetches (and caches a failure of) Authelia's discovery document,
      # e.g. when it processes this policy while Authelia restarts
      authorizationEndpoint: https://authelia.dawidd6.duckdns.org/api/oidc/authorization
      tokenEndpoint: https://authelia.dawidd6.duckdns.org/api/oidc/token
    redirectURL: https://jdownloader.dawidd6.duckdns.org/oauth2/callback
backups:
  jdownloader2: # nightly, to Backblaze B2
    pvc: jdownloader2-config
    schedule: "40 3 * * *"
    user: 568

# JDownloader's settings (cfg/ of its config volume; the rest is the app itself, logs and tmp), nightly (backup-schedule.yaml) into kopiur's B2 repository (kopiur/repository.yaml)
# on demand: kubectl kopiur snapshot now -n media --policy jdownloader2 --wait
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: jdownloader2
spec:
  repository:
    kind: ClusterRepository
    name: b2
  credentialProjection:
    enabled: true
  copyMethod: Direct # openebs-hostpath has no snapshots, so kopia reads the live volume
  sources:
    - pvc:
        name: jdownloader2-config
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
  files:
    ignoreRules: # .gitignore-style: everything at the top, except cfg/
      - /*
      - "!/cfg"
  mover:
    securityContext:
      runAsUser: 568 # owns the files, some readable only by it
      runAsGroup: 568

pod:
  kind: Deployment # the chart's default is a DaemonSet
persistence:
  enabled: true # /config: the SQLite database and notification.txt
  storageClass: openebs-hostpath
secret:
  existingSecret: authelia # secret.yaml (Infisical); the chart mounts only its own keys at /secrets/internal
  additionalSecrets:
    authelia: {} # the same secret, all keys, at /secrets/authelia: the JWK, client secrets
configMap:
  totp:
    disable: true # no second factor
  webauthn:
    disable: true
  access_control:
    default_policy: one_factor # the chart sets two_factor, impossible without a second factor
  authentication_backend:
    ldap:
      enabled: true
      implementation: lldap # LLDAP's attributes, filters and password reset
      address: ldap://lldap.lldap.svc:3890 # lldap/values.yaml
      base_dn: dc=lab
      # ponytail: binds as LLDAP's admin; a dedicated user in lldap_password_manager if that's too broad
      user: uid=admin,ou=people,dc=lab # password: authentication.ldap.password.txt in secret.yaml
  session:
    cookies:
      - domain: dawidd6.duckdns.org
        subdomain: authelia
  storage:
    local:
      enabled: true
  notifier:
    filesystem:
      enabled: true # required; one-time codes (e.g. password reset) land in /config/notification.txt
  identity_providers:
    oidc:
      enabled: true
      jwks:
        - key:
            path: /secrets/authelia/oidc.jwk.RS256.pem
      clients:
        - client_id: argocd
          client_name: Argo CD
          client_secret:
            path: /secrets/authelia/oidc.client.argocd
          authorization_policy: one_factor # password only
          consent_mode: implicit
          redirect_uris:
            - https://argocd.dawidd6.duckdns.org/auth/callback
        - client_id: homepage
          client_name: Homepage
          client_secret:
            path: /secrets/authelia/oidc.client.homepage
          authorization_policy: one_factor # password only
          consent_mode: implicit
          redirect_uris:
            - https://homepage.dawidd6.duckdns.org/oauth2/callback # homepage/securitypolicy.yaml
        - client_id: jdownloader
          client_name: JDownloader
          client_secret:
            path: /secrets/authelia/oidc.client.jdownloader
          authorization_policy: one_factor # password only
          consent_mode: implicit
          redirect_uris:
            - https://jdownloader.dawidd6.duckdns.org/oauth2/callback # jdownloader2/securitypolicy.yaml
        - client_id: glances
          client_name: Glances
          client_secret:
            path: /secrets/authelia/oidc.client.glances
          authorization_policy: one_factor # password only
          consent_mode: implicit
          redirect_uris:
            - https://glances.dawidd6.duckdns.org/oauth2/callback # glances/securitypolicy.yaml

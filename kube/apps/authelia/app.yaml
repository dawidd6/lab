# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
spec:
  project: default
  destination:
    namespace: authelia
  source:
    repoURL: https://charts.authelia.com
    chart: authelia
    targetRevision: 0.11.22
    helm:
      valuesObject:
        pod:
          kind: Deployment # the chart's default is a DaemonSet
        persistence:
          enabled: true # /config: the SQLite database and notification.txt
          storageClass: internal
          size: 1Gi
        secret:
          existingSecret: authelia # manifests/secret.sops.yaml; the chart mounts only its own keys at /secrets/internal
          additionalSecrets:
            authelia: {} # the same secret, all keys, at /secrets/authelia: the JWK, client secrets, users file
        configMap:
          theme: auto
          totp:
            disable: true # no second factor
          webauthn:
            disable: true
          access_control:
            default_policy: one_factor # the chart sets two_factor, impossible without a second factor
          authentication_backend:
            # the users file is a read-only Secret (manifests/secret.sops.yaml), so Authelia can't save new passwords:
            # change them there instead, and don't offer links that would only fail
            password_reset:
              disable: true
            password_change:
              disable: true
            file:
              enabled: true
              # passwords in it are argon2id hashes, not encrypted (authelia crypto hash generate argon2, from mise); the file
              # as a whole is encrypted with sops (age) in git
              path: /secrets/authelia/users_database.yml # manifests/secret.sops.yaml (edit from kube/: sops apps/authelia/manifests/secret.sops.yaml)
              watch: true
          session:
            cookies:
              - domain: dawidd6.duckdns.org
                subdomain: authelia
          storage:
            local:
              enabled: true
          notifier:
            filesystem:
              enabled: true # required; one-time codes (e.g. password reset) land in /config/notification.txt
          definitions:
            user_attributes:
              rustfs_policy: # the RustFS policy a user gets (RustFS's built-in ones): admins manage it, anyone else only reads
                expression: '"admins" in groups ? "consoleAdmin" : "readonly"'
          identity_providers:
            oidc:
              enabled: true
              # RustFS reads claims only from the ID token, and takes a roles claim's values as the names of its policies
              claims_policies:
                rustfs:
                  id_token: [email, preferred_username, roles]
                  custom_claims:
                    roles:
                      attribute: rustfs_policy
              scopes:
                rustfs:
                  claims: [roles]
              jwks:
                - key:
                    path: /secrets/authelia/oidc.jwk.RS256.pem
              clients:
                - client_id: argocd
                  client_name: Argo CD
                  client_secret:
                    path: /secrets/authelia/oidc.client.argocd
                  authorization_policy: one_factor # password only
                  consent_mode: implicit
                  redirect_uris:
                    - https://argocd.dawidd6.duckdns.org/auth/callback
                - client_id: homepage
                  client_name: Homepage
                  client_secret:
                    path: /secrets/authelia/oidc.client.homepage
                  authorization_policy: one_factor # password only
                  consent_mode: implicit
                  redirect_uris:
                    - https://homepage.dawidd6.duckdns.org/oauth2/callback # homepage/manifests/securitypolicy.yaml
                - client_id: pairdrop
                  client_name: PairDrop
                  client_secret:
                    path: /secrets/authelia/oidc.client.pairdrop
                  authorization_policy: one_factor # password only
                  consent_mode: implicit
                  redirect_uris:
                    - https://pairdrop.dawidd6.duckdns.org/oauth2/callback # pairdrop/manifests/securitypolicy.yaml
                - client_id: jdownloader
                  client_name: JDownloader
                  client_secret:
                    path: /secrets/authelia/oidc.client.jdownloader
                  authorization_policy: one_factor # password only
                  consent_mode: implicit
                  redirect_uris:
                    - https://jdownloader.dawidd6.duckdns.org/oauth2/callback # jdownloader2/manifests/securitypolicy.yaml
                - client_id: gatus
                  client_name: Gatus
                  client_secret:
                    path: /secrets/authelia/oidc.client.gatus
                  authorization_policy: one_factor # password only
                  consent_mode: implicit
                  redirect_uris:
                    - https://gatus.dawidd6.duckdns.org/oauth2/callback # gatus/manifests/securitypolicy.yaml
                - client_id: grafana
                  client_name: Grafana
                  client_secret:
                    path: /secrets/authelia/oidc.client.grafana
                  authorization_policy: one_factor # password only
                  consent_mode: implicit
                  require_pkce: true # Grafana sends a PKCE challenge (use_pkce, victoria-metrics/app.yaml)
                  pkce_challenge_method: S256
                  redirect_uris:
                    - https://grafana.dawidd6.duckdns.org/login/generic_oauth # Grafana's own OIDC login (victoria-metrics/app.yaml)
                - client_id: gotify
                  client_name: Gotify
                  client_secret:
                    path: /secrets/authelia/oidc.client.gotify
                  authorization_policy: one_factor # password only
                  consent_mode: implicit
                  require_pkce: true # Gotify always sends a PKCE challenge
                  pkce_challenge_method: S256
                  redirect_uris:
                    - https://gotify.dawidd6.duckdns.org/auth/oidc/callback # the web UI (gotify/app.yaml)
                    - gotify://oidc/callback # the Android app
                - client_id: rustfs
                  client_name: RustFS
                  client_secret:
                    path: /secrets/authelia/oidc.client.rustfs
                  authorization_policy: one_factor # password only
                  consent_mode: implicit
                  require_pkce: true # RustFS always sends a PKCE challenge
                  pkce_challenge_method: S256
                  token_endpoint_auth_method: client_secret_post # RustFS sends its secret in the request body
                  claims_policy: rustfs
                  scopes: [openid, profile, email, rustfs]
                  redirect_uris:
                    - https://rustfs.dawidd6.duckdns.org/rustfs/admin/v3/oidc/callback/default # rustfs/app.yaml

pod:
  kind: Deployment # the chart's default is a DaemonSet
persistence:
  enabled: true # /config: the SQLite database and notification.txt
  storageClass: internal
  size: 1Gi
secret:
  existingSecret: authelia # secrets/secret.sops.yaml; the chart mounts only its own keys at /secrets/internal
  additionalSecrets:
    authelia: {} # the same secret, all keys, at /secrets/authelia: the JWK, client secrets, users file
configMap:
  totp:
    disable: true # no second factor
  webauthn:
    disable: true
  access_control:
    default_policy: one_factor # the chart sets two_factor, impossible without a second factor
  authentication_backend:
    # the users file is a read-only Secret (secrets/secret.sops.yaml), so Authelia can't save new passwords:
    # change them there instead, and don't offer links that would only fail
    password_reset:
      disable: true
    password_change:
      disable: true
    file:
      enabled: true
      # passwords in it are argon2id hashes, not encrypted (authelia crypto hash generate argon2, from mise); the file
      # as a whole is encrypted with sops (age) in git
      path: /secrets/authelia/users_database.yml # secrets/secret.sops.yaml (edit from kube/: sops apps/authelia/secrets/secret.sops.yaml)
      watch: true
  session:
    cookies:
      - domain: dawidd6.duckdns.org
        subdomain: authelia
  storage:
    local:
      enabled: true
  notifier:
    filesystem:
      enabled: true # required; one-time codes (e.g. password reset) land in /config/notification.txt
  identity_providers:
    oidc:
      enabled: true
      jwks:
        - key:
            path: /secrets/authelia/oidc.jwk.RS256.pem
      clients:
        - client_id: argocd
          client_name: Argo CD
          client_secret:
            path: /secrets/authelia/oidc.client.argocd
          authorization_policy: one_factor # password only
          consent_mode: implicit
          redirect_uris:
            - https://argocd.dawidd6.duckdns.org/auth/callback
        - client_id: homepage
          client_name: Homepage
          client_secret:
            path: /secrets/authelia/oidc.client.homepage
          authorization_policy: one_factor # password only
          consent_mode: implicit
          redirect_uris:
            - https://homepage.dawidd6.duckdns.org/oauth2/callback # homepage/values/extra.yaml
        - client_id: jdownloader
          client_name: JDownloader
          client_secret:
            path: /secrets/authelia/oidc.client.jdownloader
          authorization_policy: one_factor # password only
          consent_mode: implicit
          redirect_uris:
            - https://jdownloader.dawidd6.duckdns.org/oauth2/callback # jdownloader2/values/extra.yaml
        - client_id: gatus
          client_name: Gatus
          client_secret:
            path: /secrets/authelia/oidc.client.gatus
          authorization_policy: one_factor # password only
          consent_mode: implicit
          redirect_uris:
            - https://gatus.dawidd6.duckdns.org/oauth2/callback # gatus/values/extra.yaml
        - client_id: grafana
          client_name: Grafana
          client_secret:
            path: /secrets/authelia/oidc.client.grafana
          authorization_policy: one_factor # password only
          consent_mode: implicit
          require_pkce: true # Grafana sends a PKCE challenge (use_pkce, victoria-metrics/values.yaml)
          pkce_challenge_method: S256
          redirect_uris:
            - https://grafana.dawidd6.duckdns.org/login/generic_oauth # Grafana's own OIDC login (victoria-metrics/values.yaml)

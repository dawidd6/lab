apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.authelia.com
      chart: authelia
      targetRevision: 0.11.22
      helm:
        releaseName: authelia
        valuesObject:
          pod:
            kind: Deployment # the chart's default is a DaemonSet
          persistence:
            enabled: true # /config: the SQLite database and notification.txt
            storageClass: openebs-hostpath
          secret:
            existingSecret: authelia # secret.yaml (Infisical); the chart mounts only its own keys at /secrets/internal
            additionalSecrets:
              authelia: {} # the same secret, all keys, at /secrets/authelia: the JWK, client secrets, users file
          configMap:
            totp:
              disable: true # no second factor
            webauthn:
              disable: true
            access_control:
              default_policy: one_factor # the chart sets two_factor, impossible without a second factor
            authentication_backend:
              file:
                enabled: true
                path: /secrets/authelia/users_database.yml
                watch: true
            session:
              cookies:
                - domain: dawidd6.duckdns.org
                  subdomain: auth
            storage:
              local:
                enabled: true
            notifier:
              filesystem:
                enabled: true # required; one-time codes (e.g. password reset) land in /config/notification.txt
            identity_providers:
              oidc:
                enabled: true
                jwks:
                  - key:
                      path: /secrets/authelia/oidc.jwk.RS256.pem
                clients:
                  - client_id: argocd
                    client_name: Argo CD
                    client_secret:
                      path: /secrets/authelia/oidc.client.argocd
                    authorization_policy: one_factor # password only
                    consent_mode: implicit
                    scopes: [openid, profile, email, groups]
                    redirect_uris:
                      - https://argocd.dawidd6.duckdns.org/auth/callback
                  - client_id: homarr
                    client_name: Homarr
                    client_secret:
                      path: /secrets/authelia/oidc.client.homarr
                    authorization_policy: one_factor # password only
                    consent_mode: implicit
                    scopes: [openid, profile, email, groups]
                    redirect_uris:
                      - https://homarr.dawidd6.duckdns.org/api/auth/callback/oidc
                  - client_id: jdownloader
                    client_name: JDownloader
                    client_secret:
                      path: /secrets/authelia/oidc.client.jdownloader
                    authorization_policy: one_factor # password only
                    consent_mode: implicit
                    scopes: [openid, profile, email, groups]
                    redirect_uris:
                      - https://jdownloader.dawidd6.duckdns.org/oauth2/callback # jdownloader2/securitypolicy.yaml
    - repoURL: https://github.com/dawidd6/lab # this directory's other manifests
      targetRevision: master
      path: kube/apps/authelia
      directory:
        exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # CRs whose CRDs another app or this app's chart installs

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authelia # also what the chart sees as its release namespace
helmCharts:
  - name: authelia
    repo: https://charts.authelia.com
    version: 0.11.22
    releaseName: authelia
    valuesFile: values.yaml
    includeCRDs: true

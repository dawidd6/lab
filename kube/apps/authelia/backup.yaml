# nightly restic backup of Authelia's volume (its SQLite database) to Backblaze B2, by the k8up operator
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: authelia
spec:
  backend:
    s3:
      bucket: dawidd6-lab/authelia # endpoint, key and restic password: k8up's defaults (k8up/values.yaml)
  backup:
    schedule: "30 3 * * *"
  prune:
    schedule: "0 4 * * 0"

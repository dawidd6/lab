# Authelia's secrets, mounted at /secrets/internal (secret.existingSecret in application.yaml)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authelia
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials # kube/infisical.sops.yaml
        secretNamespace: infisical
      secretsScope:
        projectSlug: lab
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: authelia
      secretNamespace: authelia
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          identity_validation.reset_password.jwt.hmac.key: '{{ .AUTHELIA_RESET_PASSWORD_JWT_SECRET.Value }}'
          session.encryption.key: '{{ .AUTHELIA_SESSION_ENCRYPTION_KEY.Value }}'
          storage.encryption.key: '{{ .AUTHELIA_STORAGE_ENCRYPTION_KEY.Value }}'
          identity_providers.oidc.hmac.key: '{{ .AUTHELIA_OIDC_HMAC_SECRET.Value }}'
          oidc.jwk.RS256.pem: '{{ .AUTHELIA_OIDC_JWK.Value }}'
          # each app reads the same key in plain form; Authelia takes it with the $plaintext$ prefix
          oidc.client.argocd: '$plaintext${{ .ARGOCD_CLIENT_SECRET.Value }}'
          oidc.client.homarr: '$plaintext${{ .HOMARR_CLIENT_SECRET.Value }}'
          oidc.client.jdownloader: '$plaintext${{ .JDOWNLOADER_CLIENT_SECRET.Value }}'
          users_database.yml: '{{ .AUTHELIA_USERS.Value }}'

# Authelia's secrets, mounted at /secrets/internal and /secrets/authelia (see secret in app.yaml)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authelia
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials # kube/infisical.sops.yaml
        secretNamespace: infisical
      secretsScope:
        projectSlug: lab
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: authelia
      secretNamespace: authelia
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          identity_validation.reset_password.jwt.hmac.key: '{{ .AUTHELIA_RESET_PASSWORD_JWT_SECRET.Value }}'
          session.encryption.key: '{{ .AUTHELIA_SESSION_ENCRYPTION_KEY.Value }}'
          storage.encryption.key: '{{ .AUTHELIA_STORAGE_ENCRYPTION_KEY.Value }}'
          identity_providers.oidc.hmac.key: '{{ .AUTHELIA_OIDC_HMAC_SECRET.Value }}'
          oidc.jwk.RS256.pem: '{{ .AUTHELIA_OIDC_JWK.Value }}'
          # each app reads its client secret in plain form; Authelia only its digest (authelia crypto hash generate pbkdf2 --variant sha512)
          oidc.client.argocd: '{{ .ARGOCD_CLIENT_SECRET_DIGEST.Value }}'
          oidc.client.homepage: '{{ .HOMEPAGE_CLIENT_SECRET_DIGEST.Value }}'
          oidc.client.jdownloader: '{{ .JDOWNLOADER_CLIENT_SECRET_DIGEST.Value }}'
          oidc.client.glances: '{{ .GLANCES_CLIENT_SECRET_DIGEST.Value }}'
          authentication.ldap.password.txt: '{{ .LLDAP_ADMIN_PASSWORD.Value }}' # LLDAP's admin (lldap/secret.yaml)

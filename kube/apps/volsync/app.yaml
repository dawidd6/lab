# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volsync
spec:
  project: default
  destination:
    namespace: volsync
  source:
    repoURL: https://backube.github.io/helm-charts
    chart: volsync
    targetRevision: 0.16.0
    helm:
      # chart defaults: the operator behind VolSync backups (ReplicationSources in an app's manifests/; none right now)
      valuesObject: {}

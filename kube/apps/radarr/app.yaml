# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radarr
spec:
  project: default
  destination:
    namespace: media
  source:
    repoURL: ghcr.io/bjw-s-labs/helm
    chart: app-template # a generic chart for any container image
    targetRevision: 5.3.0
    helm:
      valuesObject:
        # movies: finds, downloads and sorts them into the media volume; set up in its UI
        controllers:
          radarr:
            containers:
              radarr:
                image:
                  repository: ghcr.io/linuxserver/radarr
                  tag: 6.4.4.10685-ls320
                env:
                  # the image starts as root and runs Radarr as this user, like JDownloader (jdownloader2/app.yaml)
                  PUID: 568
                  PGID: 568
                  TZ: Europe/Warsaw
                  RADARR__AUTH__METHOD: External # no login of its own: Authelia at the gateway (manifests/securitypolicy.yaml)
        service:
          radarr:
            controller: radarr
            ports:
              http:
                port: 7878
        persistence:
          config: # its settings and database
            type: persistentVolumeClaim
            storageClass: internal
            accessMode: ReadWriteOnce
            size: 1Gi
            globalMounts:
              - path: /config
          media: # shared with Jellyfin and JDownloader, at the same path as in Jellyfin
            existingClaim: media # jellyfin/manifests/pvc.yaml
            globalMounts:
              - path: /media

image:
  repository: ghcr.io/gethomepage/homepage # with tag, what Renovate's helm-values manager needs to update it
  tag: v2.4.0 # the chart's default is older
env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: homepage.dawidd6.duckdns.org # route.yaml
config:
  # each block becomes the config file of the same name; lists keep their order (map keys get sorted)
  settings:
    title: Lab
  widgets:
    - glances: # the host's stats from Glances' API, in-cluster (glances/values.yaml)
        url: http://glances.glances.svc:61208
        version: 4
        cpu: true
        mem: true
        cputemp: true
        uptime: true
        disk: /rootfs # the host's / as Glances sees it (glances/values.yaml)
    - search:
        provider: duckduckgo
  services:
    - Media:
        - JDownloader:
            href: https://jdownloader.dawidd6.duckdns.org
            icon: jdownloader.png
    - Cluster:
        - Argo CD:
            href: https://argocd.dawidd6.duckdns.org
            icon: argo-cd.png
        - Glances:
            href: https://glances.dawidd6.duckdns.org
            icon: glances.png
        - Authelia:
            href: https://authelia.dawidd6.duckdns.org
            icon: authelia.png
        - LLDAP:
            href: https://lldap.dawidd6.duckdns.org
            icon: lldap.png
  bookmarks: [] # the chart's default has an example

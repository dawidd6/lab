controllers:
  homepage:
    containers:
      homepage:
        image:
          repository: ghcr.io/gethomepage/homepage
          tag: v2.4.0
        env:
          HOMEPAGE_ALLOWED_HOSTS: homepage.dawidd6.duckdns.org # route below
service:
  homepage:
    controller: homepage
    ports:
      http:
        port: 3000
configMaps:
  config: # Homepage's config files; the rest of /app/config (skeleton files, logs) Homepage writes itself
    data:
      settings.yaml: |
        title: Lab
      widgets.yaml: |
        - search:
            provider: duckduckgo
      services.yaml: |
        - Media:
            - Jellyfin:
                href: https://jellyfin.dawidd6.duckdns.org
                icon: jellyfin.png
            - JDownloader:
                href: https://jdownloader.dawidd6.duckdns.org
                icon: jdownloader.png
        - Cluster:
            - Argo CD:
                href: https://argocd.dawidd6.duckdns.org
                icon: argo-cd.png
            - Grafana:
                href: https://grafana.dawidd6.duckdns.org
                icon: grafana.png
            - Gatus:
                href: https://gatus.dawidd6.duckdns.org
                icon: gatus.png
            - Authelia:
                href: https://authelia.dawidd6.duckdns.org
                icon: authelia.png
      bookmarks.yaml: |
        [] # none; without this file Homepage writes its sample bookmarks
persistence:
  config:
    type: configMap
    identifier: config
    globalMounts:
      - path: /app/config/settings.yaml
        subPath: settings.yaml
      - path: /app/config/widgets.yaml
        subPath: widgets.yaml
      - path: /app/config/services.yaml
        subPath: services.yaml
      - path: /app/config/bookmarks.yaml
        subPath: bookmarks.yaml
route:
  homepage:
    parentRefs:
      - name: envoy
        namespace: envoy-gateway
        sectionName: https
    hostnames:
      - homepage.dawidd6.duckdns.org
    rules:
      - matches: # the API server's default, spelled out so Argo CD's diff matches the live route
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: homepage
            port: 3000

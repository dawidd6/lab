# the gateway's Authelia client for Homepage (securitypolicy.yaml)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: homepage-oidc
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials # kube/infisical.sops.yaml
        secretNamespace: infisical
      secretsScope:
        projectSlug: lab
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: homepage-oidc
      secretNamespace: homepage
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          client-secret: '{{ .HOMEPAGE_CLIENT_SECRET.Value }}'

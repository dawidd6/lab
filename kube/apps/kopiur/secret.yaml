# Backblaze B2 key and the kopia repository's encryption password (repository.yaml); kopiur copies it into each
# namespace that backs up (their SnapshotPolicy's credentialProjection)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: b2
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials # kube/infisical.sops.yaml
        secretNamespace: infisical
      secretsScope:
        projectSlug: lab
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: b2
      secretNamespace: kopiur
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          B2_KEY_ID: '{{ .B2_KEY_ID.Value }}'
          B2_KEY: '{{ .B2_APPLICATION_KEY.Value }}'
          KOPIA_PASSWORD: '{{ .RESTIC_PASSWORD.Value }}'

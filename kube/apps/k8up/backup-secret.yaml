# restic password and Backblaze B2 key: k8up's defaults for every Schedule (values.yaml)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: backup
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials # kube/infisical.sops.yaml
        secretNamespace: infisical
      secretsScope:
        projectSlug: lab
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: backup
      secretNamespace: k8up
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          RESTIC_PASSWORD: '{{ .RESTIC_PASSWORD.Value }}'
          B2_ACCOUNT_ID: '{{ .B2_KEY_ID.Value }}'
          B2_ACCOUNT_KEY: '{{ .B2_APPLICATION_KEY.Value }}'

# defaults: only namespaces with a k8up Schedule are backed up (the Schedule is the opt-in);
# within such a namespace a Schedule can narrow down its PVCs (backup.labelSelectors, k8up.io/backup: "false")
k8up:
  # defaults for every Schedule: the B2 endpoint, its key and the restic password (backup-secret.yaml);
  # a Schedule only sets its repository (backend.s3.bucket); k8up passes these to its jobs as plain env vars
  envVars:
    - name: BACKUP_GLOBALS3ENDPOINT
      value: https://s3.eu-central-003.backblazeb2.com # B2's S3 API; restic recommends it over its native b2 backend
    - name: BACKUP_GLOBALACCESSKEYID
      valueFrom:
        secretKeyRef:
          name: backup
          key: B2_ACCOUNT_ID
    - name: BACKUP_GLOBALSECRETACCESSKEY
      valueFrom:
        secretKeyRef:
          name: backup
          key: B2_ACCOUNT_KEY
    - name: BACKUP_GLOBALREPOPASSWORD
      valueFrom:
        secretKeyRef:
          name: backup
          key: RESTIC_PASSWORD

env:
  AUTH_PROVIDERS: credentials,oidc # local login kept as a fallback
  AUTH_OIDC_ISSUER: https://auth.dawidd6.duckdns.org
  AUTH_OIDC_CLIENT_NAME: Authelia
  AUTH_OIDC_FORCE_USERINFO: "true" # Authelia sends groups and email in userinfo, not in the ID token
  AUTH_LOGOUT_REDIRECT_URL: https://auth.dawidd6.duckdns.org/logout # logging out of Homarr also ends the Authelia session
persistence:
  homarrDatabase:
    enabled: true
    storageClassName: openebs-hostpath

# nightly restic backup of this namespace's PVC (Homarr's database) to Backblaze B2, by the k8up operator
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
spec:
  backend:
    repoPasswordSecretRef:
      name: backup # backup-secret.yaml (Infisical)
      key: RESTIC_PASSWORD
    b2:
      bucket: dawidd6-lab
      path: homarr
      accountIDSecretRef:
        name: backup
        key: B2_ACCOUNT_ID
      accountKeySecretRef:
        name: backup
        key: B2_ACCOUNT_KEY
  backup:
    schedule: "30 3 * * *"
  prune:
    schedule: "0 4 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
  check:
    schedule: "0 5 1 * *" # monthly integrity check of the repository

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homarr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # removing the app deletes what it deployed
spec:
  project: default
  sources:
    - repoURL: ghcr.io/homarr-labs/charts
      chart: homarr
      targetRevision: 8.30.0
      helm:
        releaseName: homarr
        valuesObject:
          env:
            AUTH_PROVIDERS: credentials,oidc # local login kept as a fallback
            AUTH_OIDC_ISSUER: https://auth.dawidd6.duckdns.org
            AUTH_OIDC_CLIENT_NAME: Authelia
          persistence:
            homarrDatabase:
              enabled: true
              storageClassName: openebs-hostpath
    - repoURL: https://github.com/dawidd6/lab # this directory's other manifests
      targetRevision: master
      path: kube/apps/homarr
      directory:
        exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homarr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # CRs whose CRDs another app or this app's chart installs

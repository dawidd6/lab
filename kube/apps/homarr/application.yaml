apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homarr
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/homarr-labs/charts
      chart: homarr
      targetRevision: 8.29.2
      helm:
        releaseName: homarr
        valuesObject:
          persistence:
            homarrDatabase:
              enabled: true
              storageClassName: openebs-hostpath
    - repoURL: https://github.com/dawidd6/lab # this directory's other manifests
      targetRevision: master
      path: kube/apps/homarr
      directory:
        exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homarr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # CRs whose CRDs another app or this app's chart installs

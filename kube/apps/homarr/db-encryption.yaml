# the chart reads SECRET_ENCRYPTION_KEY from this secret (64 hex chars, e.g. openssl rand -hex 32)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: db-encryption
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials # kube/infisical.sops.yaml
        secretNamespace: infisical
      secretsScope:
        projectSlug: lab
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: db-encryption
      secretNamespace: homarr
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          db-encryption-key: '{{ .HOMARR_DB_ENCRYPTION_KEY.Value }}'

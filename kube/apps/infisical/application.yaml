apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
      chart: secrets-operator
      targetRevision: 0.11.10
      helm:
        releaseName: infisical
        valuesObject:
          hostAPI: https://eu.infisical.com/api # Infisical Cloud, EU region
    - repoURL: https://github.com/dawidd6/lab # this directory's other manifests
      targetRevision: master
      path: kube/apps/infisical
      directory:
        exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # CRs whose CRDs another app or this app's chart installs

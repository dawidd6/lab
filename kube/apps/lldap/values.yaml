# LLDAP: the users and groups behind Authelia (LDAP on 3890) and its web UI on 17170 (route.yaml)
controllers:
  lldap:
    containers:
      lldap:
        image:
          repository: docker.io/lldap/lldap
          tag: v0.6.3
        env:
          LLDAP_LDAP_BASE_DN: dc=lab
          LLDAP_HTTP_URL: https://lldap.dawidd6.duckdns.org # for password reset links
          LLDAP_FORCE_LDAP_USER_PASS_RESET: always # the admin password always follows Infisical; Authelia binds with it
        envFrom:
          - secretRef:
              name: lldap # secret.yaml
service:
  lldap:
    controller: lldap
    ports:
      http:
        port: 17170
      ldap:
        port: 3890
persistence:
  data: # the SQLite database (users, groups, password hashes)
    type: persistentVolumeClaim
    storageClass: openebs-hostpath
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /data

# LLDAP's secrets, read as env vars (values.yaml); the admin password is also Authelia's bind password
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: lldap
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials # kube/infisical.sops.yaml
        secretNamespace: infisical
      secretsScope:
        projectSlug: lab
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: lldap
      secretNamespace: lldap
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          LLDAP_JWT_SECRET: '{{ .LLDAP_JWT_SECRET.Value }}'
          LLDAP_KEY_SEED: '{{ .LLDAP_KEY_SEED.Value }}'
          LLDAP_LDAP_USER_PASS: '{{ .LLDAP_ADMIN_PASSWORD.Value }}'

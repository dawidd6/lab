apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager # also what the chart sees as its release namespace
helmCharts:
  - name: cert-manager
    repo: oci://quay.io/jetstack/charts
    version: v1.21.2
    releaseName: cert-manager
    valuesFile: values.yaml
    includeCRDs: true

# read by root/applicationset.yaml: its charts (with values.yaml next to it) plus manifests/, and what every app shares
# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
spec:
  project: default
  destination:
    namespace: cert-manager
  sources:
    - repoURL: quay.io/jetstack/charts
      chart: cert-manager
      targetRevision: 1.21.2

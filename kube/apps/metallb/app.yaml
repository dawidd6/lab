# read by root/applicationset.yaml: its charts (with values/<chart>.yaml) plus manifests/, and what every app shares
# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
spec:
  project: default
  destination:
    namespace: metallb
  sources:
    - repoURL: quay.io/metallb/chart
      chart: metallb
      targetRevision: 0.16.1

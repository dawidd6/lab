# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
spec:
  project: default
  destination:
    namespace: metallb
  source:
    repoURL: quay.io/metallb/chart
    chart: metallb
    targetRevision: 0.16.1
    helm:
      valuesObject:
        frrk8s:
          enabled: false # BGP backend, only L2 is used

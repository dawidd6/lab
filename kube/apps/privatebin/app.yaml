# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: privatebin
spec:
  project: default
  destination:
    namespace: privatebin
  sources:
    - repoURL: https://privatebin.github.io/helm-chart
      chart: privatebin
      targetRevision: 0.23.6

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: privatebin
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm # holds data: Argo CD asks before pruning or deleting it
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: internal
  resources:
    requests:
      storage: 1Gi

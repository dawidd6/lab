# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
spec:
  project: default
  destination:
    namespace: victoria-metrics
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-k8s-stack
    targetRevision: 0.96.0
    helm:
      valuesObject:
        # VictoriaMetrics (metrics from node-exporter, kube-state-metrics, the kubelet) and Grafana with its dashboards;
        # node-exporter's hwmon metrics include CPU, NVMe and board temperatures (node_hwmon_temp_celsius)
        fullnameOverride: victoria-metrics # instead of victoria-metrics-victoria-metrics-k8s-stack
        vmsingle:
          spec:
            retentionPeriod: "1" # months
            storage:
              storageClassName: internal
              resources:
                requests:
                  storage: 1Gi
        # k0s runs these inside its own controller process: nothing to scrape, they'd only show as down
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        # no alerting yet: nothing would deliver the alerts
        vmalert:
          enabled: false
        alertmanager:
          enabled: false
        defaultRules:
          create: false
        victoria-metrics-operator:
          admissionWebhooks:
            certManager:
              enabled: true # cert-manager issues the webhook's certificate; otherwise the chart generates a new one on every render
        grafana:
          admin:
            existingSecret: grafana-admin # manifests/admin.sops.yaml; set so the chart doesn't generate a new password on every render
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: # Grafana's Authelia client secret (manifests/oidc.sops.yaml)
              secretKeyRef:
                name: grafana-oidc
                key: client-secret
            NTFY_TOKEN: # the token of ntfy's lab user, for alerting's contact point (manifests/ntfy.sops.yaml)
              secretKeyRef:
                name: grafana-ntfy
                key: token
          grafana.ini:
            server:
              root_url: https://grafana.dawidd6.duckdns.org
            auth:
              disable_login_form: true # Authelia only, no Grafana passwords
            auth.basic:
              enabled: false
            # log in through Authelia (its grafana client); members of admins become Grafana admins, everyone else viewers
            auth.generic_oauth:
              enabled: true
              name: Authelia
              icon: signin
              client_id: grafana
              scopes: openid profile email groups
              auth_url: https://authelia.dawidd6.duckdns.org/api/oidc/authorization
              token_url: https://authelia.dawidd6.duckdns.org/api/oidc/token
              api_url: https://authelia.dawidd6.duckdns.org/api/oidc/userinfo
              auth_style: InHeader # client_secret_basic, Authelia's default for clients
              use_pkce: true
              auto_login: true # straight to Authelia, no Grafana login page
              login_attribute_path: preferred_username
              name_attribute_path: name
              groups_attribute_path: groups
              role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
          # alerts to ntfy's topic lab (ntfy/app.yaml). Grafana fills in $VARIABLES from its environment and the chart runs
          # all this through Helm's tpl, so the rules hold neither: thresholds are in the queries, and the message lists
          # the alert's labels (app, mountpoint, pod...) by itself
          alerting:
            contactpoints.yaml:
              apiVersion: 1
              contactPoints:
                - orgId: 1
                  name: ntfy
                  receivers:
                    - uid: ntfy
                      type: webhook
                      settings:
                        url: http://ntfy.ntfy.svc/lab?template=grafana # ntfy's built-in template for Grafana's alerts
                        authorization_scheme: Bearer
                        authorization_credentials: $NTFY_TOKEN
            policies.yaml:
              apiVersion: 1
              policies:
                - orgId: 1
                  receiver: ntfy
            rules.yaml:
              apiVersion: 1
              groups:
                - orgId: 1
                  name: lab
                  folder: lab
                  interval: 1m
                  # each query returns only what's wrong (nothing is fine, hence noDataState OK); B fires for any of it
                  rules:
                    - uid: app-degraded
                      title: App degraded
                      condition: B
                      for: 5m
                      noDataState: OK
                      execErrState: Error
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: VictoriaMetrics
                          model:
                            expr: argocd_app_info{health_status="Degraded"}
                            instant: true
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: A
                            conditions:
                              - evaluator:
                                  type: gt
                                  params:
                                    - 0
                    - uid: app-sync-failed
                      title: App sync failed
                      condition: B
                      for: 0s
                      noDataState: OK
                      execErrState: Error
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: VictoriaMetrics
                          model:
                            expr: sum by (name) (increase(argocd_app_sync_total{phase=~"Error|Failed"}[10m])) > 0
                            instant: true
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: A
                            conditions:
                              - evaluator:
                                  type: gt
                                  params:
                                    - 0
                    - uid: pod-crashlooping
                      title: Pod crash-looping
                      condition: B
                      for: 5m
                      noDataState: OK
                      execErrState: Error
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: VictoriaMetrics
                          model:
                            expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) # only there between restarts
                            instant: true
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: A
                            conditions:
                              - evaluator:
                                  type: gt
                                  params:
                                    - 0
                    - uid: disk-full
                      title: Disk over 85% full
                      condition: B
                      for: 15m
                      noDataState: OK
                      execErrState: Error
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: VictoriaMetrics
                          model:
                            expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint=~"/|/data/external"} / node_filesystem_size_bytes) > 85
                            instant: true
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: A
                            conditions:
                              - evaluator:
                                  type: gt
                                  params:
                                    - 0
                    - uid: hot
                      title: CPU over 85 °C or NVMe over 75 °C
                      condition: B
                      for: 10m # load spikes reach 85 °C briefly, that's fine
                      noDataState: OK
                      execErrState: Error
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: VictoriaMetrics
                          model:
                            expr: node_hwmon_temp_celsius{chip="platform_coretemp_0"} > 85 or node_hwmon_temp_celsius{chip="nvme_nvme0"} > 75
                            instant: true
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: A
                            conditions:
                              - evaluator:
                                  type: gt
                                  params:
                                    - 0

# read by root/applicationset.yaml: its charts (with values.yaml next to it) plus manifests/, and what every app shares
# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
spec:
  project: default
  destination:
    namespace: victoria-metrics
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-metrics-k8s-stack
      targetRevision: 0.95.2

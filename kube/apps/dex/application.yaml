apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.dexidp.io
      chart: dex
      targetRevision: 0.25.2
      helm:
        releaseName: dex
        valuesObject:
          config:
            issuer: https://dex.dawidd6.duckdns.org
            storage:
              type: kubernetes # Dex's own CRDs, no volume needed
              config:
                inCluster: true
            enablePasswordDB: true
            staticPasswords:
              - email: dawidd6@dawidd6.duckdns.org # the login name, needn't be a real address
                username: dawidd6
                userID: dawidd6
                hashFromEnv: DEX_PASSWORD_HASH
                groups:
                  - admins # Argo CD admin (its rbac), Homarr admin group
            staticClients:
              - id: argocd
                name: Argo CD
                secretEnv: ARGOCD_CLIENT_SECRET
                redirectURIs:
                  - https://argocd.dawidd6.duckdns.org/auth/callback
                  - http://localhost:8085/auth/callback # argocd login --sso
              - id: homarr
                name: Homarr
                secretEnv: HOMARR_CLIENT_SECRET
                redirectURIs:
                  - https://homarr.dawidd6.duckdns.org/api/auth/callback/oidc
              - id: jdownloader
                name: JDownloader
                secretEnv: JDOWNLOADER_CLIENT_SECRET
                redirectURIs:
                  - https://jdownloader.dawidd6.duckdns.org/oauth2/callback # jdownloader2/securitypolicy.yaml
          envFrom:
            - secretRef:
                name: dex-env # env.yaml (Infisical): the password hash and the clients' secrets
    - repoURL: https://github.com/dawidd6/lab # this directory's other manifests
      targetRevision: master
      path: kube/apps/dex
      directory:
        exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # CRs whose CRDs another app or this app's chart installs

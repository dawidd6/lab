# Dex's environment: your password's bcrypt hash and the clients' secrets
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: dex-env
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials # kube/infisical.sops.yaml
        secretNamespace: infisical
      secretsScope:
        projectSlug: lab
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: dex-env
      secretNamespace: dex
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          DEX_PASSWORD_HASH: '{{ .DEX_PASSWORD_HASH.Value }}'
          ARGOCD_CLIENT_SECRET: '{{ .ARGOCD_CLIENT_SECRET.Value }}'
          HOMARR_CLIENT_SECRET: '{{ .HOMARR_CLIENT_SECRET.Value }}'
          JDOWNLOADER_CLIENT_SECRET: '{{ .JDOWNLOADER_CLIENT_SECRET.Value }}'

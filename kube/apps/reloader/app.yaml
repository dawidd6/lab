# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
spec:
  project: default
  destination:
    namespace: reloader
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.18
    helm:
      valuesObject:
        reloader:
          autoReloadAll: true # restart any workload when a ConfigMap or Secret it uses changes, no per-app annotations

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: 1.9.2
      helm:
        releaseName: envoy-gateway
    - repoURL: https://github.com/dawidd6/lab # this directory's other manifests
      targetRevision: master
      path: kube/apps/envoy-gateway
      directory:
        exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # CRs whose CRDs another app or this app's chart installs

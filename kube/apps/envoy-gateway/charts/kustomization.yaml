apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-gateway # also what the chart sees as its release namespace
helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: 1.9.2
    releaseName: envoy-gateway
    valuesFile: values.yaml
    includeCRDs: true

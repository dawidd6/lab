# defaults (group, kind, weight, path match) spelled out so Argo CD's diff matches the live object; no Authelia: the
# phone apps log in to ntfy itself
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - ntfy.dawidd6.duckdns.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: ntfy
          port: 80
          weight: 1

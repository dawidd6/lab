# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy
spec:
  project: default
  destination:
    namespace: ntfy
  source:
    repoURL: ghcr.io/bjw-s-labs/helm
    chart: app-template # a generic chart for any container image (ntfy has no chart of its own)
    targetRevision: 5.3.0
    helm:
      valuesObject:
        # push notifications to phones (the ntfy app) and browsers, e.g. Grafana's alerts; users and tokens are declared here
        # and in manifests/auth.sops.yaml, nothing is set up by hand
        controllers:
          ntfy:
            containers:
              ntfy:
                image:
                  repository: docker.io/binwiederhier/ntfy
                  tag: v2.30.0
                args: [serve]
                env:
                  NTFY_BASE_URL: https://ntfy.dawidd6.duckdns.org # manifests/route.yaml
                  NTFY_BEHIND_PROXY: true
                  NTFY_CACHE_FILE: /var/lib/ntfy/cache.db # message history, so phones catch up after being offline
                  NTFY_AUTH_FILE: /var/lib/ntfy/user.db
                  NTFY_AUTH_DEFAULT_ACCESS: deny-all # nothing without logging in or a token
                  NTFY_AUTH_ACCESS: lab:lab:wo # the lab user (Grafana, with its token) may only publish to the topic lab
                  NTFY_UPSTREAM_BASE_URL: https://ntfy.sh # instant delivery to the iOS app (ntfy.sh only sees message IDs)
                envFrom:
                  - secretRef:
                      name: ntfy-auth # manifests/auth.sops.yaml: NTFY_AUTH_USERS (dawid, lab) and NTFY_AUTH_TOKENS
        service:
          ntfy:
            controller: ntfy
            ports:
              http:
                port: 80
        persistence:
          data: # the message cache and the user database (rebuilt from the config on every start)
            type: persistentVolumeClaim
            storageClass: internal
            accessMode: ReadWriteOnce
            size: 1Gi
            globalMounts:
              - path: /var/lib/ntfy

# apiVersion and kind only for Renovate's argocd manager, which reads charts from Application files
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gotify
spec:
  project: default
  destination:
    namespace: gotify
  source:
    repoURL: ghcr.io/bjw-s-labs/helm
    chart: app-template # a generic chart for any container image (Gotify has no chart of its own)
    targetRevision: 5.3.0
    helm:
      valuesObject:
        # push notifications to the phone (the Gotify app) and the web UI, which share one message list, e.g. Grafana's
        # alerts; login through Authelia only. Apps (Grafana, Gatus...) and their tokens are created in its UI: Gotify
        # generates them, nothing in its config can
        controllers:
          gotify:
            containers:
              gotify:
                image:
                  repository: docker.io/gotify/server
                  tag: 3.1.1
                env:
                  GOTIFY_SERVER_SECURECOOKIE: true # served over HTTPS (manifests/route.yaml)
                  GOTIFY_LOCALAUTH_ENABLED: false # no Gotify passwords (and so no default admin user)
                  # log in through Authelia (its gotify client); members of admins become Gotify admins
                  GOTIFY_OIDC_ENABLED: true
                  GOTIFY_OIDC_IDP_NAME: Authelia
                  GOTIFY_OIDC_ISSUER: https://authelia.dawidd6.duckdns.org
                  GOTIFY_OIDC_CLIENTID: gotify
                  GOTIFY_OIDC_CLIENTSECRET:
                    valueFrom:
                      secretKeyRef:
                        name: gotify-oidc # manifests/oidc.sops.yaml
                        key: client-secret
                  GOTIFY_OIDC_REDIRECTURL: https://gotify.dawidd6.duckdns.org/auth/oidc/callback
                  GOTIFY_OIDC_SCOPES: openid,profile,email,groups
                  GOTIFY_OIDC_GROUPS_CLAIM: groups
                  GOTIFY_OIDC_GROUPS_ADMIN: admins
                  GOTIFY_OIDC_AUTO_REDIRECT: true # straight to Authelia, no Gotify login page
        service:
          gotify:
            controller: gotify
            ports:
              http:
                port: 80
        persistence:
          data: # the database: users, apps and their tokens, messages
            type: persistentVolumeClaim
            storageClass: internal
            accessMode: ReadWriteOnce
            size: 1Gi
            globalMounts:
              - path: /app/data

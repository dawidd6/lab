# defaults (group, kind, weight, path match) spelled out so Argo CD's diff matches the live object; no Authelia at the
# gateway: the phone app and the senders' tokens need to reach Gotify directly, which does its own Authelia login
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gotify
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - gotify.dawidd6.duckdns.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: gotify
          port: 80
          weight: 1

{{- range $name, $issuer := .Values.clusterIssuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    server: {{ $issuer.server }}
    privateKeySecretRef:
      name: {{ $name }}-account-key
    solvers:
      - dns01:
          webhook:
            {{- toYaml $issuer.webhook | nindent 12 }}
{{- end }}

{{- range $name, $backup := .Values.backups }}
---
# copies a volume's files with rclone to the bucket <name>, whose versioning keeps the older copies; Secret <name>-backup
# holds the rclone.conf (section backup); restore with a ReplicationDestination
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: {{ $name }}
spec:
  sourcePVC: {{ $backup.pvc }}
  trigger:
    schedule: {{ $backup.schedule | quote }}
  rclone:
    rcloneConfig: {{ $name }}-backup
    rcloneConfigSection: backup
    rcloneDestPath: {{ $name }}
    copyMethod: Direct # openebs hostpath has no snapshots, so the mover reads the live volume
    moverSecurityContext: # the user that owns the volume's files
      runAsUser: {{ $backup.user }}
      runAsGroup: {{ $backup.user }}
      fsGroup: {{ $backup.user }}
---
# creates the bucket if it's missing and keeps versioning on, so overwritten and deleted files stay as older versions;
# runs after every sync of the app
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-backup-bucket
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20 # until the S3 server answers
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rclone
          image: docker.io/rclone/rclone:1.75.2
          command: [sh, -c]
          args:
            - rclone mkdir backup:{{ $name }} && rclone backend versioning backup:{{ $name }} Enabled
          env:
            - name: RCLONE_CONFIG
              value: /config/rclone.conf # the backup's own (Secret <name>-backup)
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          secret:
            secretName: {{ $name }}-backup
{{- end }}

{{- range $name, $backup := .Values.backups }}
---
# copies a volume's files with rclone to its bucket, which keeps older versions of overwritten and deleted files; Secret
# <name>-backup holds the rclone.conf (section backup); restore with a ReplicationDestination
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: {{ $name }}
spec:
  sourcePVC: {{ $backup.pvc }}
  trigger:
    schedule: {{ $backup.schedule | quote }}
  rclone:
    rcloneConfig: {{ $name }}-backup
    rcloneConfigSection: backup
    rcloneDestPath: {{ $backup.bucket }}
    copyMethod: Direct # openebs hostpath has no snapshots, so the mover reads the live volume
    moverSecurityContext: # the user that owns the volume's files
      runAsUser: {{ $backup.user }}
      runAsGroup: {{ $backup.user }}
      fsGroup: {{ $backup.user }}
---
# creates the bucket if it's missing (so a new app's first restore finds it, empty) and expires older versions of
# changed and deleted files after 30 days; runs with every sync of the app, alongside the rest (a PostSync hook would
# wait for the app, which waits for its restore)
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-backup-bucket
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20 # until the S3 server answers
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rclone
          image: docker.io/rclone/rclone:1.75.2
          command: [sh, -c]
          args:
            - rclone mkdir backup:{{ $backup.bucket }} && rclone backend lifecycle backup:{{ $backup.bucket }} -o daysFromHidingToDeleting=30
          env:
            - name: RCLONE_CONFIG
              value: /config/rclone.conf # the backup's own (Secret <name>-backup)
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          secret:
            secretName: {{ $name }}-backup
{{- end }}

{{- range $name, $gateway := .Values.gateways }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  annotations:
    # cert-manager creates the Certificate for the https listener
    cert-manager.io/cluster-issuer: {{ $gateway.clusterIssuer }}
spec:
  gatewayClassName: {{ $gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same # only the redirect below
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ $gateway.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $gateway.certificate }}
      allowedRoutes:
        namespaces:
          from: All
---
# every plain http request is redirected to https
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-https-redirect
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $name }}
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}

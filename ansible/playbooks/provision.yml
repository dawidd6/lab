- name: Provision OS
  hosts: servers
  tasks:
    - name: Set nopasswd for sudo group
      become: true
      community.general.sudoers:
        name: sudo-nopasswd
        group: sudo
        commands: ALL
        nopassword: true

    - name: Mount the USB drive (the ext4 filesystem labelled external) at /data/external
      become: true
      ansible.posix.mount:
        path: /data/external
        src: LABEL=external
        fstype: ext4
        opts: nofail,x-systemd.device-timeout=10s # boot without the drive instead of hanging
        state: mounted

    - name: Create k0s's systemd drop-in directory
      become: true
      ansible.builtin.file:
        path: /etc/systemd/system/k0scontroller.service.d
        state: directory
        mode: "0755"

    - name: Start k0s only with the USB drive mounted, so nothing writes to an empty /data/external on the system disk
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/k0scontroller.service.d/require-external.conf
        content: |
          [Unit]
          RequiresMountsFor=/data/external
        mode: "0644"
      notify: Reload systemd # the drop-in applies from k0s's next start

    - name: Install Tailscale
      become: true
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://tailscale.com/install.sh | sh
        creates: /usr/bin/tailscale

    - name: Bring up Tailscale
      become: true
      ansible.builtin.command: tailscale up --reset --advertise-routes={{ ansible_facts.default_ipv4.address }}/32
      async: 600
      poll: 0
      changed_when: false

    - name: Wait for Tailscale to come up or ask for a login
      become: true
      ansible.builtin.command: tailscale status --json
      register: tailscale
      until: (tailscale.stdout | from_json).BackendState == 'Running' or (tailscale.stdout | from_json).AuthURL != ''
      retries: 30
      delay: 1
      changed_when: false

    - name: Log in to the tailnet
      when: (tailscale.stdout | from_json).BackendState != 'Running'
      ansible.builtin.pause:
        prompt: "Open {{ (tailscale.stdout | from_json).AuthURL }} to add {{ inventory_hostname }} to the tailnet, then press Enter"

  handlers:
    - name: Reload systemd
      become: true
      ansible.builtin.systemd_service:
        daemon_reload: true

[settings]
lockfile = true

[env]
KUBECONFIG = "{{config_root}}/kube/.config"

[tools]
sops = "latest"
helm = "latest"
argocd = "latest"
k0sctl = "latest"
kubectl = "latest"
yq = "latest"
kubeconform = "latest"
"github:authelia/authelia" = "latest" # authelia crypto hash generate argon2, for a user's password hash
python = { version = "3.14", postinstall = "python -m pip install ansible ansible-lint" }
zizmor = "latest"
